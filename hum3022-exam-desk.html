{id:'p2q16',p:'P2',n:'16',m:3,k:'desc',topic:'m3t4',type:'Comparison',cw:['Identify'],
 q:'Identify the three pros and cons each for wide span of control and narrow span of control.',
 asks:'List three advantages and three disadvantages of a wide span, and the same for a narrow span.',
 cmd:[['Identify','State the points clearly; a table is ideal.'],['Three each','Twelve points in total.']],
 concepts:['Wide vs narrow comparison (M3·S16)','Span of control definition (M3·S14)'],
 plan:['Define wide (many per manager) and narrow (few per manager).','Draw a 2×2 table of pros and cons.'],
 ans:`<div class="tablewrap"><table><thead><tr><th></th><th>Wide span (many employees per manager)</th><th>Narrow span (few employees per manager)</th></tr></thead><tbody><tr><th scope="row">Pros</th><td>1. Quick decision making<br>2. Bureaucracy is reduced<br>3. Development of lower level (also: coordination is easy; manager feels motivated)</td><td>1. Personal contact with employees<br>2. Small, well-organized team structure<br>3. Benefit of specialization</td></tr><tr><th scope="row">Cons</th><td>1. Manager under pressure<br>2. Chances of chaos in a large team<br>3. Chances of overseeing (missing) some issue (also: technology becomes a hurdle)</td><td>1. Salaries of managers are high<br>2. Communication becomes difficult<br>3. More bureaucracy</td></tr></tbody></table></div>`,
 struct:'One comparison table: 12 points at a quarter mark each.',
 keys:['Three wide-span pros','Three wide-span cons','Three narrow-span pros','Three narrow-span cons'],
 mis:['Mixing up which side “more bureaucracy” belongs to (narrow).'],
 tip:'Remember the pairs: wide = fast but stretched; narrow = close but costly.',
 refs:'M3·S16',sup:'full'},
{id:'p2q17',p:'P2',n:'17',m:2,k:'desc',topic:'m1t8',type:'Explanation with examples',cw:['Explain'],
 q:'Explain the two basic types of moral theories in the field of normative ethics that fosters ethical decision-making with an example each?',
 asks:'Explain any two of the three moral theories, each with one example.',
 cmd:[['Explain','State what each theory holds.'],['With an example each','One concrete case per theory.']],
 concepts:['Utilitarian, rights and justice theories (M1·S81–86)'],
 plan:['Name theory 1, give its test, give a slide example.','Same for theory 2.'],
 ans:`<ol><li><b>Utilitarian theory</b> — plans and actions are evaluated by their consequences; they should produce the greatest good for the greatest number of people (M1·S81). <i>Example:</i> a pharmaceutical firm prices a life-saving drug affordably to maximize accessibility for more people (M1·S86).</li>
<li><b>Theory based on rights</b> — all people have basic rights, such as freedom of conscience, free speech and due process (M1·S82). <i>Example:</i> a tech company ensures user data privacy by refusing to sell personal information (M1·S84).</li></ol>
<p class="small">The third theory, justice, requires fairness, equity and impartiality — e.g. equal pay for equal work (M1·S83, S85).</p>`,
 struct:'Two numbered theories, one mark each: definition + example.',
 keys:['Theory 1 named and defined','Example for theory 1','Theory 2 named and defined','Example for theory 2'],
 mis:['Giving an example that fits a different theory (e.g. equal pay as “rights”).'],
 tip:'Use the slide’s own examples — each one was chosen to fit exactly one theory.',
 refs:'M1·S81–86',sup:'full'},
{id:'p2q18',p:'P2',n:'18',m:2,k:'desc',topic:'m1t11',pat:'theoryz',cw:['Elaborate'],
 q:'Elaborate on the new theory of management which was developed in the 1980s by William Ouchi.',
 ans:`<p><b>Theory Z</b>, developed by William Ouchi in the 1980s, integrates Japanese and American business practices — the Japanese emphasis on collective decision making and the American emphasis on individual responsibility (M1·S107).</p><p>It aims to increase employee loyalty by providing a job for life with a strong focus on the employee’s well-being on and off the job, and tends to promote <b>stable employment, high productivity, and high employee morale and satisfaction</b> (M1·S107).</p><p><b>Features of a Theory Z organization (M1·S108):</b> long-term employment; consensual, participative decision-making; individual responsibility; slow evaluation and promotion; implicit, informal control with explicit, formalized measures; moderately specialized career path; holistic concern, including family.</p>`,
 keys:['Named Theory Z, Ouchi, 1980s','Integrates Japanese and American practice','Loyalty, job for life, well-being on and off the job','Outcomes: stable employment, productivity, morale','At least four of the seven features'],
 refs:'M1·S107–108',sup:'full'},

);

{id:'p3q11',p:'P3',n:'11',m:4,k:'desc',topic:'m2t10',pat:'swot',cw:['Create'],
 q:'Consider these facts on brand Nestlé :\n1. Nestlé is one of the world\'s most recognized and trusted brands in the food and beverage industry.\n2. Growing middle-class populations in developing countries present a major opportunity for increased sales.\n3.The company has faced criticism over issues like child labor, water usage, and misleading marketing.\n4. The company offers a wide range of products, including dairy, beverages, confectionery, and infant nutrition.\n5. Stricter food safety laws and advertising regulations can impact operations.\n6. Nestlé relies heavily on agricultural raw materials, making it vulnerable to price fluctuations.\n7. Nestlé operates in over 180 countries, giving it a vast international footprint.\n8. Rising consumer preference for healthy, organic, and plant-based products can drive product innovation.\n9. Fluctuations in ingredient prices can affect profit margins.\n10. Nestlé has faced recalls due to quality control issues affecting consumer trust.\n11. Nestlé has an extensive and efficient supply chain, ensuring product availability worldwide.\n12. Increasing online shopping trends allow Nestlé to strengthen its direct-to-consumer sales.\n13. A shift towards fresh, organic, and local products may reduce demand for processed foods.\nCreate a SWOT analysis for the brand Nestlé based on the above facts. Also create two TOWS strategies.\n(create a labelled matrix & enter only statement numbers)',
 ans:`<div class="tablewrap"><table><thead><tr><th></th><th>Helpful</th><th>Harmful</th></tr></thead><tbody><tr><th scope="row">Internal</th><td><b>Strengths:</b> 1, 4, 7, 11</td><td><b>Weaknesses:</b> 3, 6, 10</td></tr><tr><th scope="row">External</th><td><b>Opportunities:</b> 2, 8, 12</td><td><b>Threats:</b> 5, 9, 13</td></tr></tbody></table></div>
<p class="small">Statement 6 is a weakness because the heavy reliance is Nestlé’s own; statement 9 (price fluctuations themselves) is an external threat.</p>
<h5>Two TOWS strategies</h5><ol><li><b>SO (Maxi-Maxi), 1 + 7 + 11 with 2 + 12:</b> use the trusted brand, 180-country footprint and efficient supply chain to grow sales among developing-country middle classes and through direct-to-consumer online channels — using strengths to take advantage of opportunities (M2·S77).</li>
<li><b>WO (Mini-Maxi), 10 + 3 with 8:</b> fix quality-control and marketing-practice weaknesses while launching healthy, organic and plant-based products, so the new range rebuilds consumer trust — overcoming weaknesses to take advantage of an opportunity.</li></ol>
<p class="small">Other valid pairs: ST 4 + 11 vs 13 (use the wide range and supply chain to add fresh/organic lines); WT 6 vs 9 (a joint venture with suppliers to reduce exposure to ingredient price swings — the slide’s WT options are retrenchment, liquidation or joint venture).</p>`,
 keys:['Labelled matrix (internal/external, helpful/harmful)','S = 1, 4, 7, 11','W = 3, 6, 10','O = 2, 8, 12','T = 5, 9, 13','Two named TOWS strategies citing statement numbers'],
 refs:'M2·S68–72;M2·S77',sup:'full'},
{id:'p3q12',p:'P3',n:'12',m:3,k:'desc',topic:'m1t5',pat:'fayol',cw:['Quote','Identify','Explain'],
 q:'Nexa Manufacturing Pvt Ltd, a mid-sized automobile parts manufacturer in India, was struggling with inefficiencies, declining employee morale, and poor customer satisfaction. The new CEO, Mr. Arjun Mehta, has decided to implement some changes to revamp the company. To improve efficiency, Arjun restructured the production floor, assigning specialized teams for assembly, quality control, and logistics. This reduced errors and increased productivity by 25% within six months. A single strategic plan was developed by Arjun for expansion into electric vehicle components. All departments aligned their efforts with this goal, ensuring consistency in operations and resource allocation. While key strategic decisions remained with Arjun and top management, operational autonomy was given to middle managers and team leaders, balancing efficiency with flexibility.\nQUOTE THE LINES from the case to IDENTIFY AND BRIEFLY EXPLAIN the three Henri Fayol’s Principles incorporated by the new CEO, Mr Arjun.',
 ans:`<ol><li><b>“restructured the production floor, assigning specialized teams for assembly, quality control, and logistics”</b> → <b>Division of labour</b>: work divided and allotted by expertise; specialization brings efficiency, speed and accuracy — here, fewer errors and 25% higher productivity (M1·S34).</li>
<li><b>“A single strategic plan was developed… All departments aligned their efforts with this goal”</b> → <b>Unity of direction</b>: one head, one plan for activities with a common objective, avoiding duplication of effort and wastage of resources (M1·S37–38).</li>
<li><b>“key strategic decisions remained with Arjun and top management, operational autonomy was given to middle managers and team leaders”</b> → <b>Centralization and decentralization</b>: authority retained at the top for some decisions and shared downwards for others; Fayol says neither extreme is feasible and a balance is needed (M1·S50–51).</li></ol>`,
 keys:['Division of labour + quote + specialization → efficiency','Unity of direction + quote + one plan/common goal','Centralization & decentralization + quote + balance','Principles named as in Fayol’s list'],
 refs:'M1·S34;M1·S37–38;M1·S50–51',sup:'full'},
{id:'p3q13',p:'P3',n:'13',m:3,k:'desc',topic:'m1t6',pat:'mintz',cw:['Quote','Identify','Explain'],
 q:'When Satya Nadella took over as CEO of Microsoft in 2014, through his strategic leadership and managerial approach, he successfully transformed Microsoft into a cloud-first, AI-driven technology leader. As the public face of Microsoft, Nadella represented the company at global tech summits, business conferences, and official ceremonies, reinforcing Microsoft’s brand image and values. Nadella also represented Microsoft in public statements, investor meetings, and media interactions, positioning Microsoft as an ethical and innovative technology leader. His advocacy for responsible AI and digital transformation was widely recognized. He played a crucial role in negotiating Microsoft’s partnerships and acquisitions, including the multi-billion-dollar deal with OpenAI for AI advancements and securing enterprise cloud contracts with Fortune 500 companies.\nQUOTE THE LINES from the case to IDENTIFY AND BRIEFLY EXPLAIN the three (MAIN & SUB ROLE) as defined by Henry Mintzberg which were incorporated by the new CEO, Satya Nadella.',
 ans:`<div class="tablewrap"><table><thead><tr><th>Quoted line</th><th>Main role</th><th>Sub-role and reason</th></tr></thead><tbody>
<tr><td>“As the public face of Microsoft, Nadella represented the company at global tech summits, business conferences, and official ceremonies”</td><td>Interpersonal</td><td><b>Figurehead</b> — ceremonial duties performed by virtue of being head (M1·S57)</td></tr>
<tr><td>“represented Microsoft in public statements, investor meetings, and media interactions”</td><td>Informational</td><td><b>Spokesman</b> — sends information outside the unit and satisfies influential people such as shareholders (M1·S63)</td></tr>
<tr><td>“negotiating Microsoft’s partnerships and acquisitions, including the multi-billion-dollar deal with OpenAI”</td><td>Decisional</td><td><b>Negotiator</b> — negotiations are duties of the manager’s job, not to be shirked (M1·S68)</td></tr></tbody></table></div>`,
 keys:['Figurehead (interpersonal) with quote','Spokesman (informational) with quote','Negotiator (decisional) with quote','Main and sub-role for each'],
 refs:'M1·S57;M1·S63;M1·S68',sup:'full'},
{id:'p3q14',p:'P3',n:'14',m:3,k:'desc',topic:'m1t7',pat:'csr',cw:['Provide','Explain'],
 q:'Provide one corporate example for each while explaining the three key drivers of corporate social responsibility (CSR)?',
 ans:`<p>CSR is a firm’s intention, beyond legal and economic obligations, to act in ways that are good for society (M1·S72). The slides list six drivers (M1·S75); three are explained here.</p>
<ol><li><b>The environment consciousness</b> — CSR includes taking responsibility for the company’s effects on the environment (M1·S74). <i>Example:</i> Unilever commits to 100% recyclable packaging by 2025 to reduce plastic waste.</li>
<li><b>Responsibility towards the government</b> — managers must satisfy government officials that the organization is abiding by the law (M1·S63), and CSR goes beyond what regulators require (M1·S74). <i>Example:</i> Toyota invests in hybrid and hydrogen cars to meet stricter emission laws.</li>
<li><b>Ethical marketing practices and social awareness</b> — an ethically responsible culture emphasizes professionalism and transparency and reduces unfair practices (M1·S76). <i>Example:</i> Starbucks ensures sustainable coffee sourcing through its Coffee and Farmer Equity (C.A.F.E.) Practices.</li></ol>`,
 keys:['CSR defined in one line','Three drivers named from M1·S75','Each driver explained (not just named)','A named corporate example for each'],
 refs:'M1·S63;M1·S72–76',sup:'partial',supNote:'The slides name the drivers but give no company example for any of them. The examples used here come from option texts in this same paper (Q3), not from the slides.'},
{id:'p3q15',p:'P3',n:'15',m:3,k:'desc',topic:'m2t6',type:'Diagram / structure',cw:['Draw','Illustrate'],
 q:'Draw a neat block diagram to illustrate how ‘Head of the Department at MIT’ utilizes the Process of Managing and Appraising by Objectives.',
 asks:'Reproduce the MBO system diagram, labelling the superior as the HoD and the subordinate as a faculty member, and explain the flow briefly.',
 cmd:[['Draw a neat block diagram','Boxes and arrows reproducing M2·S39.'],['Illustrate how the HoD utilizes','Show the HoD in the superior’s boxes and the faculty member in the subordinate’s boxes.']],
 concepts:['MBO system diagram (M2·S39)','MBO definition — agreed objectives (M2·S33)','Key result areas (M2·S38)'],
 plan:['Draw the top row: institution objectives & planning premises → KRAs → organization → HoD’s objectives.','Middle: HoD’s recommendation + faculty member’s statement + resources → agreement → faculty member’s objectives.','Bottom: ongoing performance ⇄ periodic review by HoD ⇄ corrective measures → final performance → final review & appraisal.','Add feedback arrows and one line of explanation.'],
 ans:`<p>In MBO, objectives are agreed by both management and employees and then used to monitor and appraise performance (M2·S33, S35). Applied to a department, the HoD is the <b>superior</b> and each faculty member the <b>subordinate</b>:</p>
<ol><li>The institution’s (enterprise) objectives and planning premises set the key result areas and the appropriate organization.</li><li>The HoD sets the department’s (superior’s) objectives.</li><li>The HoD’s preliminary recommendation of objectives, the faculty member’s own preliminary statement, and the available resources lead to <b>agreement</b> on the faculty member’s objectives.</li><li>The faculty member’s ongoing performance is reviewed periodically by the HoD, who gives corrective measures and assistance (new inputs may come in).</li><li>The final performance leads to the <b>final review and appraisal</b>, which feeds back into the next cycle of objectives.</li></ol>`,
 dia:{t:'steps',v:true,items:[['Institution objectives ⇄ Planning premises',''],['Key result areas → Appropriate organization',''],['HoD’s (superior’s) objectives',''],['HoD’s preliminary recommendation + Faculty member’s preliminary statement + Available resources','→ AGREEMENT'],['Faculty member’s (subordinate’s) objectives',''],['Ongoing performance ⇄ Periodic review by HoD ⇄ Corrective measures & HoD’s assistance','(new inputs)'],['Final performance by faculty member',''],['Final review & appraisal of performance','feeds back to the HoD’s objectives']],cap:'Block diagram adapted from M2·S39'},
 struct:'A labelled block diagram (about 2 marks) and four or five lines explaining the flow (about 1 mark).',
 keys:['Enterprise objectives, planning premises, KRAs, organization at the top','Superior (HoD) objectives','Recommendation + statement + resources → agreement','Subordinate objectives → performance → periodic review → corrective measures','Final review & appraisal with feedback loop'],
 mis:['Drawing only the four-step MBO process instead of the full system diagram.','Leaving out the agreement step — the heart of MBO.'],
 tip:'Keep the superior’s boxes on one side and the subordinate’s on the other; the agreement box in the middle makes the logic obvious.',
 refs:'M2·S33;M2·S35;M2·S39',sup:'full'},
{id:'p3q16',p:'P3',n:'16',m:3,k:'desc',topic:'m3t2',pat:'orgproc',cw:['Elaborate','Bring out'],
 q:'Elaborate the step involved in the organizing process. Bring out two differences in Formal and Informal Organization.',
 ans:`<h5>Steps in the organizing process (M3·S7)</h5><ol><li><b>Identification of activities of the organization</b> — divide the whole work into jobs so that no important activity is left out (M3·S30).</li><li><b>Organizing the activities</b> — bring together homogeneous jobs into groups (departments) (M3·S30).</li><li><b>Classification of the authority</b> — decide who has authority over each group; authority is the right of superiors to get exactness from subordinates (M1·S35).</li><li><b>Building relationship between authority and responsibility</b> — responsibility cannot be greater or less than the authority delegated (M3·S26).</li></ol>
<h5>Formal vs informal organization (M3·S12)</h5><div class="tablewrap"><table><thead><tr><th>Formal</th><th>Informal</th></tr></thead><tbody><tr><td>Designed and created by top management; planned</td><td>Comes up on its own; created spontaneously</td></tr><tr><td>Authority and responsibility fixed and defined</td><td>Authority based on personal acceptance</td></tr></tbody></table></div>`,
 keys:['Four steps in the right order','Each step explained in a line','Two formal vs informal differences'],
 refs:'M3·S7;M3·S12;M3·S26;M3·S30;M1·S35',sup:'partial',supNote:'M3·S7 gives only the four step titles. The one-line explanations borrow from related slides (M3·S30, M3·S26, M1·S35).'},
{id:'p3q17',p:'P3',n:'17',m:2,k:'desc',topic:'m1t11',pat:'theoryz',cw:['Elaborate'],
 q:'Elaborate on William Ouchi’s Management concept which tends to promote stable employment, high productivity, and high employee morale and satisfaction.',
 ans:`<p><b>Theory Z</b> (William Ouchi, 1980s) integrates Japanese and American business practices: the Japanese emphasis on collective decision making and the American emphasis on individual responsibility. It increases employee loyalty by providing a job for life with a strong focus on well-being on and off the job, and so promotes stable employment, high productivity and high morale and satisfaction (M1·S107).</p>
<div class="tablewrap"><table><thead><tr><th>Feature</th><th>Theory Z organization (M1·S108)</th></tr></thead><tbody><tr><td>Employment</td><td>Long-term</td></tr><tr><td>Decision-making</td><td>Consensual, participative</td></tr><tr><td>Responsibility</td><td>Individual</td></tr><tr><td>Evaluation & promotion</td><td>Slow</td></tr><tr><td>Control</td><td>Implicit, informal control with explicit, formalized measures</td></tr><tr><td>Career path</td><td>Moderately specialized</td></tr><tr><td>Concern</td><td>Holistic, including family</td></tr></tbody></table></div>`,
 keys:['Named Theory Z and Ouchi','Integration of Japanese and American practices','Loyalty via job for life and well-being','Four or more Z features'],
 refs:'M1·S107–108',sup:'full'},
{id:'p3q18',p:'P3',n:'18',m:2,k:'desc',topic:'m2t11',type:'Explanation',cw:['Explain'],
 q:'Explain the integration of ‘product life cycle’ into the application of Boston Box.',
 asks:'Show how each BCG quadrant corresponds to a stage of the product life cycle.',
 cmd:[['Explain the integration','Map the four quadrants to the life-cycle stages and say what it means for strategy.']],
 concepts:['Product life cycle stages (M2·S90)','BCG quadrants (M2·S92–95)','“Why BCG” — development cycles of products (M2·S89)'],
 plan:['Name the PLC stages.','Map each to a BCG quadrant with the slide wording.','Conclude on what it means for investment.'],
 ans:`<p>One use of the BCG matrix is to assess “the development cycles of products” (M2·S89). The slides’ product life cycle chart places a BCG category at each stage (M2·S90):</p>
<ul><li><b>Introduction (launch) → Question mark</b>: “most businesses start off as question marks” (M2·S92).</li><li><b>Growth (product–market fit) → Star</b>: high growth, high share; needs heavy investment (M2·S93).</li><li><b>Maturity → Cash cow</b>: “often the stars of yesterday”, in a mature industry; generates more cash than required (M2·S94).</li><li><b>Decline (end of life) → Dog</b>: “business is situated at a declining stage” (M2·S95).</li></ul>
<p>So a product typically moves question mark → star → cash cow → dog, and the investment strategy changes with the stage: invest (build) early, hold, harvest in maturity, divest in decline (M2·S96, S101).</p>`,
 dia:{t:'steps',items:[['Introduction','Question mark'],['Growth','Star'],['Maturity','Cash cow'],['Decline','Dog']]},
 struct:'A four-stage mapping (1 mark) plus one or two lines on how strategy shifts across the cycle (1 mark).',
 keys:['Introduction ↔ question mark','Growth ↔ star','Maturity ↔ cash cow','Decline ↔ dog','Strategy shifts with the stage'],
 mis:['Mapping stars to maturity.','Listing PLC stages without linking them to BCG.'],
 tip:'Draw the S-shaped life-cycle curve with the four BCG icons on it — the slide does exactly this.',
 refs:'M2·S89–96;M2·S101',sup:'full'},
{id:'p3q19',p:'P3',n:'19',m:2,k:'desc',topic:'m3t6',pat:'dept',cw:['Identify','Draw'],
 q:'At the top of the hierarchy is the Chief Executive Officer (CEO), who oversees the entire organization. Directly under the CEO, there are several Vice Presidents (VPs), each responsible for a specific function: Operations, Finance, Human Resources. Each department is further subdivided into three specialized teams (you need to name these special units), ensuring that employees with similar expertise work together under a functional Managers and assistant manager.\nIdentify the departmentation and draw the organization structure.',
 ans:`<p><b>Functional departmentation</b>: activities are grouped by function — the jobs to be done — with alike activities placed in one department under a single chain of command (M3·S36). Here the VPs head Operations, Finance and Human Resources, and each has three specialized teams under a functional manager and assistant manager.</p>`,
 dia:{t:'tree',root:{l:'CEO',c:[{l:'VP Operations',cls:'l1',c:[{l:'Functional manager → assistant manager',items:['Production planning','Purchasing','Tooling']}]},{l:'VP Finance',cls:'l1',c:[{l:'Functional manager → assistant manager',items:['Financial planning','Budgets','Cost accounting']}]},{l:'VP Human Resources',cls:'l1',c:[{l:'Functional manager → assistant manager',items:['Recruitment & selection','Training','Appraisal & compensation']}]}]}},
 keys:['Functional departmentation identified','CEO → three VPs drawn','Three named teams under each VP','Functional manager/assistant manager level shown'],
 refs:'M3·S36;M1·S24',sup:'partial',supNote:'Team names for Operations and Finance are taken from the functional chart on M3·S36. The chart gives no sub-units for personnel, so the HR team names come from the staffing activities on M1·S24 (recruiting, selecting, training, appraising, compensating).'}
);

{id:'p4q1',p:'P4',n:'1',m:0.5,k:'mcq',topic:'m1t2',pat:'mskill',type:'Scenario MCQ',cw:['Identify'],
 q:'Identify the manager whose actions reflect technical skills more than conceptual skills:',
 o:['A marketing strategist repositions a product line to target Gen Z consumers.','A factory supervisor who manually adjusts machine parameters to reduce downtime.','A CEO who envisions a 10-year expansion plan into African markets.','A product manager who shifts the company from B2C to B2B.'],
 a:1,sup:'partial',refs:'M1·S20',
 why:'Hands-on adjustment of machines is technical work, and a factory supervisor is at the bottom level, where the skill chart gives technical skill the largest share (M1·S20). The other three are whole-business, long-range moves (conceptual). The slides don’t define the skills in words.'},
{id:'p4q2',p:'P4',n:'2',m:0.5,k:'mcq',topic:'m1t1',pat:'msector',type:'Odd-one-out MCQ',cw:['Choose','NOT'],
 q:'Choose the example which is NOT a business entity:',
 o:['Swiggy expands into drone delivery for faster services.','Google introduces AI-driven ad targeting.','Government launches a women empowerment program in rural areas.','Tata Steel automates production using IoT.'],
 a:2,sup:'full',refs:'M1·S9',
 why:'A business “strives for a profit by providing goods and services desired by its customers” (M1·S9). A government welfare programme is not a profit-seeking company.'},
{id:'p4q3',p:'P4',n:'3',m:0.5,k:'mcq',topic:'m1t7',pat:'menv',type:'Odd-one-out MCQ',cw:['Choose','Odd'],
 q:'Choose the odd environmental factor:',
 o:['Flipkart uses AI to recommend products.','Britannia shifts to eco-friendly packaging.','Maruti Suzuki offers EV incentives to first-time buyers.','Infosys redesigns internal team collaboration tools.'],
 a:3,sup:'full',refs:'M1·S29;M1·S69',
 why:'A–C respond to forces outside the firm (technological, ecological, economic — M1·S69). D is an internal change: the organization’s boundary separates what is internal from what is external (M1·S29).'},
{id:'p4q4',p:'P4',n:'4',m:0.5,k:'mcq',topic:'m1t8',pat:'methics',type:'Odd-one-out MCQ',cw:['Which','NOT'],
 q:'Which of the following does NOT reflect the principles of Utilitarianism?',
 o:['A ride-sharing company adds safety features after an incident.','A pharma firm increases drug prices to maximize profit.','A telecom firm makes free calls available to its customers during a natural disaster.','A bank waives EMI for farmers during floods.'],
 a:1,sup:'full',refs:'M1·S81;M1·S86',
 why:'Utilitarianism seeks the greatest good for the greatest number (M1·S81); the slide’s example is a pharma firm pricing a life-saving drug affordably to maximize access (M1·S86). Raising prices to maximize profit is the opposite.'},
{id:'p4q5',p:'P4',n:'5',m:0.5,k:'mcq',topic:'m2t9',pat:'mblue',type:'Odd-one-out MCQ',cw:['Which','NOT'],
 q:'Which company does NOT demonstrate a Blue Ocean Strategy?',
 o:['Paytm created a mobile wallet ecosystem in India.','Xiaomi sells high-feature phones at budget prices.','Indigo Airlines focuses on low-cost domestic travel.','Zoom emerged with easy-to-use video conferencing during the pandemic.'],
 a:2,sup:'elim',refs:'M2·S58;M2·S60',
 why:'PayTm is a slide example of Blue Ocean (M2·S60). Xiaomi pairs high features with low price — differentiation and low cost together (M2·S58). Indigo competes on low cost in the existing domestic airline market — the red-ocean choice of “differentiation or low cost”. This same paper uses Indigo as a Porter cost example (Q8). No answer key was supplied.'},
{id:'p4q6',p:'P4',n:'6',m:0.5,k:'mcq',topic:'m2t3',pat:'mpersp',type:'Odd-one-out MCQ',cw:['Identify'],
 q:'Identify the incorrect planning perspective:',
 o:['A college creates a 10-year vision for global collaboration.','A student schedules a weekly self-review to improve performance.','A company sets a daily task list without aligning it to long-term goals.','A project team maps out quarterly deliverables aligned with KPIs.'],
 a:2,sup:'full',refs:'M2·S23',
 why:'Short-term plans “should fit well within and contribute to long-range plans” (M2·S23). A daily list that ignores long-term goals breaks this.'},
{id:'p4q7',p:'P4',n:'7',m:0.5,k:'mcq',topic:'m2t5',pat:'mobj',type:'Odd-one-out MCQ',cw:['Determine','Odd'],
 q:'Determine the ODD type of objective:',
 o:['Increase app downloads by 30% in 90 days.','Build a culture of continuous learning among employees.','Ensure ISO certification within the next quarter.','Expand into the UAE market by Q3.'],
 a:1,sup:'full',refs:'M2·S31;M2·S40',
 why:'A, C and D have a measurable target and deadline (verifiable, M2·S40). B is qualitative — not represented numerically (M2·S31).'},
{id:'p4q8',p:'P4',n:'8',m:0.5,k:'mcq',topic:'m2t12',pat:'mporter',type:'Odd-one-out MCQ',cw:['Pick','Odd'],
 q:'Based on Porter’s Generic Strategy, pick the odd one:',
 o:['Taj Hotels offers handcrafted luxury experiences in heritage properties for elite travelers seeking exclusivity.','D-Mart offers basic household goods at low prices, specifically catering to price-conscious urban middle-class families.','Indigo Airlines provides minimal-frill air travel focused on budget domestic routes for cost-sensitive customers.','JioBharat offers affordable mobile phones with data plans designed for rural and small-town users.'],
 a:0,sup:'full',refs:'M2·S105–107',
 why:'D-Mart, Indigo and JioBharat compete on low cost for price-sensitive segments (cost focus). Taj competes on uniqueness for an elite segment (differentiation focus, like Longines on M2·S107).'},
{id:'p4q9',p:'P4',n:'9',m:0.5,k:'mcq',topic:'m3t4',pat:'mspan',type:'Odd-one-out MCQ',cw:['Which','NOT'],
 q:'Which of the following does NOT contribute to a narrow span of control?',
 o:['Complex procedures requiring frequent manager intervention.','High degree of employee autonomy and training.','Large number of temporary staff with limited skills.','Lack of delegation from team leads.'],
 a:1,sup:'elim',refs:'M3·S14–15',
 why:'Training and delegation are listed factors (M3·S15). Complex work, low-skilled staff and no delegation all need closer control, pushing towards a narrow span; autonomous, trained employees need less. Direction is inferred from M3·S14; the slides don’t state it.'},
{id:'p4q10',p:'P4',n:'10',m:0.5,k:'mcq',topic:'m1t5',pat:'mfayol',type:'Odd-one-out MCQ',cw:['Identify'],
 q:'Identify the non-Fayol principle:',
 o:['Discipline','Scalar Chain','Specialization','Feasibility'],a:3,sup:'full',refs:'M1·S33–34',
 why:'Discipline (7) and scalar chain (11) are on Fayol’s list (M1·S33). “Feasibility” appears in no principle list on the slides. Specialization is a trap: it is Urwick’s principle name, but Fayol’s division of labour “stressed on the specialization of jobs” (M1·S34).'},
{id:'p4q11',p:'P4',n:'11',m:4,k:'desc',topic:'m2t10',pat:'swot',cw:['Create'],
 q:'Create a SWOT analysis for TATA Motors based on the following facts. Also create 2 TOWS strategies. (Use a labelled matrix with only statement numbers)\n1) Geopolitical uncertainties pose risks to Tata Motors’ global operations and supply chains.\n2) Global semiconductor shortages continue to affect vehicle availability and customer satisfaction.\n3) India’s electric vehicle market is projected to grow at 35% annually, offering expansion potential.\n4) It faces stiff competition in the SUV market from players like Hyundai and MG.\n5) It has strong R&D capabilities, with some of the best innovation centers in India.\n6) Rising competition in the EV and SUV segments could impact market share.\n7) Soaring fuel prices are accelerating consumer shift toward electric mobility.\n8) Supply chain disruptions, especially due to chip shortages, have delayed production.\n9) Tata Motors is a trusted brand for durable and reliable commercial vehicles.\n10) Tata Motors lags global competitors in offering high-end luxury features.\n11) Tata’s investment in EV infrastructure, especially through collaboration with Tata Power, supports long-term growth.\n12) The company benefits from wide service network coverage across Tier-2 and Tier-3 cities.',
 ans:`<div class="tablewrap"><table><thead><tr><th></th><th>Helpful</th><th>Harmful</th></tr></thead><tbody><tr><th scope="row">Internal</th><td><b>Strengths:</b> 5, 9, 11, 12</td><td><b>Weaknesses:</b> 8, 10</td></tr><tr><th scope="row">External</th><td><b>Opportunities:</b> 3, 7</td><td><b>Threats:</b> 1, 2, 4, 6</td></tr></tbody></table></div>
<p class="small">Judgement calls: 2 (a global shortage — external) is a threat while 8 (Tata’s own delayed production) is a weakness; 11 is Tata’s own investment, so a strength.</p>
<h5>Two TOWS strategies</h5><ol><li><b>SO (Maxi-Maxi), 5 + 11 with 3 + 7:</b> use strong R&D and the EV-infrastructure tie-up with Tata Power to capture India’s fast-growing EV market as fuel prices push buyers to electric (M2·S77).</li>
<li><b>ST (Maxi-Mini), 9 + 12 against 4 + 6:</b> use the trusted brand and Tier-2/Tier-3 service network to defend share against Hyundai, MG and new EV rivals — using strengths to cope with threats.</li></ol>
<p class="small">Other valid pairs: WO 10 with 3 (develop premium EV features for the growing market); WT 8 with 2 (a joint venture on chip supply — the slide’s WT options are retrenchment, liquidation or joint venture).</p>`,
 keys:['Labelled matrix','S = 5, 9, 11, 12','W = 8, 10','O = 3, 7','T = 1, 2, 4, 6','Two named TOWS strategies with statement numbers'],
 refs:'M2·S68–72;M2·S77',sup:'full'},
{id:'p4q12',p:'P4',n:'12',m:3,k:'desc',topic:'m1t6',pat:'mintz',cw:['Quote','Identify'],
 q:'Quote lines from the case to identify three Henry Mintzberg\'s roles applied by Zomato’s CEO. Include the main and sub-role with a brief explanation of them.\nZomato, founded in 2008, has evolved from a restaurant listing site to a major food delivery platform. The CEO actively scanned market trends and customer behavior to gather insights on the rising demand for sustainability. The CEO ensured that the initiatives, like climate-friendly packaging, and partnerships with sustainable organizations were communicated effectively within the organization, keeping employees informed and aligned with the company’s sustainability goals. When facing internal resistance due to costs, the CEO acted quickly to resolve concerns, guiding the team toward understanding the long-term benefits of sustainability.',
 ans:`<div class="tablewrap"><table><thead><tr><th>Quoted line</th><th>Main role</th><th>Sub-role and reason</th></tr></thead><tbody>
<tr><td>“actively scanned market trends and customer behavior to gather insights”</td><td>Informational</td><td><b>Monitor</b> — continuously scans the environment for information (M1·S61)</td></tr>
<tr><td>“communicated effectively within the organization, keeping employees informed”</td><td>Informational</td><td><b>Disseminator</b> — passes information to subordinates inside the unit (M1·S62)</td></tr>
<tr><td>“When facing internal resistance due to costs, the CEO acted quickly to resolve concerns”</td><td>Decisional</td><td><b>Disturbance handler</b> — responds to pressures that cannot be ignored (M1·S66)</td></tr></tbody></table></div>`,
 keys:['Monitor with quote','Disseminator with quote','Disturbance handler with quote','Main role for each (two informational, one decisional)'],
 refs:'M1·S61–62;M1·S66',sup:'full'},
{id:'p4q13',p:'P4',n:'13',m:3,k:'desc',topic:'m1t5',pat:'fayol',cw:['Quote','Identify'],
 q:'Quote lines from case to Identify three Henri Fayol principles reflected in Mark Schneider’s management. Give a brief explanation of each of them.\nIn 2017, Mark Schneider took over as the CEO of Nestlé, one of the world\'s largest food and beverage companies. Schneider implemented a clear organizational structure, ensuring that each employee had a well-defined role with clarity in the reporting line, streamlining the decision-making processes. Schneider emphasized accountability, ensuring that employees were responsible for the results of their actions, by aligning employees with their specific roles.',
 ans:`<ol><li><b>“ensuring that each employee had a well-defined role”</b> → <b>Order (social order)</b>: a specific place for everyone and everyone in a specific place; the most suitable person on the suitable job (M1·S40).</li>
<li><b>“with clarity in the reporting line, streamlining the decision-making processes”</b> → <b>Unity of command</b>: each subordinate receives orders from and is accountable to one boss, avoiding confusion and overlapping (M1·S36). (A clear chain from top to bottom also reflects the <b>scalar chain</b>, M1·S46.)</li>
<li><b>“emphasized accountability, ensuring that employees were responsible for the results of their actions”</b> → <b>Authority and responsibility</b>: responsibility is the obligation for performance of the job assigned, and it must go hand in hand with authority (M1·S35).</li></ol>`,
 keys:['Order (or division of labour) with quote','Unity of command (or scalar chain) with quote','Authority & responsibility with quote','Brief explanation of each'],
 refs:'M1·S35–36;M1·S40;M1·S46',sup:'full',supNote:'The case is short, so more than one principle can fit a line; defensible alternatives are shown in brackets.'},
{id:'p4q14',p:'P4',n:'14',m:3,k:'desc',topic:'m1t10',pat:'intl',cw:['Bring out'],
 q:'Bring out six differences in Korean Management style and Japanese Management style.',
 ans:`<div class="tablewrap"><table><thead><tr><th>Aspect</th><th>Korean</th><th>Japanese</th></tr></thead><tbody>
<tr><td>Decision-making</td><td>Top-down, hierarchical</td><td>Consensus-driven, participative</td></tr>
<tr><td>Employment practices</td><td>Focus on loyalty and seniority</td><td>Lifetime employment, loyalty</td></tr>
<tr><td>Workplace relationships</td><td>Emphasis on hierarchy and respect for elders</td><td>Emphasis on group harmony and team cohesion</td></tr>
<tr><td>Leadership style</td><td>Authoritative, paternalistic</td><td>Facilitative, consensus-oriented</td></tr>
<tr><td>Motivation</td><td>Loyalty to company, respect for authority</td><td>Group harmony, job security</td></tr>
<tr><td>Performance evaluation</td><td>Based on seniority and loyalty</td><td>Group performance and seniority</td></tr>
<tr><td>CSR</td><td>Emerging importance</td><td>High importance, integrated into business practices</td></tr></tbody></table></div>
<p class="small">Communication (both indirect, high-context) and work-life balance (both long hours) are similarities, so they are not listed as differences.</p>`,
 keys:['Decision-making','Employment practices','Workplace relationships','Leadership style','Motivation / conflict resolution / training','Performance evaluation / CSR'],
 refs:'M1·S102–103',sup:'full'},
{id:'p4q15',p:'P4',n:'15',m:3,k:'desc',topic:'m2t2',pat:'plans',cw:['Give'],
 q:'The plans made by the top-level manager will differ from the ones that lower managers make. Give one example for top-level and lower level for the SIX types of plans used by a FMCG firm.',
 asks:'For six of the plan types, give one example of the plan a top-level manager would make and one a lower-level manager would make in an FMCG company.',
 cmd:[['Give one example… for SIX types','A table: plan type | top-level example | lower-level example.']],
 ans:`<p>All managers plan, but plans made by top-level managers differ from those of lower managers (M2·S8): upper levels make strategic plans for the whole organization; lower levels make tactical plans for specific parts (M2·S21–22).</p>
<div class="tablewrap"><table><thead><tr><th>Type (M2·S8)</th><th>Top-level manager</th><th>Lower-level manager</th></tr></thead><tbody>
<tr><td>Objective</td><td>Raise national market share by 5% next fiscal year</td><td>Raise one sales territory’s monthly sales by 10%</td></tr>
<tr><td>Strategy</td><td>Enter rural markets with low-priced small packs (strategy is generally reserved for the top, M2·S12)</td><td>A distribution plan to supply those packs to village retailers (supports the strategy)</td></tr>
<tr><td>Policy</td><td>Buy raw materials from the lowest of three qualified bidders (slide example)</td><td>Promote line supervisors from within the plant (slide example: promoting from within)</td></tr>
<tr><td>Procedure</td><td>Step-by-step approval sequence for launching a new product</td><td>Step-by-step order-dispatch sequence at the warehouse</td></tr>
<tr><td>Rule</td><td>No sharing of price lists with distributors without approval</td><td>No smoking in the production area (slide example)</td></tr>
<tr><td>Budget</td><td>Annual capital-expenditure budget for a new plant</td><td>Monthly labour-hours and machine-hours budget for a packing line (slide units)</td></tr></tbody></table></div>`,
 keys:['Top vs lower distinction stated (strategic vs tactical)','Six plan types named from M2·S8','A top-level example for each','A lower-level example for each'],
 refs:'M2·S8;M2·S12–18;M2·S21–22',sup:'partial',supNote:'The question says six types; the slides list eight (M2·S8) — any six are acceptable. The slides give the definitions and the top-vs-lower distinction but no FMCG examples; the FMCG examples here are illustrations built on the slide definitions (slide examples are marked).'},
{id:'p4q16',p:'P4',n:'16',m:3,k:'desc',topic:'m3t6',pat:'dept',cw:['Identify','Draw','Bring out'],
 q:'Identify the type of departmentation used and draw a neat structure of the same. Bring out the two pros for this structure.\nThe new startup IT firm has recruited employees based on their specialized expertise in software development, network administration, quality assurance (QA), cybersecurity, and database management. In its early stages, the firm has secured three clients, each with distinct needs. The first client, a local shop, requires a payment app, while the second client, a fashion house, needs a new e-commerce platform. Both projects require the firm’s full range of functional expertise. The third client, a financial firm, requires cloud migration support, which only necessitates the involvement of the network administration and database management teams.',
 ans:`<p><b>Matrix departmentation</b>: functional groups (by expertise) are combined with project groups (one per client) in the same structure — a horizontal set of project reporting relationships superimposed on a functional hierarchy (M3·S44–45).</p>
<h5>Two pros</h5><ol><li><b>Keeps the strengths of functional grouping</b> — specialists stay grouped by expertise, which enables in-depth knowledge and skill development and economies of scale (M3·S38), while each client still gets a dedicated project team.</li><li><b>Each project draws only the expertise it needs</b> — as in the slide’s grid, where projects use different sets of functions (M3·S45): the cloud-migration client uses only network administration and database management.</li></ol>`,
 dia:`<div class="tablewrap"><table><thead><tr><th></th><th>Software dev.</th><th>Network admin</th><th>QA</th><th>Cybersecurity</th><th>Database mgmt</th></tr></thead><tbody><tr><th scope="row">Local shop — payment app</th><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td></tr><tr><th scope="row">Fashion house — e-commerce</th><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td></tr><tr><th scope="row">Financial firm — cloud migration</th><td></td><td>●</td><td></td><td></td><td>●</td></tr></tbody></table></div><div class="cap">Matrix grid in the style of M3·S45: functions across the top, client projects down the side.</div>`,
 keys:['Matrix departmentation identified with the reason','Grid of five functions × three projects','Third project using only network admin and database','Two pros explained'],
 refs:'M3·S38;M3·S44–45',sup:'partial',supNote:'The slides define matrix departmentation and draw its grid, but list no pros. Both pros here are reasoned from the slide definition (combination of functional and project patterns) and the functional strengths on M3·S38.'},
{id:'p4q17',p:'P4',n:'17',m:2,k:'desc',topic:'m1t7',type:'Explanation',cw:['Provide'],
 q:'Provide a brief explanation of how external environmental factors such as ethical considerations and social influences impact organizational functioning.',
 asks:'Explain how outside ethical and social forces affect the way an organization works.',
 cmd:[['Provide a brief explanation','Two or three focused points, not a long essay.']],
 concepts:['Six external-environment factors (M1·S69)','Open system: dependent on and vulnerable to the environment (M1·S28–29)','Society expects responsible and ethical behaviour; CSR (M1·S70–72)','Institutionalizing ethics (M1·S87)'],
 plan:['Place ethical and social among the six external factors.','Explain the open-system link.','Show the impact: CSR expectations and institutionalized ethics.'],
 ans:`<p>Ethical and social factors are two of the six external-environment factors around an organization, alongside technological, economic, ecological, and political and legal (M1·S69).</p>
<ul><li><b>Open system:</b> the organization depends on its external environment for inputs, is responsive to environmental effects and vulnerable to changes in the environment (M1·S28–29) — so shifts in social or ethical expectations change what it must do.</li>
<li><b>Social influence:</b> society expects organizations and managers to be responsible and ethical (M1·S70); firms respond through CSR — acting beyond legal and economic obligations in ways good for society (M1·S72).</li>
<li><b>Ethical influence:</b> managers institutionalize ethics through a code of ethics, an ethics committee and ethics teaching, integrating ethical concepts with daily actions (M1·S87).</li></ul>`,
 struct:'Two or three points of two lines each, anchored to the open-system idea.',
 keys:['Ethical and social named as external factors (six factors)','Open system / vulnerable to environmental change','Social: expectation of responsibility → CSR','Ethical: institutionalizing ethics'],
 mis:['Writing only about CSR without linking it to the environment.','Treating internal culture as an external factor.'],
 tip:'Start from the systems approach: once you say the organization is an open system, every environmental impact follows.',
 refs:'M1·S28–29;M1·S69–72;M1·S87',sup:'partial',supNote:'M1·S69 names the six factors but does not explain them; the explanation links them to the systems-approach, CSR and ethics slides.'},
{id:'p4q18',p:'P4',n:'18',m:2,k:'desc',topic:'m2t7',type:'Diagram / structure',cw:['Illustrate'],
 q:'With a neat block diagram, illustrate the Strategic Planning Process.',
 asks:'Draw the strategic planning process as a block diagram with its main boxes and flow.',
 cmd:[['Illustrate with a neat block diagram','The diagram carries the marks; keep labels exact.']],
 concepts:['Strategic planning definition (M2·S46)','Process boxes (M2·S47)'],
 plan:['Inputs and claimants’ goals on the left.','Enterprise profile, top management orientation, purpose and objectives.','External threats/opportunities and internal strengths/weaknesses.','Alternate strategies → evaluation & choice → planning, implementation, structure → leadership, control.','Consistency testing and contingency planning as feedback.'],
 ans:`<p><b>Strategic planning</b> is the process of developing the strategy or direction and action plan to achieve the goals of an organization (M2·S46).</p>`,
 dia:{t:'steps',v:true,items:[['Inputs (people, capital, managerial skills, technology skills) + goals of claimants (employees, consumers, suppliers, stockholders, governments, community, others)',''],['Enterprise profile ⇄ Top management orientation (values + vision) ⇄ Purpose & major objectives','(industry analysis feeds in)'],['Present & future external threats & opportunities + Internal strengths & weaknesses',''],['Development of alternate strategies',''],['Evaluation & strategic choice',''],['Medium & short-run planning · Implementation · Re-engineering organization structure (staffing)',''],['Leadership · Control','Consistency testing & contingency planning feed back across all stages']],cap:'After M2·S47'},
 struct:'Definition line + neat block diagram (most marks go to the diagram).',
 keys:['Inputs and claimants’ goals','Enterprise profile / top management orientation / purpose','Threats & opportunities and strengths & weaknesses','Alternate strategies → evaluation & choice','Implementation, planning, structure, leadership & control','Consistency testing & contingency planning'],
 mis:['Drawing only SWOT.','Leaving out the implementation and control end of the process.'],
 tip:'Draw left to right in columns — inputs, analysis, choice, implementation — then add one feedback arrow labelled “consistency testing & contingency planning”.',
 refs:'M2·S46–47',sup:'full'},
{id:'p4q19',p:'P4',n:'19',m:2,k:'desc',topic:'m3t4',type:'Case: quote & identify',cw:['Identify','Justify','Suggest'],
 q:'Identify the span of control used in this case by Sneha. Justify your pick with valid reasoning from case scenarios. Suggest how Sneha can solve this problem.\nThe manager, Sneha, had to constantly guide her national marketing team, who were inexperienced and unsure of their responsibilities and constant changes in the system made things worse. Since the team lacked training and couldn’t make decisions on their own, Sneha had to spend most of her time solving small issues. Communication was poor, and tasks were often repeated due to confusion.',
 asks:'Say whether Sneha is working with a narrow or wide span, justify it from the case using the span factors, and suggest remedies.',
 cmd:[['Identify','Name the span.'],['Justify','Link case lines to span factors.'],['Suggest','Give remedies based on the same factors.']],
 concepts:['Span of control (M3·S14)','Eight factors (M3·S15)','Narrow-span features (M3·S16)'],
 plan:['Identify narrow span (close supervision).','Justify with three factors from the case.','Suggest remedies that fix those factors.'],
 ans:`<p><b>Narrow span (close supervision).</b> Sneha must “constantly guide” the team and spend “most of her time solving small issues” — the case describes a manager who cannot let go of detail.</p>
<p><b>Justification (factors on M3·S15):</b> <b>subordinates’ training</b> — “inexperienced… lacked training”; <b>delegation of authority</b> — they “couldn’t make decisions on their own”; <b>rate of change</b> — “constant changes in the system”; <b>communication techniques</b> — “communication was poor… tasks repeated due to confusion”.</p>
<p><b>Suggestions:</b> train the team; clearly define each person’s responsibilities (functional definition, M3·S28); delegate authority once they are trained (M3·S25); improve communication techniques; and plan changes so the system is stable. This lets Sneha widen her span without losing control (M3·S14).</p>`,
 struct:'One line identifying the span, three quoted factors as justification, two or three remedies.',
 keys:['Narrow span / close supervision identified','At least two factors linked to case lines','Remedies: training, delegation, clear responsibilities, communication'],
 mis:['Only describing the problem without naming factors.','Remedies that don’t match the factors.'],
 tip:'Mirror the factors: each problem factor you name should have a matching remedy.',
 refs:'M3·S14–16;M3·S25;M3·S28',sup:'partial',supNote:'The eight factors are listed on M3·S15 without their direction; the link between each factor and a narrow span is reasoning from M3·S14.'}
);

 o:['In an HDFC Bank branch, most of the newly joined junior officers lack essential training...','In Infosys consulting projects, almost all clients often need changes rapidly...','At Maruti Suzuki’s assembly plant, all workers handle repetitive and standardized tasks…','At State Bank of India’s back-office suffers with weak communication systems…'],

{id:'p5q10',p:'P5',n:'10',m:0.5,k:'mcq',topic:'m3t5',pat:'murwick',type:'Scenario MCQ',cw:['Identify'],co:'CO3 · Bloom’s level 3',
 q:'Identify the corporate that reflects Urwick’s Principle of Flexibility',

{id:'p5q11',p:'P5',n:'11',m:4,k:'desc',topic:'m2t10',pat:'swot',cw:['Make','Come up with'],co:'CO2 · Bloom’s level 5',
 q:'From the facts given, make a SWOT analysis for Hindustan Unilever and then come up with two strategies addressing their weakness.\n1) 45% sales depend on rural markets, linked to monsoons.\n2) Backed by Unilever’s R&D and global expertise.\n3) Brands like Dove, Lux, Surf Excel each earn ₹1,000+ crore yearly.\n4) Criticized for being a major plastic waste producer in India.\n5) E-commerce growth via Nykaa, Amazon, Flipkart.\n6) Growth of Patanjali, Dabur, Marico, ITC.\n7) HUL’s distribution spans 8+ million outlets across India.\n8) Raw material volatility (palm oil, crude, packaging).\n9) Regulations on plastics raise costs, add risks.\n10) Dependence on Unilever’s global innovation limits India-specific product development.\n11) Rising demand for natural/ayurvedic products.\n12) Urban shift to premium, organic, and healthy products.',
 ans:`<div class="tablewrap"><table><thead><tr><th></th><th>Helpful</th><th>Harmful</th></tr></thead><tbody><tr><th scope="row">Internal</th><td><b>Strengths:</b> 2, 3, 7</td><td><b>Weaknesses:</b> 1, 4, 10</td></tr><tr><th scope="row">External</th><td><b>Opportunities:</b> 5, 11, 12</td><td><b>Threats:</b> 6, 8, 9</td></tr></tbody></table></div>
<h5>Two strategies addressing the weaknesses</h5><ol><li><b>WO (Mini-Maxi), 10 with 11 + 12:</b> reduce dependence on global innovation by developing India-specific natural/ayurvedic and premium organic products — a developmental strategy to overcome a weakness and use opportunities (M2·S77).</li>
<li><b>WT (Mini-Mini), 4 with 9:</b> cut plastic packaging to reduce both the criticism and the rising regulatory cost — minimizing a weakness and a threat together (M2·S77).</li></ol>
<p class="small">Also valid: WO 1 with 5 — grow e-commerce sales to lessen reliance on monsoon-linked rural demand.</p>`,
 keys:['Labelled matrix','S = 2, 3, 7','W = 1, 4, 10','O = 5, 11, 12','T = 6, 8, 9','Two weakness-based strategies (WO/WT) with numbers'],
 refs:'M2·S68–72;M2·S77',sup:'full'},
{id:'p5q12',p:'P5',n:'12',m:3,k:'desc',topic:'m1t6',pat:'mintz',cw:['Quote','Identify','Mention'],co:'CO1 · Bloom’s level 4',
 q:'Quote lines from the case to identify three Henry Mintzberg’s roles applied by Byju Raveendran (Byju’s founder). Mention main & sub-role with explanation. Byju Raveendran, founder of Byju’s, began his journey by teaching mathematics to small student groups in Bengaluru. As the company grew, he inaugurated new offices and personally met students and parents to build trust in the brand. As Byju’s expanded internationally, he represented Byju’s at global forums like the World Economic Forum and in-media interviews, where he explained how digital learning could democratize education for millions of Indian students. To finance rapid growth, Raveendran frequently had intense bargaining over valuation, equity stake, and growth strategy with top venture capital firms. Through his skills, Byju’s secured billions in funding, making it India’s most valued EdTech startup.',
 ans:`<div class="tablewrap"><table><thead><tr><th>Quoted line</th><th>Main role</th><th>Sub-role and reason</th></tr></thead><tbody>
<tr><td>“he inaugurated new offices and personally met students and parents”</td><td>Interpersonal</td><td><b>Figurehead</b> — ceremonial duties as head, like ribbon-cutting ceremonies on the slide (M1·S57)</td></tr>
<tr><td>“represented Byju’s at global forums like the World Economic Forum and in-media interviews”</td><td>Informational</td><td><b>Spokesman</b> — sends information to people outside the unit (M1·S63)</td></tr>
<tr><td>“intense bargaining over valuation, equity stake, and growth strategy with top venture capital firms”</td><td>Decisional</td><td><b>Negotiator</b> — negotiations are duties of the manager’s job (M1·S68)</td></tr></tbody></table></div>`,
 keys:['Figurehead with quote','Spokesman with quote','Negotiator with quote','Main role for each'],
 refs:'M1·S57;M1·S63;M1·S68',sup:'full'},
{id:'p5q13',p:'P5',n:'13',m:3,k:'desc',topic:'m1t5',pat:'fayol',cw:['Quote','Identify'],co:'CO1 · Bloom’s level 4',
 q:'Quote lines from the case to identify three Henry Fayol’s Principles with an explanation for each. Ritesh Agarwal founded OYO Rooms in 2013 with the vision of standardizing budget hotels across India. OYO established a clear hierarchy from hotel staff → cluster manager → city head → regional head → central leadership. This allowed smooth communication, quick decision-making, and efficient handling of customer and partner issues during its rapid expansion phase. As the company scaled rapidly, every hotel partner and employee had a single reporting line to the cluster or city head, which reduced confusion and ensured accountability in operations. To manage its workforce, OYO offered long-term roles to its core technology and operations teams. This reduced attrition among skilled staff and gave the company a stable base to support its fast-growing hotel network across India and overseas.',
 ans:`<ol><li><b>“a clear hierarchy from hotel staff → cluster manager → city head → regional head → central leadership”</b> → <b>Scalar chain</b>: the chain of superiors from the ultimate authority to the lowest, through which every order and message passes (M1·S46).</li>
<li><b>“every hotel partner and employee had a single reporting line to the cluster or city head, which reduced confusion”</b> → <b>Unity of command</b>: one boss for each subordinate; dual subordination creates confusion and escaping of responsibility (M1·S36).</li>
<li><b>“offered long-term roles to its core technology and operations teams. This reduced attrition”</b> → <b>Stability of tenure</b>: employees should not be moved frequently; time is needed to succeed in a job, and stability builds belongingness (M1·S45).</li></ol>`,
 keys:['Scalar chain with quote','Unity of command with quote','Stability of tenure with quote','Explanation of each'],
 refs:'M1·S36;M1·S45–46',sup:'full'},
{id:'p5q14',p:'P5',n:'14',m:3,k:'desc',topic:'m1t10',type:'Explanation',cw:['Explain'],co:'CO1 · Bloom’s level 2',
 q:'Country’s culture impacts on the behavior of employees and subsequently on the management practices. Explain three dimensions in this regard with Indian perspective.',
 asks:'Explain three of the five culture dimensions and relate each to India.',
 cmd:[['Explain three dimensions','Name each dimension and say what it means for employee behaviour.'],['With Indian perspective','Relate each dimension to Indian workplaces.']],
 concepts:['Five dimensions (M1·S93–97)','Managers must understand cultural environments to succeed (M1·S98)'],
 plan:['Open with the slide statement that culture shapes behaviour and management practice.','Name three dimensions.','Explain each using what the sources provide.','Add the Indian perspective only where sources support it.'],
 ans:`<p>A country’s culture impacts the behaviour of employees and subsequently the management practices; the slides group these behaviours into five dimensions, and managers need to understand cultural environments to succeed where they do business (M1·S93–98).</p>
<ol><li><b>Individualism vs collectivism</b> (M1·S93). PYQ statements describe individualism as people focusing on their own interests and those close to them, and collectivism as relationships mattering more than task orientation (Nov 2024 Q4, Sep 2024 Q4).</li>
<li><b>Large vs small power distance</b> (M1·S94). PYQ statements: large power distance → high respect for authority with emphasis on titles; small → less emphasis on authority, titles and ranks.</li>
<li><b>Masculinity vs femininity</b> — the slide’s own gloss is “aggressive vs passive goal behaviour” (M1·S96); PYQ statements add that femininity favours quality of life and concern for others’ welfare.</li></ol>
<p><b>Indian perspective:</b> Not sufficiently covered in the provided slides — no slide places India on any dimension.</p>`,
 struct:'One opening line, then three numbered dimensions; the Indian perspective would normally be one line per dimension.',
 keys:['Culture → employee behaviour → management practice','Three dimensions named correctly','A description for each','Indian perspective (not available in slides)'],
 mis:['Inventing country scores or claims not in the sources.'],
 tip:'If you use this in an exam, name the dimensions exactly as the slide does — “uncertainty tolerance vs avoidance”, not a paraphrase.',
 refs:'M1·S93–98',sup:'low',supNote:'The slides only name the five dimensions (plus the masculinity/femininity gloss). The descriptions here come from statements in the Sep 2024 and Nov 2024 MCQs, and no source gives an Indian perspective.'},
{id:'p5q15',p:'P5',n:'15',m:3,k:'desc',topic:'m2t2',pat:'plans',cw:['Identify','Explain'],co:'CO2 · Bloom’s level 3',
 q:'From BoAt Lifestyle corporate practices, Identify the three types of PLANS incorporated by them. Explain the significance of these identified plans.\nBoAt Lifestyle enforces a strict code of conduct and anti-harassment compliance. It focuses on long-term growth in digital transformation and AI services to stay competitive globally. It follows a practice of recruiting 35–40% of its workforce through campus placements every year, ensuring a steady talent pipeline.',
 ans:`<ol><li><b>“enforces a strict code of conduct and anti-harassment compliance”</b> → <b>Rules</b>: very specific statements defining action or non-action, with no flexibility; compulsory for all, with severe consequences if broken (M2·S16). <i>Significance:</i> guarantees uniform conduct without room for interpretation.</li>
<li><b>“focuses on long-term growth in digital transformation and AI services to stay competitive globally”</b> → <b>Strategy</b>: a complete, all-inclusive plan with long-term objectives, a chosen course of action and resources allocated; reserved for top management (M2·S12). <i>Significance:</i> gives the whole company one direction for competing.</li>
<li><b>“follows a practice of recruiting 35–40% of its workforce through campus placements every year”</b> → <b>Policy</b>: a general understanding that guides decision making, often implied from managers’ actions — like “the practice of promoting from within” or “hiring university-trained engineers” (M2·S13–14). <i>Significance:</i> keeps hiring decisions consistent with objectives and settles issues before they become problems.</li></ol>`,
 keys:['Rules with quote and definition','Strategy with quote and definition','Policy with quote and definition','Significance of each'],
 refs:'M2·S12–16',sup:'full'},
{id:'p5q16',p:'P5',n:'16',m:3,k:'desc',topic:'m3t6',pat:'dept',cw:['Identify','Sketch'],co:'CO3 · Bloom’s level 3',
 q:'This type of departmentation allows economies of scale, promotes in-depth knowledge and skill development, and enables the organization to accomplish its functional goals. Identify the department structure and sketch a neat organizational chart for the same.',
 ans:`<p><b>Functional departmentation.</b> Its strengths on M3·S38 are exactly the three in the question: allows economies of scale within functional departments, enables in-depth knowledge and skill development, and enables the organization to accomplish functional goals. It is the most widely used form: activities that are alike are grouped in one department under a single chain of command (M3·S36).</p>`,
 dia:{t:'tree',root:{l:'President',c:[{l:'Marketing',cls:'l1',items:['Research','Marketing planning','Advertising & promotion','Sales']},{l:'Engineering',cls:'l1',items:['Preliminary design','Electrical engg.','Mechanical engg.','Quality']},{l:'Finance',cls:'l1',items:['Financial planning','Budgets','General accounting','Cost accounting']},{l:'Production',cls:'l1',items:['Production planning','Industrial engg.','Purchasing','Tooling']}]}},
 keys:['Functional departmentation identified','Link to the three strengths on M3·S38','Chart: top head → functional departments → sub-units'],
 refs:'M3·S36;M3·S38',sup:'full'},
{id:'p5q17',p:'P5',n:'17',m:2,k:'desc',topic:'m1t4',type:'Diagram / structure',cw:['Apply'],co:'CO1 · Bloom’s level 3',
 q:'Apply the ‘Systems Approach to Management’ concept with a neat block diagram to help Zomato to interact with its external environment, considering its inputs, transformation processes, and outputs.',
 asks:'Draw the systems-approach diagram with Zomato as the organization: inputs from the environment, transformation through managerial functions, outputs back to the environment, with communication and feedback.',
 cmd:[['Apply… with a neat block diagram','Draw the slide diagram and label it for Zomato.']],
 concepts:['Systems approach bullets (M1·S28)','Diagram inputs/outputs (M1·S28)','Open system, sub-systems, super system (M1·S29–30)'],
 plan:['Draw inputs → transformation (five functions) → outputs.','Add goal inputs of claimants and the external environment.','Add communication and the feedback (reenergizing) loop.','One line on why Zomato is an open system.'],
 ans:`<p>Zomato is an <b>open system</b>: it depends on its external environment for inputs, transforms them through the managerial functions and returns outputs to the environment; communication links every phase, and some outputs become inputs again (M1·S28–30).</p>
<ul><li><b>Inputs:</b> human, capital, managerial, technological; goal inputs of claimants — employees, consumers, suppliers (restaurant partners), stockholders, governments, community.</li><li><b>Transformation:</b> planning → organizing → staffing → leading → controlling.</li><li><b>Outputs:</b> products, services (food delivery), profits, satisfaction, goal integration.</li><li><b>Feedback:</b> customer and partner responses re-enter as inputs (reenergizing the system).</li></ul>`,
 dia:{t:'steps',items:[['Inputs','Human, capital, managerial, technological + goals of claimants (customers, restaurant partners, investors, government, community)'],['Transformation','Planning → organizing → staffing → leading → controlling, facilitated by communication'],['Outputs','Services (food delivery), profits, satisfaction, goal integration'],['Feedback','Outputs return as new inputs; external variables: opportunities, constraints']],cap:'Block diagram after M1·S28, labelled for Zomato'},
 struct:'Block diagram (most marks) + two lines on the open system and feedback.',
 keys:['Inputs from the environment (incl. claimants)','Transformation through the five functions','Outputs back to the environment','Communication and feedback loop','Labelled for Zomato'],
 mis:['Drawing a closed box with no environment.','Putting profits or satisfaction on the input side.'],
 tip:'Label claimants with Zomato’s real stakeholders (customers, restaurant partners, delivery partners, investors) — that is the “apply” part.',
 refs:'M1·S28–30',sup:'full'},
{id:'p5q18',p:'P5',n:'18',m:2,k:'desc',topic:'m2t11',pat:'bcgcase',cw:['Conduct'],co:'CO2 · Bloom’s level 4',
 q:'Conduct a Boston Box analysis for these two brands of Dabur India with their corresponding strategies.\n• Dabur Chyawanprash – Holds over 50% market share in the Indian immunity supplement category, which is growing at around 20–24% annually due to the rising health consciousness.\n• Dabor Real Juice – Once very popular but now has only 6–8% market share, while the packaged juice market grows at a slow pace of 2% annually, with strong competition from Tropicana, Paper Boat, and ITC.',

<li><b>Real Juice — Dog</b>: low share (6–8%) in a slow-growth market (2%) with strong competitors. Strategy: <b>divest</b> (or harvest what cash remains) — dogs are cash traps with weak position and limited potential; most analysts recommend they be divested (M2·S95–96).</li></ol>`,
 dia:{t:'quad',y:'Market growth rate',x:'Relative market share',xl:['Low','High'],cells:[['Question mark',''],['Star','Dabur Chyawanprash (50%+ share, 20–24% growth) → build/hold'],['Dog','Real Juice (6–8% share, 2% growth) → divest'],['Cash cow','']]},

{id:'p5q19',p:'P5',n:'19',m:2,k:'desc',topic:'m3t2',pat:'orgproc',cw:['Explain'],co:'CO3 · Bloom’s level 2',
 q:'Explain the four-step process of organizing with an example.',
 ans:`<ol><li><b>Identification of activities of the organization</b> — list all the work so no important activity is left out (M3·S30). <i>Example (a college fest):</i> sponsorship, events, publicity, hospitality.</li>
<li><b>Organizing the activities</b> — group homogeneous jobs into units (M3·S30): a sponsorship team, an events team, a publicity team.</li>
<li><b>Classification of the authority</b> — decide who has authority over each unit: a head for each team reporting to the fest convenor.</li>
<li><b>Building relationship between authority and responsibility</b> — each head gets authority equal to the responsibility for the team’s results, neither more nor less (M3·S26).</li></ol>`,
 keys:['Four steps in order','One consistent example across steps','Authority and responsibility linked in step 4'],
 refs:'M3·S7;M3·S26;M3·S30',sup:'partial',supNote:'M3·S7 gives only the step titles; the explanations draw on M3·S26 and S30, and the college-fest example is an illustration.'}
);
