<title>HUM 3022 Exam Desk</title>
<meta name="description" content="Source-bound study site for HUM 3022 Essentials of Management: lessons, PYQs, flashcards and mock exams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e4e9f1;
  --ink:#141b26; --ink-2:#465264; --ink-3:#6b7686; --line:#d6dce6; --line-2:#c3ccd9;
  --accent:#2440a8; --accent-ink:#ffffff; --accent-soft:#e7ecfb; --accent-line:#b8c5f0;
  --margin:#c4403a; --margin-soft:#fbeceb; --rule:#dfe6f1;
  --m1:#2f5bd3; --m2:#0f8f6a; --m3:#d4622b;
  --m1-soft:#e6ecfb; --m2-soft:#e2f3ed; --m3-soft:#fbece3;
  --ok:#1b7a4a; --ok-soft:#e3f3ea; --bad:#b3342f; --bad-soft:#fbe9e8; --warn:#8a5d00; --warn-soft:#fbf1dc;
  --shadow:0 1px 2px rgba(20,27,38,.06),0 4px 14px rgba(20,27,38,.06);
  --radius:10px; --radius-s:6px;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hdr:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e131a; --surface:#151c25; --surface-2:#1b2430; --surface-3:#23303e;
    --ink:#e7ecf3; --ink-2:#aab5c4; --ink-3:#8290a2; --line:#2a3544; --line-2:#3a4757;
    --accent:#9db0ff; --accent-ink:#0e131a; --accent-soft:#1d2744; --accent-line:#3b4e8c;
    --margin:#f07a70; --margin-soft:#3a1f1f; --rule:#223040;
    --m1:#6f8cf0; --m2:#2aa57c; --m3:#dc6f36;
    --m1-soft:#1c2645; --m2-soft:#13302a; --m3-soft:#36231a;
    --ok:#5cc98a; --ok-soft:#15301f; --bad:#f07a7a; --bad-soft:#3a1c1c; --warn:#e5b94e; --warn-soft:#352a12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e131a; --surface:#151c25; --surface-2:#1b2430; --surface-3:#23303e;
  --ink:#e7ecf3; --ink-2:#aab5c4; --ink-3:#8290a2; --line:#2a3544; --line-2:#3a4757;
  --accent:#9db0ff; --accent-ink:#0e131a; --accent-soft:#1d2744; --accent-line:#3b4e8c;
  --margin:#f07a70; --margin-soft:#3a1f1f; --rule:#223040;
  --m1:#6f8cf0; --m2:#2aa57c; --m3:#dc6f36;
  --m1-soft:#1c2645; --m2-soft:#13302a; --m3-soft:#36231a;
  --ok:#5cc98a; --ok-soft:#15301f; --bad:#f07a7a; --bad-soft:#3a1c1c; --warn:#e5b94e; --warn-soft:#352a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1[tabindex="-1"]:focus,main[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:100}
.skip:focus{left:12px;top:12px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.2rem);font-weight:600;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.15rem;font-weight:600}
h4{font-size:1rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--hdr);display:flex;align-items:center;gap:10px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;font-weight:600;flex:none}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);white-space:nowrap}
.hdr-sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.searchbtn{min-width:200px;justify-content:flex-start;color:var(--ink-3)}
.searchbtn kbd{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-3)}
.menubtn{display:none}
.hprog{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.hprog .bar{width:90px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.hprog .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:calc(100vh - var(--hdr))}
.side{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100vh - var(--hdr));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 40px}
.main{min-width:0;padding-inline:16px;padding-block:28px 80px;overflow-wrap:break-word}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wrap.wide{max-width:1040px}
.scrim{display:none}
@media (max-width: 980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:60;left:0;top:0;height:100%;width:min(320px,86vw);transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow);padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:55}
  .menubtn{display:inline-flex}
  .searchbtn{min-width:0}
  .searchbtn .lbl,.searchbtn kbd{display:none}
  .hprog .bar{width:56px}
}
@media (max-width: 560px){
  .brand-sub{display:none}
  .hprog .pct{display:none}
  .main{padding-block:20px 72px}
}

/* ---------- sidebar nav ---------- */
.nav-sec{margin:6px 0 14px}
.nav-h{padding:6px 10px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.nav a,.nav button.navlink{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-size:.9rem;line-height:1.35;background:none;border:0;cursor:pointer}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.cur{background:var(--accent-soft);color:var(--ink);font-weight:500}
.nav .dot{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.nav .dot.done{background:var(--ok);border-color:var(--ok)}
.nav .dot.done::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.nav-mod{margin-top:4px}
.nav-mod>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem}
.nav-mod>summary::-webkit-details-marker{display:none}
.nav-mod>summary:hover{background:var(--surface-2)}
.nav-mod>summary .chev{margin-left:auto;transition:transform .15s;color:var(--ink-3)}
.nav-mod[open]>summary .chev{transform:rotate(90deg)}
.nav-mod .sub{padding-left:8px;border-left:2px solid var(--line);margin-left:17px}
.modtag{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.68rem;font-weight:600;padding:1px 6px;border-radius:4px;color:#fff;flex:none}
.modtag.m1{background:var(--m1)}.modtag.m2{background:var(--m2)}.modtag.m3{background:var(--m3)}
:root[data-theme="dark"] .modtag{color:#0e131a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modtag{color:#0e131a}}
.minibar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin:2px 10px 6px 34px}
.minibar i{display:block;height:100%}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card.tight{padding:14px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500;text-decoration:none;font-size:.95rem}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pyq .ptop .chip,.metaline .chip,.qcard .qh .chip{white-space:normal;text-align:left;border-radius:10px}
.chip.ref{font-family:var(--f-mono);font-size:.72rem;background:transparent}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.chip{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:4px;text-transform:uppercase}
.pill.full{background:var(--ok-soft);color:var(--ok)}
.pill.partial{background:var(--warn-soft);color:var(--warn)}
.pill.low,.pill.gap{background:var(--bad-soft);color:var(--bad)}
.pill.elim{background:var(--accent-soft);color:var(--accent)}
.pill.amb{background:var(--warn-soft);color:var(--warn)}
.pill.hi{background:var(--margin-soft);color:var(--margin)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--ink-3);font-family:var(--f-mono);font-size:.78rem;padding-top:2px}
.kv dd{margin:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-s)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
thead th{background:var(--surface-2);font-weight:600;font-size:.85rem}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cap{font-size:.82rem;color:var(--ink-3);margin-top:6px}

/* ---------- page heads ---------- */
.phead{display:flex;flex-direction:column;gap:10px}
.phead .crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phead p.lede{font-size:1.06rem;color:var(--ink-2);max-width:65ch}
.metaline{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- lesson blocks ---------- */
.lesson{display:flex;flex-direction:column;gap:16px}
.lesson>p,.lesson li{max-width:70ch}
.lesson h3{margin-top:10px;padding-top:6px}
.lesson ul,.lesson ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.lesson strong,.kw{font-weight:600}
.kw{background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.start{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.start .eyebrow{color:var(--accent)}
.box{border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface)}
.box .bt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.box.mnemo{background:var(--m2-soft);border-color:transparent}.box.mnemo .bt{color:var(--m2)}
.box.remember{background:var(--surface-2);border-color:transparent}.box.remember .bt{color:var(--ink-2)}
.box.confuse{background:var(--warn-soft);border-color:transparent}.box.confuse .bt{color:var(--warn)}
.box.gap{background:var(--bad-soft);border-color:transparent}.box.gap .bt{color:var(--bad)}
.box.discrep{background:var(--margin-soft);border-color:transparent}.box.discrep .bt{color:var(--margin)}
.box.three{border:1.5px solid var(--ink)}
.box.three ol{padding-left:1.2em}
.box.trigger{flex-direction:row;align-items:baseline;gap:10px;background:transparent;border:1px dashed var(--line-2)}
.box.trigger .bt{flex:none}
.quote{border-left:3px solid var(--line-2);padding:4px 0 4px 14px;color:var(--ink-2);font-style:italic}
.quote .src{font-style:normal;display:block;margin-top:4px}
.bridge{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--ink-2);padding:10px 14px;border-radius:var(--radius-s);background:var(--surface-2)}
.bridge b{color:var(--ink);font-weight:600}

/* steps flow */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:st}
.flow .st{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.flow .st .n{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);font-weight:600}
.flow .st b{font-size:.93rem;line-height:1.3}
.flow .st span{font-size:.86rem;color:var(--ink-2);line-height:1.45}
.vflow{display:flex;flex-direction:column;gap:0}
.vflow .st{display:grid;grid-template-columns:34px 1fr;gap:10px;padding-bottom:14px;position:relative}
.vflow .st::before{content:"";position:absolute;left:16px;top:30px;bottom:0;width:2px;background:var(--line)}
.vflow .st:last-child::before{display:none}
.vflow .num{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;border:1px solid var(--accent-line)}
.vflow .tx b{display:block}
.vflow .tx span{color:var(--ink-2);font-size:.93rem}

/* tree / org chart */
.diagram{overflow-x:auto;padding:4px 0}
.dcap{font-size:.82rem;color:var(--ink-3);text-align:center;margin-top:4px}
.tree{display:flex;justify-content:center;min-width:max-content;padding:6px}
.tree ul{position:relative;display:flex;justify-content:center;gap:0;padding:18px 0 0;margin:0;list-style:none}
.tree li{position:relative;display:flex;flex-direction:column;align-items:center;padding:18px 6px 0}
.tree>ul{padding-top:0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;width:50%;height:18px;border-top:1.5px solid var(--line-2)}
.tree li::before{right:50%}
.tree li::after{left:50%;border-left:1.5px solid var(--line-2)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:18px}
.tree li:only-child>.nd{position:relative}
.tree li:only-child>.nd::before{content:"";position:absolute;top:-18px;left:50%;height:18px;border-left:1.5px solid var(--line-2)}
.tree>ul>li:only-child{padding-top:0}
.tree>ul>li:only-child>.nd::before{display:none}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:1.5px solid var(--line-2);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:18px;border-left:1.5px solid var(--line-2)}
.tree .nd{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:.82rem;line-height:1.3;text-align:center;max-width:170px;min-width:90px}
.tree .nd.root{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.tree .nd.l1{background:var(--accent-soft);border-color:var(--accent-line);font-weight:500}
.tree .nd.col{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;background:var(--surface-2)}
.tree .nd.col i{font-style:normal;font-size:.78rem;border-left:2px solid var(--line-2);padding-left:6px}


/* specificity guards so list styles inside lessons/PYQs don't break diagrams */
.diagram .tree ul{display:flex;flex-direction:row;justify-content:center;gap:0;padding:18px 0 0;margin:0;list-style:none;max-width:none}
.diagram .tree>ul{padding-top:0}
.diagram .tree li{max-width:none}
.cats .cat ul{list-style:none;margin:0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:4px}

/* quadrant */
.quad{display:grid;grid-template-columns:34px 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;max-width:620px;margin:0 auto}
.quad .ylab{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.quad .cell{border-radius:8px;padding:12px;min-height:96px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.quad .cell b{font-size:.95rem}
.quad .cell span{font-size:.84rem;color:var(--ink-2);line-height:1.45}
.quad .xlab{grid-column:2/4;text-align:center;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.quad .ax{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);text-align:center}
.q-a{background:var(--m1-soft)}.q-b{background:var(--m2-soft)}.q-c{background:var(--m3-soft)}.q-d{background:var(--surface-2)}

/* category grid */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cat h4{font-family:var(--f-body);font-size:.88rem;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.cat ul{list-style:none;margin:0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.cat.c1 h4{background:var(--m1-soft)}.cat.c2 h4{background:var(--m2-soft)}.cat.c3 h4{background:var(--m3-soft)}

/* pyramid */
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:560px;margin:0 auto}
.pyr div{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:6px;padding:6px 10px;text-align:center;font-size:.85rem}
.pyr div b{display:block;font-size:.9rem}

/* bars (skill chart) */
.skillchart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:560px;margin:0 auto}
.skillchart .col{display:flex;flex-direction:column;gap:3px}
.skillchart .seg{display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:.78rem;font-weight:500;color:var(--ink)}

  ['Quaternary','Incorporate a high degree of research and technology and employ highly qualified people (e.g. biotechnology, computer programming)']], cap:'M1·S12–13'},
 {t:'table', head:['Industry (slide exercise)','Primary','Secondary','Tertiary'], rows:[
  ['Car manufacturing','','✓',''],['Retailing','','','✓'],['Coal-mining','✓','',''],['Iron and steel industry','✓','',''],['Teaching','','','✓'],['Farming','✓','',''],['Fishing','✓','',''],['Dentistry','','','✓']], cap:'Ticks exactly as marked on M1·S14'},
 {t:'discrep', h:`M1·S14 ticks <b>iron and steel industry</b> as <b>primary</b>, while M1·S12 defines secondary industries as those that “process and manufacture products from raw materials”. The site shows the tick as the slide marks it. If an exam asks, state the S12 definitions and mention how you applied them.`},
 {t:'mnemo', title:'the sector chain', h:`<b>Pull → Shape → Serve → Search</b>: Primary pulls resources from earth or sea, Secondary shapes them into products, Tertiary serves customers, Quaternary searches (research and technology with highly qualified people).`},
 {t:'check', id:'c-m1t1-1', kind:'mcq', topic:'m1t1', q:'A company shifts from providing basic services to offering specialized, research-based knowledge services. Which move is this?', o:['Primary → Secondary','Secondary → Tertiary','Tertiary → Quaternary','Primary → Quaternary'], a:2, why:'Services are tertiary (M1·S12); a high degree of research and technology with highly qualified people is quaternary (M1·S13).'},
 {t:'check', id:'c-m1t1-2', kind:'classify', topic:'m1t1', q:'Sort each statement as a business or an industry (M1·S11).', cats:['Business','Industry'], items:[['Tesla launches a new model to grow its profits',0],['The technology sector is growing rapidly',1],['Apple offers products to its customers for profit',0],['Automotive trade is transforming with EVs',1]], why:'A business is an individual company aiming at profit; an industry is a group of companies producing similar goods or services.'}
 ]},
/* ---------------- T2 ---------------- */
{id:'m1t2', title:'Managers: levels and managerial skills', slides:'M1·S15–20', density:'Medium',
 why:'A skill MCQ opens all 7 papers (which skill does this person show?).',
 from:'A business is an organization pursuing profit. Managers are the people who direct it.',
 to:'Managers at every level do the same five jobs. Next: the functions of managers.',
 blocks:[
 {t:'start', h:`Managers direct the activities of others. They sit at three levels (top, middle, low), and every manager needs three skills (conceptual, human, technical) in different proportions.`},
 {t:'quote', h:`Managers are individuals in an organization who direct the activities of others.`, ref:'M1·S16'},
 {t:'p', h:`To say who managers are, the slides first define an <b>organization</b>: <i>“a deliberate arrangement of people brought together to accomplish some specific purpose.”</i> <span class="chip ref">M1·S16</span>`},
 {t:'quote', h:`A manager is an individual responsible for planning, organizing, leading, and controlling resources and activities within an organization to achieve specific goals. Managers play a crucial role in ensuring that their team or department operates efficiently and effectively, aligning with the overall objectives of the organization.`, ref:'M1·S17'},
 {t:'h', h:'Three levels of management'},
 {t:'pyr', rows:['<b>TOP</b>executive coaching, change management, leadership, delegation & empowerment etc.','<b>MIDDLE</b>problem solving, team building, talent development, performance management etc.','<b>LOW LEVEL</b>emotional intelligence and coaching for performance etc.'], cap:'Levels of management and what each level focuses on · M1·S18'},
 {t:'h', h:'Three managerial skills and how they vary by level'},
 {t:'html', h:`<div class="diagram"><div class="skillchart" role="img" aria-label="Skill mix by level: bottom mostly technical, top mostly conceptual, middle balanced">
  <div class="col"><div class="seg c" style="height:30px">Conceptual</div><div class="seg h" style="height:70px">Human</div><div class="seg t" style="height:90px">Technical</div><div class="lvl">BOTTOM</div></div>
  <div class="col"><div class="seg c" style="height:60px">Conceptual</div><div class="seg h" style="height:62px">Human</div><div class="seg t" style="height:68px">Technical</div><div class="lvl">MIDDLE</div></div>
  <div class="col"><div class="seg c" style="height:98px">Conceptual</div><div class="seg h" style="height:58px">Human</div><div class="seg t" style="height:34px">Technical</div><div class="lvl">TOP</div></div>
 </div><div class="dcap">Redrawn from “Skill Requirement in Managers” · M1·S20 (block heights approximate the slide)</div></div>`},
 {t:'remember', h:`Read the chart top-down: <b>conceptual grows as you go up</b>, <b>technical shrinks as you go up</b>, and <b>human stays substantial at every level</b>.`},
 {t:'gap', h:`M1·S19–20 name the three skills and show their mix by level, but no slide defines them in words. The PYQ options describe them this way: conceptual skills — “understand and integrate all organizational functions”; technical skills — “understand the work of subordinates”; human skills — “interact effectively with various stakeholders” (Sep 2024 Q1 options). Use these phrases with care; they come from question options, not slides.`},
 {t:'gap', h:`“Importance of management for an engineer” (M1·S15) is an audio case (Sneha vs John — “which team will you join, and why?”). The audio is not in the PDF, so its content cannot be taught here.`},
 {t:'check', id:'c-m1t2-1', kind:'mcq', topic:'m1t2', q:'According to the skill chart on M1·S20, which skill takes the largest share at the TOP level?', o:['Technical','Human','Conceptual','All three are equal'], a:2, why:'At the top, conceptual is the biggest block and technical the smallest; at the bottom it is the reverse.'},
 {t:'check', id:'c-m1t2-2', kind:'match', topic:'m1t2', q:'Match each level to what M1·S18 lists for it.', pairs:[['Top','Change management, leadership, delegation & empowerment'],['Middle','Problem solving, team building, talent development, performance management'],['Low level','Emotional intelligence and coaching for performance']], why:'Straight from the levels-of-management pyramid on M1·S18.'}
 ]},
/* ---------------- T3 ---------------- */
{id:'m1t3', title:'Functions of managers', slides:'M1·S21–26', density:'Medium',
 why:'Underpins everything: the systems approach, Chapter 2 (planning) and Chapter 3 (organizing) all hang on these functions. Tested directly in the Mar 2026 MCQ on functions.',
 from:'Managers exist at three levels with different skill mixes.',
 to:'The functions work together as one system. Next: the systems approach to management.',
 blocks:[
 {t:'start', h:`Every manager does five things in sequence: <b>plan</b> what to achieve, <b>organize</b> the roles, <b>staff</b> those roles with people, <b>lead</b> the people, and <b>control</b> results against the plan.`},
 {t:'steps', v:true, items:[
  ['Planning','Selecting missions and objectives as well as the actions to achieve them; it requires decision-making, which is choosing future courses of action from among alternatives. (M1·S22)'],
  ['Organizing','Establishing an intentional structure of roles for people to fill in an organization — intentional in making sure all tasks necessary to accomplish goals are assigned, and assigned to people who can do them best. (M1·S23)'],
  ['Staffing','Filling and keeping filled the positions in the organization structure: identifying workforce requirements; inventorying the people available; and recruiting, selecting, placing, promoting, appraising, compensating, and training so that tasks are accomplished effectively and efficiently. (M1·S24)'],
  ['Leading','Influencing people so that they will contribute to organizational and group goals; predominantly the interpersonal aspect of managing. Since leadership implies followership, and people follow those who offer means of satisfying their own needs, leading involves motivation, leadership styles and approaches, and communication. (M1·S25)'],
  ['Controlling','Measuring and correcting individual and organizational performance to ensure that events conform to plans: measuring performance against goals and plans, showing where deviations from standards exist, and helping to correct them. Planning must precede controlling, but plans are not self-achieving. (M1·S26)']]},
 {t:'mnemo', title:'P-O-S-L-C as one sentence', h:`<b>Plan</b> the goal → <b>Organize</b> the roles → <b>Staff</b> the roles → <b>Lead</b> the people → <b>Control</b> the results. Each step needs the one before it: you cannot staff roles that were never organized, or control against a plan that doesn’t exist.`},
 {t:'confuse', title:'organizing vs staffing', h:`Organizing creates the <b>structure of roles</b>. Staffing <b>fills</b> those roles (recruiting, selecting, placing, promoting, appraising, compensating, training). HR activities such as recruiting belong to staffing in these slides.`},
 {t:'discrep', h:`The manager definition on M1·S17 lists <b>four</b> functions (planning, organizing, leading, controlling). The functions slides M1·S21–26 and the term-project slide M1·S5 list <b>five</b>, adding staffing. When asked for “functions of managers”, write all five and note that staffing is sometimes folded into organizing.`},
 {t:'check', id:'c-m1t3-1', kind:'fill', topic:'m1t3', q:'Controlling is ___ and correcting individual and organizational performance to ensure that events conform to ___.', a:[['measuring'],['plans','plan']], why:'M1·S26.'},
 {t:'check', id:'c-m1t3-2', kind:'order', topic:'m1t3', q:'Arrange the functions of managers in the order the slides present them.', items:['Planning','Organizing','Staffing','Leading','Controlling'], why:'M1·S22–26. Planning must precede controlling.'},
 {t:'check', id:'c-m1t3-3', kind:'mcq', topic:'m1t3', q:'“Identifying workforce requirements and recruiting, selecting and training people” is which function?', o:['Organizing','Staffing','Leading','Planning'], a:1, why:'M1·S24 defines staffing with exactly these activities.'}
 ]},
/* ---------------- T4 ---------------- */
{id:'m1t4', title:'Systems approach to management', slides:'M1·S27–30', density:'Medium',
 why:'Tested as MCQs (Sep 2024, Nov 2024, Mar 2026) and a 2-mark block diagram (Sep 2025: apply it to Zomato).',
 from:'The five functions are what managers do.',
 to:'Within the system, managers follow principles. Next: Fayol’s 14 principles of management.',
 blocks:[
 {t:'start', h:`Treat the organization like a machine that takes <b>inputs</b> from outside, <b>transforms</b> them through the five managerial functions, and sends <b>outputs</b> back outside. Some outputs come back as inputs, and communication links every stage.`},
 {t:'list', title:'Key points (M1·S28)', items:['Organization is an <b>open system</b>','Dependent on its <b>external environment for inputs</b>','Various inputs are <b>transformed through the managerial functions</b>','<b>Communication</b> is essential to all phases','Some of the outputs <b>become inputs again</b>']},
 {t:'html', h:`<div class="diagram"><div style="min-width:560px;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;align-items:stretch">
  <div class="cat c1"><h4>Inputs</h4><ul><li>Human</li><li>Capital</li><li>Managerial</li><li>Technological</li><li>Others</li><li style="margin-top:6px"><b>Goal inputs of claimants:</b> employees, consumers, suppliers, stockholders, governments, community, others</li></ul></div>
  <div class="cat"><h4>Transformation (managerial functions)</h4><ul><li>Managerial knowledge, goals of claimants, use of inputs</li><li>→ Planning</li><li>→ Organizing</li><li>→ Staffing</li><li>→ Leading</li><li>→ Controlling</li><li>→ to produce outputs</li><li style="margin-top:6px"><i>Facilitated by communication that also links the organization with the external environment</i></li></ul></div>
  <div class="cat c3"><h4>Outputs</h4><ul><li>Products</li><li>Services</li><li>Profits</li><li>Satisfaction</li><li>Goal integration</li><li>Others</li></ul></div>
 </div>
 <div style="min-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
  <div class="cat"><h4>External environment</h4><ul><li>External variables and information: opportunities, constraints, others</li></ul></div>
  <div class="cat"><h4>Feedback loop</h4><ul><li>“Reenergizing the system”: outputs flow back to become inputs</li></ul></div>
 </div><div class="dcap">Redrawn from the systems-approach diagram on M1·S28 (source credited there to Koontz, Weihrich & Cannice)</div></div>`},
 {t:'h', h:'The reading slides (M1·S29–30)'},
 {t:'list', items:[
  'An organization consists of many <b>sub-systems</b>, all mutually related; the sub-parts should be studied in their inter-relationships rather than in isolation.',
  'The organization provides a <b>boundary</b> that separates it from other systems and determines which parts are internal and which are external. It is responsive to environmental effects and vulnerable to changes in the environment.',
  'An organization is a system of many interrelated and interdependent parts, arranged orderly according to some scheme so that it is <b>more than the sum of the parts</b>.',
  'It draws inputs (energy, information, materials, finance etc.) from its environment, transforms them, and returns output to the environment as goods and services.',
  '<b>Every system is a part of a super system.</b>',
  'It is an <b>open system</b> and a <b>dynamic system</b>, as the equilibrium in it is always changing. Management is expected to regulate and adjust the system to secure better performance.',
  'Management is <b>multidisciplinary</b>: it draws and integrates knowledge from various disciplines.']},
 {t:'note', h:`M1·S29–30 are labelled “Your reading”, yet PYQs test the systems approach three times. Treat it as examinable.`},
 {t:'confuse', title:'inputs vs outputs', h:`<b>Capital</b> is an input. <b>Products, services, profits, satisfaction and goal integration</b> are outputs (M1·S28). The Mar 2026 paper asked exactly this.`},
 {t:'check', id:'c-m1t4-1', kind:'classify', topic:'m1t4', q:'Sort each item into input or output on the M1·S28 diagram.', cats:['Input','Output'], items:[['Capital',0],['Goal integration',1],['Technological',0],['Satisfaction',1],['Human',0],['Profits',1]], why:'Inputs: human, capital, managerial, technological, others. Outputs: products, services, profits, satisfaction, goal integration, others.'},
 {t:'check', id:'c-m1t4-2', kind:'mcq', topic:'m1t4', q:'Which statement is consistent with the systems approach?', o:['Operate the organization as a closed system for better control','Study each department in isolation','Integrate internal sub-systems and respond to the external environment','Standardize everything regardless of the environment'], a:2, why:'The organization is an open system whose sub-systems are studied in their inter-relationships and which is responsive to its environment (M1·S28–30).'}
 ]},
/* ---------------- T5 ---------------- */
{id:'m1t5', title:'Henri Fayol’s 14 principles of management', slides:'M1·S31–52', density:'High',
 why:'A 3-mark “quote the lines and identify the principles” case appears in every one of the 7 papers.',
 from:'The organization is a system that managers run.',
 to:'Principles guide managers; Mintzberg describes what managers actually spend time doing. Next: the 10 managerial roles.',
 blocks:[
 {t:'start', h:`Fayol, the “Father of Modern Management Theory”, gave 14 principles that apply to all levels of management and every department. In exams you read a case, quote a line, name the principle, and explain it in one or two sentences.`},
 {t:'p', h:`A <b>principle</b> is a fundamental truth that establishes a cause-and-effect relationship between two or more variables in a given situation and guides thought and action. Management principles are statements of fundamental truth based on logic which provide guidelines for managerial decision making and actions. They are derived from <b>observation and analysis</b> (practical experience of managers) and from <b>experimental studies</b>. <span class="chip ref">M1·S31–32</span>`},
 {t:'table', head:['#','Principle','Core idea (slide wording)'], rows:[
  ['1','Division of labour','Work divided and subdivided and allotted to persons according to their expertise; specialization leads to efficiency and economy, speed and accuracy.'],
  ['2','Authority & responsibility','Co-existing. Authority = right of superiors to get exactness from subordinates; responsibility = obligation for performance of the job assigned. Authority without responsibility → irresponsible behaviour; responsibility without authority → ineffective person.'],
  ['3','Unity of command (one boss)','A subordinate receives orders from, and is accountable to, one and only one boss at a time.'],
  ['4','Unity of direction (one plan)','One head – one plan for a group of activities having similar objectives.'],
  ['5','Equity','Combination of fairness, kindness and justice; managers fair and impartial with subordinates.'],
  ['6','Order','Systematic arrangement of things (material order) and people (social order).'],
  ['7','Discipline','Sincerity, obedience, respect of authority and observance of rules and regulations.'],
  ['8','Initiative','Eagerness to initiate actions without being asked to do so.'],
  ['9','Fair remuneration','Remuneration fair, reasonable, satisfactory and rewarding of the efforts.'],
  ['10','Stability of tenure','Employees should not be moved frequently from one job position to another.'],
  ['11','Scalar chain','The chain of superiors ranging from the ultimate authority to the lowest.'],
  ['12','Subordination of individual interest to general interest','Interest of the undertaking prevails; in conflict the individual must sacrifice for bigger interests.'],
  ['13','Esprit de corps','Team spirit: harmony in work groups and mutual understanding.'],
  ['14','Centralization & decentralization','Concentration of authority at the top vs sharing authority downwards; a balance is needed.']], cap:'M1·S33, detailed on S34–52'},
 {t:'mnemo', title:'chunk the 14 into three bundles', h:`<b>Structure & authority (6):</b> division of labour, authority & responsibility, unity of command, unity of direction, scalar chain, centralization & decentralization.<br><b>Fair treatment of people (5):</b> equity, fair remuneration, stability of tenure, initiative, esprit de corps.<br><b>Order & conduct (3):</b> order, discipline, subordination of individual interest.<br>6 + 5 + 3 = 14. When a case line talks about <i>reporting lines</i> look in bundle 1; about <i>pay, fairness, long roles or teamwork</i> look in bundle 2; about <i>rules, places for things or putting the company first</i> look in bundle 3.`},
 {t:'h', h:'1 · Division of labour'},
 {t:'list', items:['Fayol stressed the specialization of jobs.','Work of all kinds must be divided and subdivided and allotted to various persons according to their expertise in a particular area.','Subdivision of work makes it simpler and results in efficiency; it helps the individual acquire speed and accuracy.','Specialization leads to efficiency and economy in spheres of business. (M1·S34)']},
 {t:'h', h:'2 · Authority and responsibility'},
 {t:'list', items:['Authority and responsibility are co-existing: if authority is given to a person, he should also be made responsible, and vice versa.','Authority = the right of superiors to get exactness from their subordinates; responsibility = obligation for the performance of the job assigned. They must go hand in hand.','Authority without responsibility leads to irresponsible behaviour; responsibility without authority makes the person ineffective. (M1·S35)']},
 {t:'h', h:'3 · Unity of command (principle of one boss)'},
 {t:'p', h:`A subordinate should receive orders and be accountable to one and only one boss at a time. Dual subordination should be avoided unless absolutely essential, because it:`},
 {t:'cats', cats:[{h:'Dual subordination…',items:['undermines authority','weakens discipline','divides loyalty','creates confusion']},{h:'…and causes',items:['delays and chaos','escaping responsibilities','duplication of work','overlapping of efforts']}], cap:'M1·S36'},
 {t:'p', h:`Unity of command provides a disciplined, stable and orderly existence and creates a harmonious relationship between superiors and subordinates.`},
 {t:'h', h:'4 · Unity of direction (principle of one plan)'},
 {t:'list', items:['ONE HEAD – ONE PLAN: one plan for a group of activities having similar objectives.','Related activities should be grouped together, with one plan of action, under the charge of a particular manager.','Efforts of all members should be directed towards a common goal.','Without unity of direction, unity of action cannot be achieved. In fact, unity of command is not possible without unity of direction. (M1·S37)']},
 {t:'table', head:['Basis','Unity of command','Unity of direction'], rows:[
  ['Meaning','A subordinate should receive orders and instructions from only one boss','One head, one plan for a group of activities having similar objectives'],
  ['Nature','Related to the functioning of personnel','Related to the functioning of departments, or the organization as a whole'],
  ['Necessity','Necessary for fixing responsibility of each subordinate','Necessary for sound organization'],
  ['Advantage','Avoids conflicts, confusion and chaos','Avoids duplication of efforts and wastage of resources'],
  ['Result','Better superior–subordinate relationship','Smooth running of the enterprise']], cap:'M1·S38'},
 {t:'confuse', title:'one boss vs one plan', h:`“Each engineer reported to only one senior lead” → <b>unity of command</b> (people). “A single strategic plan; all departments aligned to it” → <b>unity of direction</b> (activities/departments).`},
 {t:'check', id:'c-m1t5-1', kind:'mcq', topic:'m1t5', q:'“Every hotel partner and employee had a single reporting line to the cluster or city head, which reduced confusion.” Which principle?', o:['Scalar chain','Unity of command','Unity of direction','Order'], a:1, why:'A single reporting line = one boss (M1·S36). Scalar chain is about the whole chain from top to bottom.'},
 {t:'h', h:'5 · Equity'},
 {t:'list', items:['Equity means a combination of fairness, kindness and justice.','Managers should be fair and impartial while dealing with subordinates; it creates and maintains cordial relations.','Equity does not mean total absence of harshness: “at times force and harshness might become necessary for the sake of equity”. (M1·S39)']},
 {t:'h', h:'6 · Order'},
 {t:'list', items:['Proper and systematic arrangement of things and people.','<b>Material order</b> — a safe, appropriate and specific place for every article, and every place effectively used for a specific activity and commodity.','<b>Social order</b> — selection and appointment of the most suitable person on the suitable job; a specific place for everyone and everyone in a specific place, so they can be contacted whenever need arises. (M1·S40)']},
 {t:'table', head:['Japanese 5S','English translation','American 5S standard'], rows:[['Seiri','Put things in order','Sort'],['Seiton','Proper arrangement','Straighten, set in order, simplify'],['Seiso','Clean','Shine, scrub, sweep'],['Seiketsu','Purity','Standardize'],['Shitsuke','Commitment','Sustain, discipline']], cap:'5S is a workplace organization method using five Japanese words; shown under principle 6 (Order) · M1·S41'},
 {t:'h', h:'7 · Discipline'},
 {t:'list', items:['“Discipline means sincerity, obedience, respect of authority & observance of rules and regulations of the enterprise.”','Subordinates should respect superiors and obey orders — and discipline is required of management too.','It can be enforced if there are good superiors at all levels, clear and fair agreements with workers, and sanctions (punishments) judiciously applied. (M1·S42)']},
 {t:'h', h:'8 · Initiative'},
 {t:'list', items:['Workers should be encouraged to take initiative: eagerness to initiate actions without being asked.','Management should give employees the opportunity to suggest ideas, experiences and new methods of work.','It builds trust and understanding and adds to zeal and energy; encouraged through monetary and non-monetary incentives. (M1·S43)']},
 {t:'h', h:'9 · Fair remuneration'},
 {t:'list', items:['The quantum and method of remuneration should be fair, reasonable, satisfactory and rewarding of the efforts, satisfying both employer and employees.','Wages based on cost of living, work assigned, financial position of the business, prevailing wage rate etc.','Fayol also recommended other benefits such as free education, medical and residential facilities. (M1·S44)']},
 {t:'h', h:'10 · Stability of tenure'},
 {t:'list', items:['Employees should not be moved frequently from one job position to another; the period of service in a job should be fixed.','“Time is required for an employee to get used to a new work & succeed in doing it well”; removal before that wastes the time, effort and money spent on training.','Stability of job creates team spirit and a sense of belongingness, increasing quality and quantity of work. (M1·S45)']},
 {t:'h', h:'11 · Scalar chain'},
 {t:'list', items:['“The chain of superiors ranging from the ultimate authority to the lowest.”','Every order, instruction, message, request and explanation has to pass through the scalar chain.','For convenience and urgency the path can be cut short: a <b>gang plank</b> is a temporary arrangement between two different points to facilitate quick and easy communication.','The gang plank shows that management principles are flexible, not rigid. (M1·S46)']},
 {t:'h', h:'12 · Subordination of individual interest to general interest'},
 {t:'list', items:['The organization is bigger than the individual; the interest of the undertaking should prevail in all circumstances.','As far as possible, reconcile individual and group interests (reconciliation = settlement, understanding, resolution or compromise); in conflict the individual must sacrifice.','Needs: honest and sincere employees, proper and regular supervision, and reconciling differences by mutual agreement. (M1·S47)']},
 {t:'h', h:'13 · Esprit de corps (team spirit)'},
 {t:'list', items:['Harmony in work groups and mutual understanding; it inspires workers to work harder. The slide adds that it “can be achieved through unity of command”.','Fayol cautioned against dividing employees into competing groups, as it damages morale in the long run.','To inculcate it: coordinate work at all levels; encourage informal relations among subordinates; create enthusiasm and keenness; reward efficient employees and give others a chance to improve; make subordinates conscious that their work matters to business and society.','He cautioned against excessive use of “Britain [<i>sic</i>] communication” with subordinates and preferred face-to-face communication. (M1·S48–49)']},
 {t:'h', h:'14 · Centralization and decentralization'},
 {t:'list', items:['<b>Centralization</b>: concentration of authority at the top level; top management retains most of the decision-making authority.','<b>Decentralization</b>: disposal of decision-making authority to all levels; sharing authority downwards.','Degree depends on the size of business, experience of superiors, dependability and ability of subordinates etc.','“Anything which increases the role of subordinate is decentralization & anything which decreases it is centralization.”','Absolute centralization or decentralization is not feasible; strike a balance. (M1·S50–51)']},
 {t:'p', h:`M1·S52 pictures this as a <b>top-to-bottom (centralized) approach</b> vs a <b>bottom-to-top (decentralized) approach</b> across four levels.`},
 {t:'three', items:['Unity of command = one boss (people); unity of direction = one plan (activities). Command is not possible without direction.','Scalar chain is the line from top to bottom; a gang plank is the permitted shortcut.','Every case answer = quoted line + principle name + one-line explanation in slide words.']},
 {t:'check', id:'c-m1t5-2', kind:'match', topic:'m1t5', q:'Match each case line to Fayol’s principle.', pairs:[['“Every tool and document had a designated place in the lab.”','Order'],['“Key strategic decisions stayed with top management; operational autonomy went to team leaders.”','Centralization & decentralization'],['“OYO offered long-term roles to core teams, reducing attrition.”','Stability of tenure'],['“The project’s success comes before personal ego.”','Subordination of individual interest to general interest'],['“Employees are encouraged to propose innovative solutions.”','Initiative']], why:'Order (material order, M1·S40); centralization & decentralization (M1·S50–51); stability of tenure (M1·S45); subordination (M1·S47); initiative (M1·S43).'},
 {t:'check', id:'c-m1t5-3', kind:'reveal', topic:'m1t5', q:'What is a gang plank, and what does it tell you about principles?', a:'A temporary arrangement between two different points to facilitate quick and easy communication, cutting short the scalar chain for convenience and urgency. It shows management principles are flexible, not rigid, and can be modified as situations require (M1·S46).'}
 ]},
/* ---------------- T6 ---------------- */
{id:'m1t6', title:'Mintzberg’s 10 managerial roles', slides:'M1·S53–68', density:'High',
 why:'A 3-mark “quote the lines, give main role and sub-role” case appears in every one of the 7 papers.',
 from:'Fayol gave principles for managing.',
 to:'Roles play out inside a wider environment. Next: the external environment and social responsibility.',
 blocks:[
 {t:'start', h:`Henry Mintzberg (McGill University) described ten roles — organized sets of behaviours identified with a position — grouped into three categories: <b>interpersonal</b> (3), <b>informational</b> (3) and <b>decisional</b> (4).`},
 {t:'cats', cats:[
  {h:'A. Interpersonal roles',cls:'c1',items:['1. Figurehead','2. Leader','3. Liaison']},
  {h:'B. Informational roles',cls:'c2',items:['4. Monitor','5. Disseminator','6. Spokesman']},
  {h:'C. Decisional roles',cls:'c3',items:['7. Entrepreneurial','8. Disturbance handler','9. Resource allocator','10. Negotiator']}], cap:'M1·S54'},
 {t:'p', h:`M1·S55 links the three groups by information: <b>interpersonal roles provide information</b>, <b>informational roles process information</b>, and <b>decisional roles use information</b>, with feedback running back through all three.`},
 {t:'mnemo', title:'3-3-4 with verbs', h:`<b>Interpersonal — Face, Lead, Link</b> (figurehead, leader, liaison).<br><b>Informational — Collect, Share inside, Speak outside</b> (monitor, disseminator, spokesman).<br><b>Decisional — Start change, Stop fires, Split resources, Strike deals</b> (entrepreneurial, disturbance handler, resource allocator, negotiator).`},
 {t:'h', h:'A · Interpersonal roles'},
 {t:'table', head:['Role','What the slide says','Slide examples'], rows:[
  ['1. Figurehead','By virtue of position as head of a unit, every manager performs some duties of a ceremonial nature. Often routine, little serious communication, no important decisions — but important to smooth functioning.','President greets touring dignitaries (ribbon-cutting ceremonies); foreman attends a lathe operator’s wedding; sales manager takes an important customer to lunch'],
  ['2. Leader','Responsible for the work of the people of the unit. Direct: hiring and training staff. Indirect: motivating and encouraging employees, reconciling their needs with organizational goals. Formal authority gives potential power; leadership decides how much is realised.','Hiring and training staff; motivating employees'],
  ['3. Liaison','Makes contacts outside the vertical chain of command, largely to find information; builds the manager’s own external information system — informal, private, verbal, but effective. Managers spend as much time with peers and outsiders as with subordinates, and little with superiors.','Networking with peers and people outside the unit']], cap:'M1·S56–59'},
 {t:'h', h:'B · Informational roles'},
 {t:'table', head:['Role','What the slide says'], rows:[
  ['4. Monitor','Continuously scans the environment for information, interrogates liaison contacts and subordinates, and receives unsolicited information — much of it verbal (gossip, hearsay, speculation). The manager has a natural advantage in collecting this “soft” information.'],
  ['5. Disseminator','Shares and distributes information: passes privileged information directly to subordinates who would otherwise have no access, and passes information between subordinates who lack easy contact.'],
  ['6. Spokesman','Sends information to people outside the unit, and informs and satisfies the influential people who control the unit: directors and shareholders (financial performance), consumer groups (social responsibility), government officials (abiding by the law).']], cap:'M1·S60–63'},
 {t:'h', h:'C · Decisional roles'},
 {t:'table', head:['Role','What the slide says'], rows:[
  ['7. Entrepreneurial','The manager as <b>voluntary initiator of change</b>: seeks to improve the unit and adapt it to changing conditions. Looks for new ideas (via the monitor role), initiates development projects and, like a juggler, keeps several in the air.'],
  ['8. Disturbance handler','The manager <b>involuntarily responding to pressures</b> beyond his control: a strike looms, a major customer goes bankrupt, a road accident delays raw materials. Disturbances arise both because poor managers ignore situations and because good managers cannot anticipate all consequences.'],
  ['9. Resource allocator','Decides who will receive what in the unit. The most important resource allocated is the manager’s own time. Also designs the unit’s structure and authorizes important decisions before they are implemented.'],
  ['10. Negotiator','Managers at all levels spend considerable time in negotiations; perhaps routine, but not to be shirked (avoided).']], cap:'M1·S64–68'},
 {t:'confuse', title:'three pairs students mix up', h:`<b>Entrepreneurial vs disturbance handler:</b> voluntary change you start vs involuntary pressure you must respond to (M1·S66).<br><b>Disseminator vs spokesman:</b> information passed <i>inside</i> to subordinates vs sent <i>outside</i> the unit (M1·S62–63).<br><b>Liaison vs spokesman:</b> building contacts to gather information vs communicating the organization’s message outward.`},
 {t:'remember', h:`Exam format for every line you quote: <b>“[quoted line]” → Main role: Decisional → Sub-role: Negotiator → because negotiations are duties of the manager’s job (M1·S68).</b>`},
 {t:'check', id:'c-m1t6-1', kind:'match', topic:'m1t6', q:'Match each action to its sub-role.', pairs:[['Inaugurates new offices and attends ceremonies','Figurehead'],['Relies on daily departmental briefings to stay informed','Monitor'],['Keeps employees informed of new initiatives','Disseminator'],['Presents to investors and media to defend a decision','Spokesman'],['Re-allocates budget from marketing to infrastructure','Resource allocator'],['Settles a heated dispute between two teams','Disturbance handler']], why:'M1·S57, 61, 62, 63, 67, 66.'},
 {t:'check', id:'c-m1t6-2', kind:'mcq', topic:'m1t6', q:'A CEO bargains hard with venture capital firms over valuation and equity stake. Main role and sub-role?', o:['Interpersonal – Liaison','Informational – Spokesman','Decisional – Negotiator','Decisional – Resource allocator'], a:2, why:'Bargaining is negotiation — a decisional role (M1·S68).'}
 ]},
/* ---------------- T7 ---------------- */
{id:'m1t7', title:'External environment and social responsibility (CSR)', slides:'M1·S69–76', density:'High',
 why:'CSR appears as a 2–3 mark question in 5 of 7 papers; external-environment factors appear in 4 MCQs.',
 from:'Managers’ roles reach outside the unit (liaison, spokesman).',
 to:'Responsibility needs a way to decide right from wrong. Next: ethics in managing.',
 blocks:[
 {t:'start', h:`An organization sits inside six external forces. Society expects it to act responsibly within them — that expectation is <b>social responsibility</b>, or CSR.`},
 {t:'h', h:'The external environment'},
 {t:'cats', cats:[{h:'Six factors around the organization',items:['Technological','Economic','Social','Ecological','Political and legal','Ethical']}], cap:'M1·S69 (diagram only)'},
 {t:'mnemo', title:'STEEEP', h:`<b>S</b>ocial · <b>T</b>echnological · <b>E</b>conomic · <b>E</b>cological · <b>E</b>thical · <b>P</b>olitical & legal — three Es in the middle.`},
 {t:'gap', h:`M1·S69 names the six factors in a picture but does not explain any of them. Classify a case line by the plain meaning of the factor’s name, and link it to the systems approach: the organization is an open system, “responsive to environmental effects” and “vulnerable to the changes in the environment” (M1·S29).`},
 {t:'confuse', title:'internal vs external', h:`A change inside the firm (for example redesigning internal team collaboration tools) is <b>internal</b>, not an external-environment factor. The organization’s boundary decides which parts are internal and which are external (M1·S29).`},
 {t:'h', h:'Social responsibility of managers'},
 {t:'p', h:`Society expects organizations and managers to be responsible and ethical, yet financial scandals, scams with the quality of materials and simple negligence show they don’t always act so. <span class="chip ref">M1·S70</span>`},
 {t:'table', head:['Classical (purely economic) view','Socioeconomic position'], rows:[['Management’s only social responsibility is to <b>maximize profits</b>','Management’s responsibility goes beyond making profits to include <b>protecting and improving society’s welfare</b>']], cap:'M1·S71'},
 {t:'quote', h:`Social responsibility (CSR) is a business firm’s intention, beyond its legal and economic obligations, to do the right things and act in ways that are good for society. The definition assumes a business obeys the law and pursues economic interests, and views a business as a moral agent that must differentiate between right and wrong.`, ref:'M1·S72'},
 {t:'p', h:`<b>Corporate</b>: organized business · <b>Social</b>: everything dealing with the people · <b>Responsibility</b>: accountability between the two. <span class="chip ref">M1·S73</span>`},
 {t:'quote', h:`CSR is the corporate initiative to assess and take responsibility for the company's effects on the environment and impact on social welfare. It generally applies to efforts that go beyond what may be required by regulators or environmental protection groups. It may also be called “corporate citizenship” and can involve incurring short-term costs that do not provide an immediate financial benefit, but instead promote positive social and environmental change.`, ref:'M1·S74'},
 {t:'h', h:'Six drivers of CSR'},
 {t:'steps', items:[['Employees and shareholders',''],['Brand equity','The value of a brand, determined by the consumer’s perception of its quality and desirability'],['Ethical marketing practices and social awareness',''],['The environment consciousness',''],['Energy conservation and global warming',''],['Responsibility towards the government','']], cap:'M1·S75'},
 {t:'list', title:'Why it pays (M1·S76)', items:['Increased employee satisfaction leads to employee competence, which results in superior service delivery and customer satisfaction.','It takes decades to build goodwill and trust in the minds of customers and shareholders.','An ethically responsible culture reduces the chance of employees indulging in unfair practices, by emphasizing professionalism and transparency.','Socially responsible investments, effective communication, employee participation, fairness and promotions, adequate compensation and personal development.']},
 {t:'gap', h:`The slides give no ready-made list of arguments “for” and “against” CSR and no company example per driver. For such questions, build “for” from M1·S70, S71 (socioeconomic), S75–76, and “against” from the classical view (S71) and the short-term costs without immediate financial benefit (S74). Company examples must come from the case or from examples elsewhere in the slides.`},
 {t:'check', id:'c-m1t7-1', kind:'mcq', topic:'m1t7', q:'Which is NOT one of the six external-environment factors on M1·S69?', o:['Ecological','Ethical','Organizational culture','Political and legal'], a:2, why:'The six are technological, economic, social, ecological, political and legal, and ethical.'},
 {t:'check', id:'c-m1t7-2', kind:'fill', topic:'m1t7', q:'The classical view says management’s only social responsibility is to ___; the socioeconomic view adds protecting and improving society’s ___.', a:[['maximize profits','maximise profits','maximize profit','profits'],['welfare']], why:'M1·S71.'},
 {t:'check', id:'c-m1t7-3', kind:'reveal', topic:'m1t7', q:'List the six drivers of CSR.', a:'Employees and shareholders; brand equity; ethical marketing practices and social awareness; the environment consciousness; energy conservation and global warming; responsibility towards the government (M1·S75).'}
 ]},
/* ---------------- T8 ---------------- */
{id:'m1t8', title:'Ethics in managing: an integrated approach', slides:'M1·S77–87', density:'Medium',
 why:'Moral-theory MCQs appear in 4 papers; “two ways managers foster ethical decisions” and “two moral theories with examples” were 2-mark questions (2024).',
 from:'CSR treats the business as a moral agent that must tell right from wrong.',
 to:'Ethical, trusted organizations change more easily. Next: trust as the basis for change management.',
 blocks:[
 {t:'start', h:`Ethics is about good and bad, and moral duty. Managers test a decision three ways — by its <b>results</b> (utilitarian), by people’s <b>rights</b>, and by <b>justice</b> — and top managers make ethics part of daily work.`},
 {t:'quote', h:`Ethics is defined as “the discipline dealing with what is good and bad and with moral duty and obligation.” Business ethics is concerned with a systematic study of morals; it strives to provide methods to distinguish between actions and attitudes that are detrimental for business and those that are ethically sound and inspire businesses.`, ref:'M1·S78'},
 {t:'p', h:`Ethical concepts have often been dismissed in management theory as “soft” factors and useless chatter, because ethics has not consistently been related to disciplines such as economics and finance, and has been rejected as related to values and religion. <span class="chip ref">M1·S79</span>`},
 {t:'h', h:'Three moral theories (normative ethics)'},
 {t:'table', head:['Theory','Test the slide gives','Slide examples'], rows:[
  ['Utilitarian','Plans and actions evaluated by their consequences: produce the greatest good for the greatest number of people','Recycling programme that benefits the environment and reduces waste for the entire community; pharma firm prices a life-saving drug affordably to maximize accessibility; manufacturer shuts a high-polluting unit for long-term community health'],
  ['Rights','All people have basic rights — e.g. freedom of conscience, free speech, due process','Tech company refuses to sell personal data (privacy); media company protects journalists’ right to publish unbiased reports without censorship; firm gives paid leave for voting (civic rights)'],
  ['Justice','Decision makers guided by fairness and equity as well as impartiality','Equal pay for the same work regardless of gender or background; fair pricing so small vendors are treated equitably; scholarships for economically disadvantaged students']], cap:'M1·S81–86'},
 {t:'mnemo', title:'U-R-J = Outcome, Entitlement, Fairness', h:`<b>U</b>tilitarian asks “what outcome helps the most people?” · <b>R</b>ights asks “whose basic right is protected?” · <b>J</b>ustice asks “is everyone treated fairly and impartially?”`},
 {t:'confuse', title:'rights vs justice', h:`“Due process / right to appeal / free speech / privacy” → <b>rights</b>. “Equal pay / fair access / unbiased evaluation / concessional loans to the marginalized for fairness” → <b>justice</b>.`},
 {t:'h', h:'Institutionalizing ethics'},
 {t:'p', h:`Managers, especially top managers, have a responsibility to create an organizational environment that fosters ethical decision-making by <b>institutionalizing ethics</b> — applying and integrating ethical concepts with daily actions — in three ways: <span class="chip ref">M1·S87</span>`},
 {t:'steps', items:[['Code of ethics','Establishing an appropriate company policy or a code of ethics'],['Ethics committee','Using a formally appointed ethics committee'],['Teaching ethics','Teaching ethics in management development programs']]},
 {t:'check', id:'c-m1t8-1', kind:'classify', topic:'m1t8', q:'Classify each example by moral theory.', cats:['Utilitarian','Rights','Justice'], items:[['A bank waives EMIs for farmers during floods, helping the most people',0],['A newspaper defends freedom of expression',1],['Promotions decided by unbiased performance evaluation',2],['A bank gives rejected applicants a right to appeal (due process)',1],['A logistics firm switches to electric trucks to improve community air quality',0]], why:'Greatest good for the greatest number = utilitarian; basic rights incl. due process and free speech = rights; fairness, equity, impartiality = justice (M1·S81–86).'},
 {t:'check', id:'c-m1t8-2', kind:'reveal', topic:'m1t8', q:'Name the three ways managers institutionalize ethics.', a:'(1) An appropriate company policy or code of ethics; (2) a formally appointed ethics committee; (3) teaching ethics in management development programs (M1·S87).'}
 ]},
/* ---------------- T9 ---------------- */
{id:'m1t9', title:'Trust as the basis for change management', slides:'M1·S88–91', density:'Low',
 why:'Not yet tested in the supplied papers, but short enough to learn in five minutes; it also supports “relevance today” arguments (e.g. Theory Z, Mar 2026).',
 from:'Ethical organizations make decisions people can rely on.',
 to:'Change is sharpest when a firm works across countries. Next: international business and culture.',
 blocks:[
 {t:'start', h:`Change management helps people adapt to change. Among all the approaches, the one most often overlooked is <b>trust</b> — and it should belong to the organization’s culture, not just to one leader.`},
 {t:'quote', h:`Change management is a systematic approach to dealing with the transition or transformation of an organization's goals, processes and technologies. The purpose of change management is to implement strategies for effecting and controlling change and helping people to adapt to change.`, ref:'M1·S89'},
 {t:'list', items:[
  'Managers are bombarded with new managerial concepts (and old ones disguised by new terminology), all designed for coping with change demanded by <b>global competition, customer expectations, and the need to respond quickly to environmental changes</b>.',
  'Of the approaches available, the one often overlooked is <b>trust</b>. Trust is at the centre of <b>communication, collaboration, and the willingness to change</b>. (M1·S90)',
  'Traditionally trust is equated with <b>integrity, loyalty, caring, and keeping promises</b> in relationships between individuals.',
  'Trust should extend to the organization through a <b>culture of trust that transcends individual leadership</b>: “Leaders come and go; the organization continues.” (M1·S91)']},
 {t:'trigger', h:'Trust → communication + collaboration + willingness to change; build it into culture because leaders come and go.'},
 {t:'check', id:'c-m1t9-1', kind:'fill', topic:'m1t9', q:'Trust is at the centre of communication, ___, and the willingness to ___.', a:[['collaboration'],['change']], why:'M1·S90.'}
 ]},
/* ---------------- T10 ---------------- */
{id:'m1t10', title:'International business: culture and management styles', slides:'M1·S92–103', density:'High',
 why:'Culture-dimension MCQs (2024) and 3-mark comparisons of Korean/Japanese/American styles (Apr 2025, Oct 2025) or dimensions (Sep 2025).',
 from:'Change and trust matter more when people from different cultures work together.',
 to:'Theory Z blends two of these styles. Next: Theory Z.',
 blocks:[
 {t:'start', h:`A country’s culture shapes how employees behave, and so shapes management practice. The slides give five dimensions of that behaviour, notes on five countries, and a detailed Korean–Japanese–American comparison.`},
 {t:'h', h:'Five dimensions of culture'},
 {t:'steps', items:[['Individualism vs collectivism',''],['Large power distance vs small power distance',''],['Uncertainty tolerance vs avoidance',''],['Masculinity vs femininity','(aggressive vs passive goal behaviour)'],['Short-term vs long-term orientation','']], cap:'M1·S93–97'},
 {t:'mnemo', title:'Me · Boss · Risk · Drive · Time', h:`<b>Me</b> or we (individualism vs collectivism) · <b>Boss</b> (power distance) · <b>Risk</b> (uncertainty tolerance vs avoidance) · <b>Drive</b> (masculinity = aggressive vs femininity = passive goal behaviour) · <b>Time</b> (short- vs long-term orientation).`},
 {t:'gap', h:`M1·S93–97 only name the dimensions (plus the gloss “aggressive vs passive goal behaviour” for masculinity vs femininity). No slide explains them or gives an Indian perspective. The PYQ MCQs use these descriptions, which are not in the slides: “in collectivism, relationships are more important than task orientation”; “in large power distance, high respect for authority with emphasis on titles”; “in small power distance, less emphasis on authority, titles and ranks”; “in avoidance, people are afraid of ambiguity and uncertainty”; “in individualism, people focus on their own interests and the people close to them”; “in femininity, quality of life is favoured with a concern for the welfare of others” (Sep 2024 Q4, Nov 2024 Q4).`},
 {t:'p', h:`This suggests that managers need to understand cultural environments and their implications to be successful in the country in which they do business. <span class="chip ref">M1·S98</span>`},
 {t:'h', h:'Country notes'},
 {t:'table', head:['Country','What the slides say'], rows:[
  ['Germany','In the past, and less today, favoured reliance on authority in directing the workforce, often benevolent authoritarianism; managers may show concern for subordinates but also expect obedience. (S99)'],
  ['Austria (and Germany)','Characterized by self-realization and leadership; independence and competitiveness valued; tolerance for risk taking rather low. (S100)'],
  ['Australia','Influenced by a moralistic stance and emphasis on political and social values, achievement, and risk taking. (S100)'],
  ['Italy','Low tolerance for risks; very competitive, but like group decision-making. (S101)'],
  ['England (Britain)','Job security important, as are resourcefulness, adaptability and logic; individualism highly valued. (S101)']]},
 {t:'h', h:'Korean vs Japanese vs American management'},
 {t:'table', head:['Aspect','Korean','Japanese','American'], rows:[
  ['Decision-making','Top-down, hierarchical','Consensus-driven, participative','Top-down, fast, individual'],
  ['Employment practices','Loyalty and seniority','Lifetime employment, loyalty','Performance-based, high mobility'],
  ['Communication','Indirect, high-context','Indirect, high-context','Direct, low-context'],
  ['Workplace relationships','Hierarchy and respect for elders','Group harmony and team cohesion','Individualism and personal achievement'],
  ['Leadership style','Authoritative, paternalistic','Facilitative, consensus-oriented','Authoritative, results-oriented'],
  ['Motivation','Loyalty to company, respect for authority','Group harmony, job security','Individual achievement, rewards'],
  ['Conflict resolution','Avoidance, maintaining face','Avoidance, maintaining harmony','Confrontational, quick resolution'],
  ['Training & development','In-house, seniority-based','Extensive in-house, long-term','Formal education, continuous professional development'],
  ['Innovation & change','Slow to adopt, cautious','Incremental improvements, cautious','Rapid adoption, proactive'],
  ['Work-life balance','Long hours, high dedication','Long hours, strong commitment','Emphasis on balance, flexible hours'],
  ['Performance evaluation','Seniority and loyalty','Group performance and seniority','Individual performance, results'],
  ['CSR','Emerging importance','High importance, integrated into practice','High importance, driven by stakeholders and regulations']], cap:'M1·S102–103'},
 {t:'remember', h:`Korean and Japanese share <b>indirect, high-context communication</b>, <b>conflict avoidance</b> and <b>long hours</b>. They differ on <b>decisions</b> (Korean top-down vs Japanese consensus), <b>relationships</b> (hierarchy/elders vs group harmony), <b>leadership</b> (paternalistic vs facilitative), <b>evaluation</b> (seniority & loyalty vs group performance & seniority) and <b>CSR</b> (emerging vs high).`},
 {t:'check', id:'c-m1t10-1', kind:'mcq', topic:'m1t10', q:'Which pairing is correct according to M1·S102?', o:['Japanese – top-down, hierarchical decisions','Korean – consensus-driven decisions','American – direct, low-context communication','Japanese – confrontational conflict resolution'], a:2, why:'Korean is top-down; Japanese is consensus-driven and avoids conflict; American communication is direct, low-context.'},
 {t:'check', id:'c-m1t10-2', kind:'mcq', topic:'m1t10', q:'Using only the slide’s label “masculinity vs femininity (aggressive vs passive goal behaviour)”, which statement is odd?', o:['Masculinity reflects aggressive goal behaviour','Femininity reflects passive goal behaviour','Masculinity means being very much relationship-oriented','The dimension compares two goal behaviours'], a:2, why:'M1·S96 glosses masculinity as aggressive goal behaviour, which does not fit “very much relationship-oriented”.'}
 ]},
/* ---------------- T11 ---------------- */
{id:'m1t11', title:'Theory Z (William Ouchi)', slides:'M1·S104–108', density:'Medium',
 why:'Asked as a 2–3 mark “explain Theory Z” question in 3 of 7 papers.',
 from:'Japanese and American styles differ on employment, decisions and evaluation.',
 to:'That completes Chapter 1. Next: the module recap, then PYQ practice.',
 blocks:[
 {t:'start', h:`Theory Z (William Ouchi, 1980s) takes the Japanese and American organization types and blends them: long-term employment and holistic care from Japan, individual responsibility from America, and a mix of both on decisions, control and careers.`},
 {t:'quote', h:`Theory Z is a business management theory that integrates Japanese and American business practices. The Japanese business emphasis is on collective decision making, whereas the American emphasis is on individual responsibility. Theory Z focuses on increasing employee loyalty to the company by providing a job for life with a strong focus on the well-being of the employee, both on and off the job. According to Ouchi, Theory Z management tends to promote stable employment, high productivity, and high employee morale and satisfaction.`, ref:'M1·S107'},
 {t:'table', head:['Feature','Japanese type (J)','American type (A)','Theory Z'], rows:[
  ['Employment','Lifetime employment','Short-term employment','Long-term employment'],
  ['Decision-making','Collective','Individual','Consensual, participative'],
  ['Responsibility','Collective','Individual','Individual'],
  ['Evaluation & promotion','Slow','Rapid','Slow'],
  ['Control','Implicit (understood, implied)','Explicit (clear, precise, unambiguous)','Implicit, informal control with explicit, formalized measures'],
  ['Career path','Non-specialized','Specialized','Moderately specialized'],
  ['Concern for employee','Holistic, as a person','Segmented, as an employee','Holistic, including family']], cap:'M1·S105–108'},
 {t:'mnemo', title:'which side each Z feature comes from', h:`<b>Japan gives Z:</b> long-term employment, slow evaluation, holistic concern (+ family).<br><b>America gives Z:</b> individual responsibility.<br><b>Blended in Z:</b> consensual-participative decisions, implicit control with explicit measures, moderately specialized careers.`},
 {t:'check', id:'c-m1t11-1', kind:'match', topic:'m1t11', q:'Match each Theory Z feature to its slide wording.', pairs:[['Employment','Long-term employment'],['Decision-making','Consensual, participative'],['Responsibility','Individual responsibility'],['Evaluation and promotion','Slow evaluation and promotion'],['Career path','Moderately specialized'],['Concern','Holistic concern, including family']], why:'M1·S108.'},
 {t:'check', id:'c-m1t11-2', kind:'mcq', topic:'m1t11', q:'According to Ouchi (M1·S107), Theory Z tends to promote…', o:['Rapid promotion and specialized careers','Stable employment, high productivity, and high employee morale and satisfaction','Collective responsibility and short-term employment','Explicit control only'], a:1, why:'Direct from M1·S107.'}
 ]}
],

pyqGroups:{
