cards:[
 {id:'f1-1',k:'term',t:'m1t1',f:'Business',b:'An organization that strives for a profit by providing goods and services desired by its customers.',r:'M1·S9'},
 {id:'f1-2',k:'compare',t:'m1t1',f:'Industry vs business',b:'<b>Industry</b>: a group of companies producing similar goods or services; a specific sector (automotive, technology).<br><b>Business</b>: an individual company operating within an industry to generate profits (Tesla, Apple).',r:'M1·S11'},
 {id:'f1-3',k:'process',t:'m1t1',f:'The four sectors of industry, in order',b:'Primary (extract raw materials from earth or sea) → Secondary (process and manufacture) → Tertiary (provide a service) → Quaternary (high research and technology, highly qualified people; e.g. biotechnology, computer programming).',r:'M1·S12–13'},
 {id:'f1-4',k:'qa',t:'m1t2',f:'Which skill dominates at the top, and which at the bottom?',b:'Top: conceptual (largest), technical smallest. Bottom: technical largest, conceptual smallest. Human skill is substantial at all levels.',r:'M1·S20'},
 {id:'f1-5',k:'term',t:'m1t2',f:'Three levels of management and their focus',b:'Top — executive coaching, change management, leadership, delegation & empowerment.<br>Middle — problem solving, team building, talent development, performance management.<br>Low level — emotional intelligence and coaching for performance.',r:'M1·S18'},
 {id:'f1-6',k:'process',t:'m1t3',f:'Five functions of managers',b:'Planning → Organizing → Staffing → Leading → Controlling.',r:'M1·S21–26'},
 {id:'f1-7',k:'term',t:'m1t3',f:'Staffing',b:'Filling and keeping filled the positions in the organization structure: identifying workforce requirements, inventorying people available, and recruiting, selecting, placing, promoting, appraising, compensating and training.',r:'M1·S24'},
 {id:'f1-8',k:'term',t:'m1t3',f:'Leading',b:'Influencing people so that they will contribute to organizational and group goals; the interpersonal aspect of managing — involves motivation, leadership styles and approaches, and communication.',r:'M1·S25'},
 {id:'f1-9',k:'confusion',t:'m1t4',f:'Is “goal integration” an input or an output in the systems approach?',b:'An <b>output</b> (with products, services, profits, satisfaction, others). Inputs are human, capital, managerial, technological and others, plus goal inputs of claimants.',r:'M1·S28'},
 {id:'f1-10',k:'qa',t:'m1t4',f:'Five bullet points of the systems approach',b:'Open system; dependent on external environment for inputs; inputs transformed through managerial functions; communication essential to all phases; some outputs become inputs again.',r:'M1·S28'},
 {id:'f1-11',k:'compare',t:'m1t5',f:'Unity of command vs unity of direction',b:'Command: one boss; personnel; fixes responsibility; avoids conflict and confusion; better superior–subordinate relationship.<br>Direction: one head one plan; departments/organization; sound organization; avoids duplication and wastage; smooth running.',r:'M1·S38'},
 {id:'f1-12',k:'term',t:'m1t5',f:'Equity (Fayol)',b:'A combination of fairness, kindness and justice; managers fair and impartial with subordinates — though at times force and harshness may be needed for the sake of equity.',r:'M1·S39'},
 {id:'f1-13',k:'compare',t:'m1t5',f:'Material order vs social order',b:'Material: a safe, specific place for every article and every place used for a specific activity. Social: the most suitable person on the suitable job; a place for everyone and everyone in their place.',r:'M1·S40'},
 {id:'f1-14',k:'qa',t:'m1t5',f:'Three conditions under which discipline can be enforced',b:'Good superiors at all levels; clear and fair agreements with workers; sanctions judiciously applied.',r:'M1·S42'},
 {id:'f1-15',k:'term',t:'m1t5',f:'Scalar chain and gang plank',b:'Scalar chain: the chain of superiors from ultimate authority to the lowest. Gang plank: a temporary shortcut between two points for quick communication, showing principles are flexible.',r:'M1·S46'},
 {id:'f1-16',k:'qa',t:'m1t5',f:'Why should dual subordination be avoided? (8 effects)',b:'It undermines authority, weakens discipline, divides loyalty, creates confusion, causes delays and chaos, lets people escape responsibilities, duplicates work and overlaps efforts.',r:'M1·S36'},
 {id:'f1-17',k:'term',t:'m1t5',f:'Centralization vs decentralization',b:'Centralization: authority concentrated at the top. Decentralization: decision-making authority shared down to all levels. Anything that increases the subordinate’s role is decentralization; a balance is needed.',r:'M1·S50–51'},
 {id:'f1-18',k:'confusion',t:'m1t5',f:'“Every engineer reported to only one senior lead.” Scalar chain or unity of command?',b:'<b>Unity of command</b> — one boss for each subordinate. Scalar chain is the full line of authority from top to bottom.',r:'M1·S36, S46'},
 {id:'f1-19',k:'process',t:'m1t6',f:'Mintzberg’s 10 roles by category',b:'Interpersonal: figurehead, leader, liaison.<br>Informational: monitor, disseminator, spokesman.<br>Decisional: entrepreneurial, disturbance handler, resource allocator, negotiator.',r:'M1·S54'},
 {id:'f1-20',k:'confusion',t:'m1t6',f:'Entrepreneurial vs disturbance handler',b:'Entrepreneurial = the manager as voluntary initiator of change. Disturbance handler = involuntarily responding to pressures beyond his control (strike, bankrupt customer, delayed materials).',r:'M1·S65–66'},
 {id:'f1-21',k:'confusion',t:'m1t6',f:'Disseminator vs spokesman',b:'Disseminator passes information inside, to subordinates. Spokesman sends information outside the unit and satisfies influential people (directors, shareholders, consumer groups, government).',r:'M1·S62–63'},
 {id:'f1-22',k:'qa',t:'m1t6',f:'What is the most important resource a manager allocates?',b:'His own time. The resource allocator also designs the unit’s structure and authorizes important decisions before implementation.',r:'M1·S67'},
 {id:'f1-23',k:'term',t:'m1t6',f:'Liaison role',b:'Making contacts outside the vertical chain of command, largely to find information — building an informal, private, verbal but effective external information system.',r:'M1·S59'},
 {id:'f1-24',k:'process',t:'m1t7',f:'Six external-environment factors',b:'Technological, economic, social, ecological, political and legal, ethical (STEEEP).',r:'M1·S69'},
 {id:'f1-25',k:'compare',t:'m1t7',f:'Classical vs socioeconomic view of social responsibility',b:'Classical: management’s only social responsibility is to maximize profits. Socioeconomic: responsibility goes beyond profits to protecting and improving society’s welfare.',r:'M1·S71'},
 {id:'f1-26',k:'process',t:'m1t7',f:'Six drivers of CSR',b:'Employees and shareholders; brand equity; ethical marketing practices and social awareness; environment consciousness; energy conservation and global warming; responsibility towards the government.',r:'M1·S75'},
 {id:'f1-27',k:'term',t:'m1t7',f:'CSR (definition)',b:'A firm’s intention, beyond legal and economic obligations, to do the right things and act in ways good for society; the corporate initiative to assess and take responsibility for effects on the environment and social welfare.',r:'M1·S72, S74'},
 {id:'f1-28',k:'compare',t:'m1t8',f:'Utilitarian vs rights vs justice',b:'Utilitarian: judge by consequences — greatest good for the greatest number. Rights: basic rights such as conscience, free speech, due process. Justice: fairness, equity and impartiality.',r:'M1·S81–83'},
 {id:'f1-29',k:'qa',t:'m1t8',f:'Three ways to institutionalize ethics',b:'Code of ethics / company policy; formally appointed ethics committee; teaching ethics in management development programs.',r:'M1·S87'},
 {id:'f1-30',k:'term',t:'m1t9',f:'Change management',b:'A systematic approach to dealing with the transition or transformation of an organization’s goals, processes and technologies; its purpose is to implement strategies for effecting and controlling change and helping people adapt.',r:'M1·S89'},
 {id:'f1-31',k:'qa',t:'m1t9',f:'Why does trust matter in change?',b:'Trust is at the centre of communication, collaboration and the willingness to change; it should be built into a culture of trust that transcends individual leadership, because leaders come and go.',r:'M1·S90–91'},
 {id:'f1-32',k:'process',t:'m1t10',f:'Five culture dimensions',b:'Individualism vs collectivism; large vs small power distance; uncertainty tolerance vs avoidance; masculinity vs femininity (aggressive vs passive goal behaviour); short-term vs long-term orientation.',r:'M1·S93–97'},
 {id:'f1-33',k:'compare',t:'m1t10',f:'Korean vs Japanese: decision-making, leadership, evaluation',b:'Korean: top-down hierarchical; authoritative, paternalistic; seniority and loyalty. Japanese: consensus-driven, participative; facilitative, consensus-oriented; group performance and seniority.',r:'M1·S102–103'},
 {id:'f1-34',k:'compare',t:'m1t10',f:'American style: communication, motivation, conflict',b:'Direct, low-context communication; individual achievement and rewards; confrontational, quick conflict resolution.',r:'M1·S102'},
 {id:'f1-35',k:'qa',t:'m1t10',f:'German vs Italian management (slides)',b:'German: reliance on authority, often benevolent authoritarianism; managers expect obedience. Italian: low tolerance for risk, very competitive, like group decision-making.',r:'M1·S99, S101'},
 {id:'f1-36',k:'term',t:'m1t11',f:'Theory Z',b:'Ouchi’s 1980s theory integrating Japanese (collective decisions) and American (individual responsibility) practice; aims at loyalty through a job for life and concern for well-being on and off the job; promotes stable employment, high productivity, high morale and satisfaction.',r:'M1·S107'},
 {id:'f1-37',k:'compare',t:'m1t11',f:'J vs A vs Z on employment, decisions, responsibility',b:'J: lifetime, collective, collective. A: short-term, individual, individual. Z: long-term, consensual-participative, individual.',r:'M1·S105–108'},
 {id:'f1-38',k:'pyq',t:'m1t5',f:'PYQ trigger: “Quote the lines… identify and explain three of Henri Fayol’s principles” (3 marks)',b:'<ol><li>For each of three lines: quote it in inverted commas.</li><li>Name the principle (number optional).</li><li>Explain in one sentence using slide wording.</li><li>Add the benefit the slide gives (e.g. unity of command avoids confusion).</li></ol>',r:'M1·S33–51'},
 {id:'f1-39',k:'pyq',t:'m1t6',f:'PYQ trigger: “Identify three Mintzberg roles… mention main and sub-role” (3 marks)',b:'<ol><li>Quote the line.</li><li>Main role (interpersonal / informational / decisional).</li><li>Sub-role (e.g. spokesman).</li><li>One-line reason from the slide definition.</li></ol>',r:'M1·S54–68'},
 {id:'f1-40',k:'pyq',t:'m1t11',f:'PYQ trigger: “Elaborate on William Ouchi’s theory” (2 marks)',b:'Definition (integrates Japanese + American), purpose (loyalty, job for life, well-being on and off the job), outcomes (stable employment, high productivity, high morale & satisfaction), then list the seven Z features.',r:'M1·S107–108'},
 {id:'f1-41',k:'pyq',t:'m1t7',f:'PYQ trigger: “Explain drivers of CSR with a corporate example each”',b:'Name the driver (M1·S75) → explain with S76 wording (employee satisfaction, goodwill and trust, ethical culture) → attach the company example from the case or from the slides → close with the CSR definition.',r:'M1·S72–76'}
]
});

topics:[
/* T1 */
{id:'m2t1', title:'What planning is and why it matters', slides:'M2·S4–7', density:'Low',
 why:'Rarely asked alone, but “significance of plans” is part of the plan-type case questions (Sep 2025, Oct 2025).',
 to:'Planning produces different kinds of plans. Next: the eight types of plans.',
 blocks:[
 {t:'start', h:`A plan is a <b>blueprint</b> for reaching a goal: what to do, with what resources, by when. Planning bridges the gap between where we are and where we want to be.`},
 {t:'quote', h:`A plan is a blueprint for goal achievement, a blueprint that specifies the necessary resource allocations, schedules, tasks, and other actions to achieve the purpose.`, ref:'M2·S4'},
 {t:'cats', cats:[{h:'Importance of planning (M2·S5)',items:['Bridges the gap between where we are & where we want to be','Reduces uncertainties','Provides direction','Resource allocation','Minimizes impulsive & arbitrary decisions']}]},
 {t:'h', h:'The questions planning answers'},
 {t:'list', ol:true, items:['What needs to be accomplished?','What are the alternative routes to it?','When is the deadline?','Where will this be done?','Who will be responsible for it?','How will it get done?','How much time, energy, and resources are required to accomplish this goal?']},
 {t:'discrep', h:`M2·S6 is titled “Planning answers <b>six</b> basic questions” but lists <b>seven</b>. If asked, write all seven; the “what” and “how” questions each appear twice in different forms.`},
 {t:'h', h:'Why planning is important (M2·S7)'},
 {t:'list', items:['It helps management clarify, focus, and research their business’s or project’s development and prospects.','It provides a considered and logical framework within which a business can develop and pursue business.','It offers a benchmark against which actual performance can be measured and reviewed.','It plays a vital role in helping to avoid mistakes or recognize hidden opportunities.','In business, it guides the development of products, management, finances, and most importantly markets and competition.','It helps in forecasting the future and makes the future visible to some extent.','It bridges between where we are and where we want to go.']},
 {t:'trigger', h:'Plan = blueprint (resources + schedules + tasks). Planning = direction, less uncertainty, a benchmark for control.'},
 {t:'check', id:'c-m2t1-1', kind:'reveal', topic:'m2t1', q:'Give four reasons planning is important.', a:'Any four of: bridges where we are and where we want to be; reduces uncertainties; provides direction; helps resource allocation; minimizes impulsive and arbitrary decisions; offers a benchmark for measuring performance; helps avoid mistakes or spot hidden opportunities; helps forecast the future (M2·S5, S7).'}
 ]},
/* T2 */
{id:'m2t2', title:'Types of plans', slides:'M2·S8–18', density:'High',
 why:'A case asking you to identify three or four plan types appears in 4 of 7 papers (Apr 2025, Sep 2025, Oct 2025, Mar 2026), plus “spot the odd plan” MCQs in 2024.',
 from:'Planning produces a blueprint.',
 to:'The same plan can be described in several ways at once. Next: perspectives of planning.',
 blocks:[
 {t:'start', h:`There are eight types of plans, from the broadest (the purpose or mission) to the most numerical (the budget). All managers plan, but top-level plans differ from lower-level plans.`},
 {t:'steps', items:[['Purpose / Mission / Vision',''],['Goal / Objective',''],['Strategy',''],['Policy',''],['Procedure',''],['Rules',''],['Programs',''],['Budgets','']], cap:'Types of plans · M2·S8'},
 {t:'p', h:`All managers across all levels participate in planning. However, the plans made by the top-level manager will differ from those lower managers make; plans also differ in what they seek to achieve and in the methods used. <span class="chip ref">M2·S8</span>`},
 {t:'table', head:['Type','Slide definition','Slide examples'], rows:[
  ['1. Purpose / mission / vision','Identifies the basic function or task of an enterprise or agency or any part of it (M2·S9). Mission statement = what the company represents & values; vision statement = what the company wishes to become; strategy & goals = how it strives to achieve its vision & measures success (M2·S10).','Oil company: “To search for oil and to produce, refine, market petroleum products.” DuPont: “Better things through chemistry.”'],
  ['2. Goal / objective','The important ends towards which organizational and individual activities are directed. Verifiable objectives facilitate measurement of the surplus and of the effectiveness and efficiency of managerial actions. (M2·S11)','See the Objectives lesson'],
  ['3. Strategy','A complete and all-inclusive plan for achieving objectives, with three dimensions: establishing long-term objectives; selecting a specific course of action; allocating the necessary resources. Generally reserved for the top level. (M2·S12)',''],
  ['4. Policy','General statements or understandings which guide or channel thinking in decision making. Not all are written; often implied from managers’ actions. They define an area within which a decision is made, keep decisions consistent with objectives, and help decide issues before they become problems. (M2·S13)','Hiring university-trained engineers; encouraging employee suggestions; promoting from within; setting competitive prices; buying from the lowest of three qualified bidders (M2·S14)'],
  ['5. Procedure','A stepwise guide for the routine to carry out activities, followed by all employees; described in chronological order. (M2·S15)','College admission: application form → collect documents → sort applications. Scheduling vacations to avoid disruption, implementing a vacation policy.'],
  ['6. Rule','Very specific statements that define an action or non-action; no flexibility; compulsory; not following can have severe consequences. The simplest type of plan; guides action without specifying time sequence; may or may not be part of a procedure. (M2·S16)','No smoking zone; no phone zone'],
  ['7. Program','A complex of goals, policies, procedures, rules, task assignments, steps to be taken, resources to be employed and other elements necessary to carry out a course of action; ordinarily supported by budgets. (M2·S17)',''],
  ['8. Budget','A statement of expected results in numerical terms — “numberized programs” (labour hours, units of production, financial terms, machine-hours). Usually implements a program; may itself be a program. (M2·S18)','Variable/flexible budgets (depend on output level); program budgets (agencies and each department identify goals); zero-based budgets (a combination of variable and program budgets)']]},
 {t:'confuse', title:'policy vs procedure vs rule', h:`<b>Policy</b> guides <i>thinking</i> and leaves room for decision (“always prefer locally sourced ingredients”). <b>Procedure</b> gives <i>steps in chronological order</i> (“a 5-step sequence for quality checks”). <b>Rule</b> allows <i>no flexibility and no time sequence</i> (“no smoking in the warehouse”).`},
 {t:'remember', h:`A <b>practice</b> the company follows every year (e.g. recruiting 35–40% of staff from campus) is a <b>policy</b> — the slide says policies are often implied from managers’ actions, like “the practice of promoting from within”.`},
 {t:'mnemo', title:'from “why” to “how much”', h:`<b>Why</b> we exist (mission) → <b>What</b> we aim at (objective) → <b>Which way</b> overall (strategy) → <b>How to think</b> (policy) → <b>What steps</b> (procedure) → <b>Must / must not</b> (rule) → <b>Everything bundled</b> (program) → <b>In numbers</b> (budget).`},
 {t:'check', id:'c-m2t2-1', kind:'classify', topic:'m2t2', q:'Identify the type of plan in each line.', cats:['Objective','Strategy','Policy','Procedure','Rule','Program','Budget'], items:[['“To become market leader in organic snacks within 3 years.”',0],['“Always prioritize locally sourced ingredients over imported ones.”',2],['“A detailed 5-step sequence for quality checks on incoming produce.”',3],['“Strict prohibition of smoking in the warehouse.”',4],['“Loyalty and marketing programs to expand the customer base and enter new cities.”',5],['“Expected sales of 20,000 units and 5,000 labour hours next quarter.”',6]], why:'Objective = an important end; policy = a guide to thinking; procedure = chronological steps; rule = specific, no flexibility; program = a complex of goals, policies, procedures etc.; budget = expected results in numbers (M2·S11–18).'},
 {t:'check', id:'c-m2t2-2', kind:'mcq', topic:'m2t2', q:'Spot the item that is NOT one of the eight types of plans on M2·S8.', o:['Budget','Program','Project','Policy'], a:2, why:'The eight types are purpose/mission, objective, strategy, policy, procedure, rules, programs and budgets. “Project” is not on the list.'}
 ]},
/* T3 */
{id:'m2t3', title:'Perspectives of planning', slides:'M2·S19–25', density:'Medium',
 why:'“Odd one out” MCQs on planning perspectives appear in 5 papers; the strategic-vs-tactical comparison is a favourite.',
 from:'There are eight types of plans.',
 to:'Whatever its type, a plan is made through the same sequence. Next: the steps in planning.',
 blocks:[
 {t:'start', h:`Any plan can be described five ways at once: by <b>content</b>, <b>breadth</b>, <b>time frame</b>, <b>specificity</b> and <b>frequency of use</b>. These labels are not mutually exclusive — one plan can be strategic, long-term and directional together.`},
 {t:'p', h:`The most popular ways to describe plans are by <b>content</b> (strategic, tactical, operational), <b>breadth</b> (strategic vs tactical), <b>time frame</b> (long vs short term), <b>specificity</b> (directional vs specific) and <b>frequency of use</b> (single-use vs standing). These classifications are <b>not mutually exclusive</b>: two outcomes can occur simultaneously and one does not limit the other. <span class="chip ref">M2·S20</span>`},
 {t:'h', h:'Content'},
 {t:'p', h:`Upper-level managers develop <b>strategic plans</b> that apply to the entire organization, establish overall objectives, and position the organization within its environment. Lower-level managers focus on <b>tactical plans</b> that specify how the overall objectives will be achieved. <b>Operational plans</b> are limited in scope and measured daily, weekly or monthly; strategic plans are broader, less specific and encompass five or more years. <span class="chip ref">M2·S21</span>`},
 {t:'h', h:'Breadth: strategic vs tactical'},
 {t:'table', head:['Strategic plans','Tactical plans (operational plans)'], rows:[
  ['Apply broadly to the entire organization','Apply to specific parts of the organization'],
  ['Establish the organization’s overall objectives','Are derived from strategic objectives'],
  ['Seek to position the organization in terms of its environment','Specify the details of how the overall objectives are to be achieved'],
  ['Provide direction to drive efforts to achieve goals; serve as the basis for tactical plans','Must be updated continuously to meet current challenges'],
  ['Cover extended periods of time; less specific in details','Cover shorter periods of time']], cap:'M2·S22'},
 {t:'discrep', h:`M2·S20–21 treat strategic, tactical and <b>operational</b> as three content types, but the heading on M2·S22 reads “Tactical plans (operational plans)”, treating tactical and operational as the same. Write the three-way split for “content” and the two-way split for “breadth”.`},
 {t:'h', h:'Time frame'},
 {t:'table', head:['Long term','Short term'], rows:[
  ['Time frame beyond five years','Time frame up to one year'],
  ['Specifies what the organization wants to become in the long run','Provides the basis for day-to-day operations; meets a particular objective in the near future'],
  ['Involves a great deal of uncertainty','Answers: “Are we doing things right?”'],
  ['Higher management levels focus on longer horizons','Should fit well within and contribute to long-range plans'],
  ['May include a variety of types of training','Covers a limited area of training'],
  ['Examples: sales, brand awareness, public reputation, government plans','Examples: communication, ability to network, attention to detail, daily routines, plans for training staff']], cap:'M2·S23'},
 {t:'h', h:'Specificity and frequency of use'},
 {t:'table', head:['','First type','Second type'], rows:[
  ['Specificity','<b>Specific plans</b>: clearly defined objectives, no room for misinterpretation — “what, when, where, how much, and by whom” (process focus). Example: lesson plan','<b>Directional plans</b>: flexible plans that set out general guidelines — “go from here to there” (outcome focus)'],
  ['Frequency of use','<b>Single-use plan</b>: meets the needs of a particular or unique situation. Example: single-day sales advertisement','<b>Standing plan</b>: ongoing; guidance for repeatedly performed actions. Example: customer satisfaction policy']], cap:'M2·S24–25'},
 {t:'h', h:'The perspectives figure'},
 {t:'tree', root:{l:'Planning',c:[{l:'Level',cls:'l1',items:['Corporate','Business','Functional']},{l:'Importance',cls:'l1',items:['Strategic','Operational']},{l:'Formality',cls:'l1',items:['Formal','Informal']},{l:'Approach',cls:'l1',items:['Pro-active','Reactive']},{l:'Period',cls:'l1',items:['Short-term','Long-term']}]}, cap:'“Planning can be classified from different perspectives” · M2·S19'},
 {t:'discrep', h:`The figure on M2·S19 (level, importance, formality, approach, period) and the list on M2·S20 (content, breadth, time frame, specificity, frequency of use) are two different classifications on consecutive slides. The papers’ MCQs use the S20 list (single-use vs standing, alignment with long-term goals).`},
 {t:'confuse', title:'single-use vs standing', h:`“Weekly lab computer maintenance” repeats → <b>standing</b>. “A mentorship programme launching in six months” happens once → <b>single-use</b>. A daily task list that does <i>not</i> align with long-term goals breaks the short-term rule “should fit well within and contribute to long-range plans”.`},
 {t:'check', id:'c-m2t3-1', kind:'mcq', topic:'m2t3', q:'Which statement is a similarity between strategic and tactical plans?', o:['Both are short-term and day-to-day','Both are static and never updated','Both are made only by top management','Both aim at the organization’s overall objectives by guiding decisions'], a:3, why:'Strategic plans establish overall objectives; tactical plans specify how those overall objectives are achieved (M2·S21–22). Tactical plans must be updated continuously and are the focus of lower-level managers.'},
 {t:'check', id:'c-m2t3-2', kind:'classify', topic:'m2t3', q:'Single-use or standing?', cats:['Single-use','Standing'], items:[['A single-day sales advertisement',0],['A customer satisfaction policy',1],['Weekly maintenance of lab computers',1],['A one-time campaign for top regional schools by year-end',0]], why:'Single-use meets a particular or unique situation; standing guides repeatedly performed actions (M2·S25).'}
 ]},
/* T4 */
{id:'m2t4', title:'Steps in planning', slides:'M2·S26', density:'Low',
 why:'Not yet asked directly in the supplied papers, but it is the planning process itself and fits any “explain planning” answer.',
 from:'Plans can be classified many ways.',
 to:'Step 2 is “setting objectives”. Next: objectives in depth.',
 blocks:[
 {t:'start', h:`Planning moves from spotting opportunities to writing budgets: eight steps, each answering one question.`},
 {t:'steps', v:true, items:[
  ['Being aware of opportunities','In light of the market, competition, what customers need/want, our strengths, our weaknesses'],
  ['Setting objectives / goals','Where we want to be, what we want to accomplish, and when'],
  ['Considering planning premises','In what environment (internal or external) will the plans operate?'],
  ['Identifying alternatives','What are the most promising alternatives to accomplishing our objectives?'],
  ['Comparing the alternatives in the light of the goals sought','Which alternative gives the best chance of meeting our goals at the lowest cost and highest profit?'],
  ['Choosing an alternative','Selecting the course of action we will pursue'],
  ['Formulating the supporting plans','Such as plans to buy equipment, buy materials, hire and train workforce, develop a new product'],
  ['Numberizing the plans by making budgets','Volume and price of sales; operating expenses necessary for plans; expenditures for capital equipment']], cap:'M2·S26'},
 {t:'mnemo', title:'A-S-P-I-C-C-F-N', h:`<b>Aware → Set → Premises → Identify → Compare → Choose → Formulate → Numberize</b>. The middle four follow a decision: list options, compare them, pick one. The last two turn the choice into support plans and budgets.`},
 {t:'check', id:'c-m2t4-1', kind:'order', topic:'m2t4', q:'Put the steps in planning in order.', items:['Being aware of opportunities','Setting objectives/goals','Considering planning premises','Identifying alternatives','Comparing the alternatives','Choosing an alternative','Formulating the supporting plans','Numberizing the plans by making budgets'], why:'M2·S26.'}
 ]},
/* T5 */
{id:'m2t5', title:'Objectives: hierarchy, multiplicity and types', slides:'M2·S27–31, S40', density:'Medium',
 why:'“Odd objective” MCQs appear in 4 papers (spot the qualitative one), and quantitative objectives were a 2-mark question (Sep 2024).',
 from:'Setting objectives is step 2 of planning.',
 to:'MBO turns objectives into a whole management system. Next: Management by Objectives.',
 blocks:[
 {t:'start', h:`Objectives are the ends everything else aims at. They form a hierarchy from socio-economic purpose down to individual objectives, there are always several of them, and they are either quantitative (numbers) or qualitative (hard to measure).`},
 {t:'p', h:`<b>Objectives</b> are the important ends toward which organizational and individual activities are directed. <b>Verifiable objectives</b> facilitate measurement of the surplus as well as the effectiveness and efficiency of managerial actions. <span class="chip ref">M2·S11</span>`},
 {t:'h', h:'Hierarchy of objectives'},
 {t:'pyr', rows:['1. Socio-economic purpose','2. Mission','3. Overall objectives of the organization (long-range, strategic)','4. More specific overall objectives (e.g. in key result areas)','5. Division objectives','6. Department and unit objectives','7. Individual objectives — performance; personal development objectives'], cap:'Hierarchy of objectives beside the managerial hierarchy (board of directors, top-, middle-, lower-level managers) · M2·S10, S28'},
 {t:'p', h:`The diagram pairs the upper levels (purpose, mission, overall objectives) with the <b>board of directors and top-level managers</b>, the middle levels (more specific objectives, division and department objectives) with <b>middle-level managers</b>, and the lowest levels (department/unit and individual objectives) with <b>lower-level managers</b>. Arrows mark a <b>top-down approach</b> and a <b>bottom-up approach</b>.`},
 {t:'table', head:['Top-down approach','Bottom-up approach'], rows:[['Upper-level managers determine the objectives for subordinates (M2·S28)','Shown in the diagram, but the slide gives no written definition']]},
 {t:'gap', h:`Only the top-down approach is defined in words (M2·S28). Do not invent a definition for bottom-up; describe it from the diagram as objectives set in the reverse direction, from lower levels upward.`},
 {t:'h', h:'Strategy and policy (M2·S29)'},
 {t:'table', head:['Strategy','Policies'], rows:[['Determination of the mission or purpose and the basic long-term objectives of an enterprise, followed by the adoption of courses of action and allocation of resources necessary to achieve these aims','General statements or understandings that guide managers’ thinking in decision making']]},
 {t:'h', h:'Multiplicity of objectives'},
 {t:'p', h:`At every level in the hierarchy, goals are likely to be multiple: a business has several objectives because it must satisfy a variety of stakeholders — owners, employees, consumers, creditors, vendors, society — and must set separate objectives for each group. <span class="chip ref">M2·S30</span>`},
 {t:'h', h:'Quantitative vs qualitative objectives'},
 {t:'table', head:['Quantitative objectives','Qualitative objectives'], rows:[['Straightforward to measure; represented numerically; concrete, observable, quantifiable','Challenging to measure; not represented numerically'],['Increasing annual revenue by 10%; reducing production costs by 15%','Enhancing customer experience & satisfaction; improving brand reputation and recognition']], cap:'M2·S31'},
 {t:'h', h:'Verifiable vs non-verifiable'},
 {t:'table', head:['Non-verifiable','Verifiable version'], rows:[
  ['To make a reasonable profit','A return on investment of 12% at the end of the current fiscal year'],
  ['To improve communication','A two-page monthly newsletter from July 1, involving not more than 40 work hours of preparation (after the first issue)'],
  ['To improve productivity','Increase production output by 5% by December 31, without additional costs and at the current quality level'],
  ['To develop better managers','A 40-hour in-house “Fundamentals of Management” programme this year, using not more than 200 working hours of development staff, with 90% of managers passing'],
  ['To install a computer system','A computerized control system in production by December 31, needing not more than 500 hours of systems analysis and under 10% downtime in the first 3 months']], cap:'M2·S40'},
 {t:'remember', h:`A verifiable objective answers <b>how much, by when, at what cost/quality</b>. If you can’t check at the deadline whether it was met, it isn’t verifiable.`},
 {t:'check', id:'c-m2t5-1', kind:'classify', topic:'m2t5', q:'Quantitative or qualitative?', cats:['Quantitative','Qualitative'], items:[['Increase website traffic by 25% in six months',0],['Strengthen corporate culture to enhance engagement',1],['Achieve 95% on-time delivery',0],['Build a culture of continuous learning',1],['Improve brand reputation and recognition',1]], why:'Quantitative objectives are represented numerically; qualitative ones are not (M2·S31).'},
 {t:'check', id:'c-m2t5-2', kind:'reveal', topic:'m2t5', q:'Why does a business have multiple objectives?', a:'Because it must satisfy a variety of stakeholders — owners, employees, consumers, creditors, vendors, society — so it sets separate objectives for each group (M2·S30).'}
 ]},
/* T6 */
{id:'m2t6', title:'Management by Objectives (MBO)', slides:'M2·S32–45', density:'High',
 why:'MBO MCQs in 4 papers (benefit vs weakness vs problem); a 3-mark block diagram (Mar 2025) and a 2-mark case (Mar 2026).',
 from:'Objectives form a hierarchy and should be verifiable.',
 to:'MBO sets objectives; strategy decides how to reach them. Next: the strategic planning process.',
 blocks:[
 {t:'start', h:`In MBO, managers and employees <b>agree</b> objectives for every department, project and person, then use those objectives to monitor and appraise performance. It was popularized by Peter Drucker in 1954.`},
 {t:'quote', h:`Management by objectives is a comprehensive managerial system that integrates many key managerial activities in a systematic manner and is consciously directed toward the effective and efficient achievement of organizational and individual objectives.`, ref:'M2·S32'},
 {t:'p', h:`MBO — also known as <b>management by planning</b> — was first popularized by <b>Peter Drucker</b> in his <b>1954</b> book <i>The Practice of Management</i>. It is a strategic management model that aims to improve the performance of an organization by clearly defining objectives that are <b>agreed to by both management and employees</b>. <span class="chip ref">M2·S33</span>`},
 {t:'cats', cats:[{h:'Features of organizational objectives (M2·S34)',items:['Verifiable and quantified objectives','Hierarchy of objectives','Network of objectives','Multiplicity of objectives','Process of objective setting & organizational hierarchy']},{h:'MBO emphasizes (M2·S36)',items:['Performance appraisal','Short-term objectives and motivation','Long-term planning']}]},
 {t:'p', h:`MBO at a glance (M2·S35): a comprehensive managerial system that integrates many key activities · managerial activities arranged systematically · directed towards effective and efficient achievement of objectives · organizational and individual objectives addressed · managers and employees define objectives for every department, project and person, and use them to monitor subsequently · performance monitored and achieved.`},
 {t:'h', h:'Process of MBO'},
 {t:'steps', items:[['Setting preliminary objectives at the top',''],['Clarifying organizational roles',''],['Setting subordinates’ objectives',''],['Recycling of objectives','']], cap:'M2·S37'},
 {t:'h', h:'Key result areas (Peter Drucker)'},
 {t:'p', h:`A <b>key result area</b> is an area in which performance is essential for the success of the enterprise. <span class="chip ref">M2·S38</span>`},
 {t:'cats', cats:[{h:'Eight KRAs',items:['Market standing','Innovation','Productivity','Physical and financial resources','Profitability','Managerial performance and development','Worker performance and attitude','Public responsibility']},{h:'Additional areas',items:['Service','Quality']}]},
 {t:'h', h:'The MBO system diagram'},
 {t:'html', h:`<div class="diagram"><div style="min-width:620px;display:flex;flex-direction:column;gap:8px">
  <div class="row" style="gap:8px;flex-wrap:nowrap"><div class="cat" style="flex:1"><h4>Enterprise objectives ⇄ Planning premises</h4></div><div class="mono small">→</div><div class="cat" style="flex:1"><h4>Key result areas</h4></div><div class="mono small">→</div><div class="cat" style="flex:1"><h4>Appropriate organization</h4></div><div class="mono small">→</div><div class="cat c1" style="flex:1"><h4>SUPERIOR’s objectives</h4></div></div>
  <div class="row" style="gap:8px;flex-wrap:nowrap"><div class="cat" style="flex:1"><h4>Superior’s preliminary recommendation of objectives for subordinate</h4></div><div class="cat" style="flex:1"><h4>Subordinate’s preliminary statement of objectives</h4></div><div class="cat" style="flex:1"><h4>Available needed resources</h4></div></div>
  <div style="text-align:center" class="mono small">▼ AGREEMENT ▼</div>
  <div class="cat c2"><h4 style="text-align:center">SUBORDINATE’s objectives</h4></div>
  <div class="row" style="gap:8px;flex-wrap:nowrap"><div class="cat" style="flex:1"><h4>Subordinate’s ongoing performance</h4></div><div class="mono small">⇄</div><div class="cat" style="flex:1"><h4>Periodic review of process by superior</h4></div><div class="mono small">⇄</div><div class="cat" style="flex:1"><h4>Corrective measures and superior’s assistance <span class="muted">(← new inputs)</span></h4></div></div>
  <div class="row" style="gap:8px;flex-wrap:nowrap"><div class="cat" style="flex:1"><h4>Final performance by subordinate</h4></div><div class="mono small">→</div><div class="cat c3" style="flex:1"><h4>FINAL REVIEW & APPRAISAL OF PERFORMANCE</h4></div></div>
  <div class="small muted">Feedback: final appraisal loops back to superior’s objectives; a dashed “may effect” link runs back to appropriate organization.</div>
 </div><div class="dcap">Redrawn from M2·S39. The Mar 2025 paper calls this the “process of managing and appraising by objectives”.</div></div>`},
 {t:'h', h:'Setting employee objectives (M2·S41)'},
 {t:'list', ol:true, items:['Identify an employee’s key job tasks.','Establish specific and challenging goals for each key task.','Allow the employee to actively participate.','Prioritize goals.','Build in feedback mechanisms to assess goal progress.','Link rewards to goal attainment.']},
 {t:'h', h:'Objectives of MBO (M2·S42)'},
 {t:'list', items:['To identify problems and opportunities in business.','To convert identified opportunities into clear goals.','To set up a system to convert these goals into achievements.','To review the organization in the light of the objectives.','To establish the objectives of each job and unit.','To clarify the policies and systems to accomplish the objectives.','To set up a review system.']},
 {t:'h', h:'Benefits, weaknesses and problems'},
 {t:'table', head:['Benefits (M2·S43)','Weaknesses (M2·S44)','Problems (M2·S45)'], rows:[[
  '<ul><li>The need for planning will be recognized</li><li>Provides objectives and accountability for performance</li><li>Encourages participative management</li><li>Helps in job enrichment</li><li>Provides a good feedback system</li><li>Leader/subordinate efforts focused on activities that lead to goal attainment</li><li>Performance improved up and down the chain</li><li>Motivated people</li></ul>',
  '<ul><li>Failure to teach the philosophy of MBO</li><li>Failure to give guidelines to goal setters</li><li>Difficulty of setting goals</li><li>Emphasis on short-run goals</li><li>Danger of inflexibility</li><li>Desire to make goals verifiable: people may use quantitative goals where numbers are not applicable</li></ul>',
  '<ul><li>Change adversely affects planning</li><li>Low morale reduces effectiveness</li><li>Lower-level goals take precedence</li><li>Over-centralized authority limits participation</li><li>Paperwork</li></ul>']]},
 {t:'confuse', title:'benefit, weakness or problem?', h:`“Lower-level goals take precedence” is a <b>problem</b>, not a feature or benefit. “Emphasis on short-run goals” and “difficulty of setting goals” are <b>weaknesses</b>. “Good feedback system” is a <b>benefit</b>. MCQs ask you to spot the odd one across these lists.`},
 {t:'check', id:'c-m2t6-1', kind:'order', topic:'m2t6', q:'Arrange the process of MBO.', items:['Setting preliminary objectives at the top','Clarifying organizational roles','Setting subordinates’ objectives','Recycling of objectives'], why:'M2·S37.'},
 {t:'check', id:'c-m2t6-2', kind:'classify', topic:'m2t6', q:'Benefit, weakness or problem of MBO?', cats:['Benefit','Weakness','Problem'], items:[['Encourages participative management',0],['Danger of inflexibility',1],['Paperwork',2],['Helps in job enrichment',0],['Failure to teach the philosophy of MBO',1],['Low morale reduces effectiveness',2]], why:'M2·S43–45.'},
 {t:'check', id:'c-m2t6-3', kind:'scenario', topic:'m2t6', sc:'Every quarter, each engineer sits with their manager to mutually agree on specific project milestones and deadlines. Progress is then tracked against these jointly set goals.', q:'Which system is this?', o:['Centralized planning','Management by Objectives','Directional planning','Program budgeting'], a:1, why:'Objectives agreed by both management and employees and used to monitor performance = MBO (M2·S33, S35).'}
 ]},
/* T7 */
{id:'m2t7', title:'Strategic planning process and levels of strategy', slides:'M2·S46–48', density:'Medium',
 why:'Drawn as a 2-mark block diagram (Apr 2025); its steps are tested as an MCQ (Mar 2026).',
 from:'MBO sets objectives at every level.',
 to:'The process needs tools to analyse the situation. Next: the first of five tools, critical question analysis.',
 blocks:[
 {t:'start', h:`Strategic planning develops the strategy (direction) and the action plan to achieve the organization’s goals. It starts from inputs and claimants’ goals, analyses the enterprise and its environment, chooses a strategy and then implements and controls it.`},
 {t:'quote', h:`STRATEGIC PLANNING is the process of developing the strategy or direction and action plan to achieve the goals of an organization.`, ref:'M2·S46'},
 {t:'html', h:`<div class="diagram"><div style="min-width:640px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;align-items:start">
  <div class="cat c1"><h4>1 · Inputs</h4><ul><li>People</li><li>Capital</li><li>Managerial skills</li><li>Technology skills</li></ul><h4>Goals (claimants)</h4><ul><li>Employees, consumers, suppliers, stockholders, governments, community, others</li></ul></div>
  <div class="stack" style="gap:8px"><div class="cat"><h4>2 · Enterprise profile</h4></div><div class="cat"><h4>Top management orientation (values + vision)</h4></div><div class="cat"><h4>Purpose & major objectives of the organization</h4></div><div class="small muted">Industry analysis feeds in here</div></div>
  <div class="stack" style="gap:8px"><div class="cat"><h4>3 · Present & future external threats & opportunities</h4></div><div class="cat"><h4>Internal strengths & weaknesses</h4></div><div class="cat c2"><h4>4 · Development of alternate strategies</h4></div><div class="cat c2"><h4>5 · Evaluation & strategic choice</h4></div></div>
  <div class="stack" style="gap:8px"><div class="cat c3"><h4>6 · Medium & short-run planning</h4></div><div class="cat c3"><h4>Implementation</h4></div><div class="cat c3"><h4>Re-engineering organization structure (staffing)</h4></div><div class="cat"><h4>7 · Leadership · Control</h4></div></div>
 </div><div class="cat" style="min-width:640px;margin-top:8px"><h4 style="text-align:center">Consistency testing & contingency planning (feedback across the whole process)</h4></div>
 <div class="dcap">Redrawn from M2·S47 (source credited to Koontz, Weihrich & Cannice). Step numbers added for reading order.</div></div>`},
 {t:'h', h:'Three levels of strategy'},
 {t:'table', head:['Level','Question it answers'], rows:[['Corporate level strategy','What business are we in?'],['Business level (competitive) strategy','How do we compete?'],['Functional level strategy','How do we support the business-level strategy?']], cap:'M2·S48'},
 {t:'remember', h:`Strategic planning = <b>who wants what</b> (inputs, claimants’ goals) → <b>who we are</b> (profile, values, purpose) → <b>where we stand</b> (threats, opportunities, strengths, weaknesses) → <b>what we’ll do</b> (alternatives, choice) → <b>make it happen</b> (planning, implementation, structure, leadership, control), with consistency testing and contingency planning throughout.`},
 {t:'check', id:'c-m2t7-1', kind:'mcq', topic:'m2t7', q:'Which of these is NOT a box in the strategic planning process on M2·S47?', o:['Internal strengths & weaknesses','Present & future external threats & opportunities','Invest in learning and development of employees','Implementation'], a:2, why:'The other three are boxes on the slide; “invest in learning and development” is not.'},
 {t:'check', id:'c-m2t7-2', kind:'match', topic:'m2t7', q:'Match each level of strategy to its question.', pairs:[['Corporate level','What business are we in?'],['Business level','How do we compete?'],['Functional level','How do we support business-level strategy?']], why:'M2·S48.'}
 ]},
/* T8 */
{id:'m2t8', title:'Critical question analysis', slides:'M2·S49–52', density:'Low',
 why:'Not yet tested in the supplied papers, but it is the first of the five strategy tools the slides list.',
 from:'Strategic planning needs tools.',
 to:'The second tool looks for markets with no competition at all. Next: Blue Ocean strategy.',
 blocks:[
 {t:'start', h:`Five strategy tools are related but distinct; managers can use any one or a combination. The simplest is to ask a set of critical questions about the business.`},
 {t:'steps', items:[['Critical question analysis',''],['Blue Ocean strategy',''],['SWOT analysis & TOWS matrix',''],['Business portfolio analysis',''],['Porter’s generic model','']], cap:'Tools to develop strategy · M2·S50'},
 {t:'list', title:'Critical questions (M2·S51)', items:['What is our business?','Who are our customers?','What do our customers want?','How much will our customers buy and at what price?','Do we wish to be a product leader?','Do we wish to develop our own new products?']},
 {t:'quote', h:`Glass bottle manufacturers missed their opportunities by seeing themselves for too long as glass bottle makers rather than as liquid container manufacturers, while plastic and metal containers came to replace glass in many cases.`, ref:'M2·S51'},
 {t:'list', title:'Example: questions for a marketing strategy (M2·S52)', items:['Where are our customers and why do they buy?','How do our customers buy?','How is it best for us to sell?','Do we have something to offer that competitors do not?']},
 {t:'trigger', h:'“What is our business?” — answer it too narrowly (glass bottles) and you miss the market (liquid containers).'},
 {t:'check', id:'c-m2t8-1', kind:'mcq', topic:'m2t8', q:'What lesson does the glass-bottle example teach?', o:['Cut prices to beat plastic','Define the business by what customers need (containers), not by the current product','Diversify into metals','Avoid research spending'], a:1, why:'They saw themselves as glass bottle makers rather than liquid container manufacturers and missed opportunities (M2·S51).'}
 ]},
/* T9 */
{id:'m2t9', title:'Blue Ocean strategy', slides:'M2·S53–66', density:'Medium',
 why:'Blue Ocean MCQs in 3 papers; red-vs-blue differences (Sep 2024, 3 marks) and the Four Actions Framework (Oct 2025, 2 marks).',
 from:'Critical questions ask what business you are really in.',
 to:'The next tool looks at where you stand today: SWOT and TOWS.',
 blocks:[
 {t:'start', h:`Instead of fighting rivals in a crowded (“red”) market, create a new, uncontested (“blue”) market by offering <b>differentiation and low cost at the same time</b>, so the competition becomes irrelevant.`},
 {t:'p', h:`By <b>W. Chan Kim and Renée Mauborgne</b>. Blue Ocean Strategy encourages companies to create new market spaces instead of competing in saturated markets; success is found in “blue oceans” — untapped, uncontested market spaces ripe for growth. It emphasizes the <b>simultaneous pursuit of differentiation and low cost</b> to open a new market space and create new demand, making the competition irrelevant. <span class="chip ref">M2·S54</span>`},
 {t:'h', h:'Two main principles (M2·S55)'},
 {t:'list', ol:true, items:['<b>Value innovation</b> — delivering superior value to customers through differentiation and low cost; not beating the competition but making it irrelevant by redefining industry boundaries.','<b>Creation of uncontested market space</b>.']},
 {t:'h', h:'Red ocean vs blue ocean'},
 {t:'table', head:['Red ocean strategy','Blue ocean strategy'], rows:[
  ['Compete in <b>existing</b> market space','Create <b>uncontested</b> market space'],
  ['<b>Beat</b> the competition','Make the competition <b>irrelevant</b>'],
  ['Exploit <b>existing</b> demand','Create and capture <b>new</b> demand'],
  ['<b>Make</b> the value-cost trade-off','<b>Break</b> the value-cost trade-off'],
  ['Align the whole system of a firm’s activities with its strategic choice of differentiation <b>or</b> low cost','Align the whole system of a firm’s activities in pursuit of differentiation <b>and</b> low cost']], cap:'M2·S58'},
 {t:'cats', cats:[{h:'Advantages (M2·S56)',items:['Create new demand and tap into new markets','Focus on unique value propositions appealing to customers','Avoid the cutthroat competition of traditional markets','Achieve sustained profitability']},{h:'Challenges (M2·S57)',items:['High risk of failure','Significant resource investment','Uncertainty of unexplored markets']}]},
 {t:'h', h:'Applications on the slides (M2·S59–60)'},
 {t:'table', head:['Company','What the slide says'], rows:[
  ['Hindustan Unilever','Project Shakti (2001): basic hygiene and sanitation products for rural India through a direct-selling model; increased sales and brought safe drinking water and sanitation products to communities that needed them most.'],
  ['Airtel','Mobile banking services launched in 2010 (the same slide mentions Flipkart’s move into grocery delivery in 2015) — Blue Ocean used to tap new markets and create value for businesses and consumers.'],
  ['Flipkart','A small startup against bigger, established companies; focused on the needs of the Indian consumer and a unique shopping experience; quickly became a leading e-commerce company in India.'],
  ['PayTm','Created a new market by making payment via mobile phone convenient and accessible; before it, digital and mobile payments were fairly non-existent or ill-adopted.']]},
 {t:'h', h:'Four Actions Framework (ERRC)'},
 {t:'quad', y:'', x:'', cells:[['Eliminate','the factors on which the company has been competing'],['Reduce','several factors below the company standards'],['Raise','key factors that will assist in making the competition irrelevant, above the standards'],['Create','new ideas, factors and steps the company needs to achieve its blue ocean goal']], cap:'Identify and categorize factors / attributes / features / services into four groups · M2·S61–62'},
 {t:'p', h:`<b>Slide example — gaming consoles (M2·S63–66):</b> a competitor analysis of gaming console platforms in 2023, then a Four Actions analysis — <b>Eliminate</b>: graphics quality, games available; <b>Reduce</b>: price of games, price; <b>Raise</b>: family games, motion control; <b>Create</b>: marketplace, online games — plotted on a Blue Ocean strategy canvas comparing Sony PlayStation, Xbox, Nintendo and PC, and a PlayStation buyer utility map (six stages of the buyer experience cycle: purchase, delivery, use, supplements, maintenance, disposal).`},
 {t:'mnemo', title:'ERRC reads as two pairs', h:`<b>Eliminate & Reduce</b> cut cost (fewer, cheaper factors). <b>Raise & Create</b> add value (more or new factors). Doing both at once is value innovation: differentiation <i>and</i> low cost.`},
 {t:'confuse', title:'Blue Ocean vs Porter', h:`Porter (Red Ocean logic): pick differentiation <b>or</b> low cost. Blue Ocean: pursue differentiation <b>and</b> low cost together. So “high-feature phones at budget prices” fits Blue Ocean, while “no-frills, low-cost airline in existing domestic routes” competes in an existing market on cost.`},
 {t:'check', id:'c-m2t9-1', kind:'classify', topic:'m2t9', q:'Red or blue ocean?', cats:['Red ocean','Blue ocean'], items:[['Exploit existing demand',0],['Create and capture new demand',1],['Make the value-cost trade-off',0],['Make the competition irrelevant',1],['Launch a new flavour as an extension of an existing biscuit line',0],['PayTm creating mobile payments when they barely existed',1]], why:'M2·S58–60.'},
 {t:'check', id:'c-m2t9-2', kind:'match', topic:'m2t9', q:'Match the Four Actions to the gaming-console example.', pairs:[['Eliminate','Graphics quality, games available'],['Reduce','Price of games, price'],['Raise','Family games, motion control'],['Create','Marketplace, online games']], why:'M2·S64.'}
 ]},
/* T10 */
{id:'m2t10', title:'SWOT analysis and the TOWS matrix', slides:'M2·S67–84', density:'High',
 why:'The 4-mark question in 4 of 7 papers: build a labelled SWOT matrix from numbered facts, then write two TOWS strategies.',
 from:'Blue Ocean looks for new markets.',
 to:'SWOT looks at one business; the BCG matrix looks across a portfolio of businesses. Next: business portfolio analysis.',
 blocks:[
 {t:'start', h:`SWOT sorts facts into four boxes: <b>internal</b> (strengths, weaknesses) vs <b>external</b> (opportunities, threats), and <b>helpful</b> vs <b>harmful</b>. TOWS then pairs the boxes to produce four kinds of strategy: SO, ST, WO, WT.`},
 {t:'list', title:'About SWOT (M2·S68)', items:['Acronym for Strengths, Weaknesses, Opportunities and Threats.','Credited to <b>Albert Humphrey</b>, who led a research project at Stanford University in the 1960s and 1970s.','A planning tool to understand the strengths, weaknesses, opportunities and threats in a project or business.','A framework for organizing and using data from situation analysis of the internal and external environment.','Enables a group or individual to move from everyday problems and traditional strategies to a fresh perspective.']},
 {t:'quad', y:'Origin', x:'Effect on the objective', xl:['Helpful','Harmful'], cells:[['Strengths','Internal · helpful'],['Weaknesses','Internal · harmful'],['Opportunities','External · helpful'],['Threats','External · harmful']], cap:'Internal origin = attribute of the organization; external origin = attribute of the environment · M2·S68, S74'},
 {t:'table', head:['Box','Slide definition','Slide examples'], rows:[
  ['Strengths','Characteristics that give an advantage over others in the industry; positive tangible and intangible attributes, internal to the organization; includes human competencies, process capabilities, financial resources, products and services, customer goodwill and brand loyalty.','Abundant financial resources, well-known brand name, economies of scale, lower costs, superior management talent, better marketing skills, good distribution skills, committed employees'],
  ['Weaknesses','Characteristics that place the firm at a disadvantage; detract from its ability to attain the core goal. Factors that do not meet the standards we feel they should. Weaknesses are <b>controllable</b> and must be minimized and eliminated.','Limited finance, weak R&D spending, very narrow product line, limited distribution, higher costs, out-of-date products/technology, weak market image, poor marketing or management skills, under-trained employees'],
  ['Opportunities','Chances to make greater profits in the environment — external attractive factors; arise when the organization can benefit from conditions in its environment. Arise from market, competition, industry/government and technology; recognize and grasp them.','Rapid market growth, complacent rivals, changing customer needs/tastes, new uses for product, economic boom, government deregulation, sales decline for a substitute'],
  ['Threats','External elements that could cause trouble — factors beyond the organization’s control that could put its mission or operation at risk. They compound vulnerability when they relate to weaknesses. Threats are <b>uncontrollable</b>.','Entry of foreign competitors, new substitute products, product life cycle in decline, changing customer needs/tastes, rivals’ new strategies, increased government regulation, economic downturn']], cap:'M2·S69–72'},
 {t:'h', h:'Slide exercise: a car maker’s new EV'},
 {t:'quad', y:'', x:'', cells:[['Strengths','Eco-friendly · silent engine · simpler mechanism · low cost of maintenance and cheaper to run · energy savings from regenerative braking'],['Weaknesses','High price · needs time to recharge · battery change is expensive · lack of recharging infrastructure'],['Opportunities','Huge untapped EV market · growing demand for green technologies · rising fuel costs · lower taxes · government subsidy for eco-friendly vehicles'],['Threats','Entry of competitors · rise in cost of electricity · availability of hybrid vehicles adding to competition']], cap:'M2·S73–74'},
 {t:'h', h:'TOWS matrix'},
 {t:'p', h:`TOWS analysis is the interlinking of the internal strengths and weaknesses of a company with the threats and opportunities in its external environment. It categorizes the strategies available to a company by aligning internal elements with external factors. <span class="chip ref">M2·S75</span>`},
 {t:'table', head:['','Internal strengths (S)','Internal weaknesses (W)'], rows:[
  ['<b>External opportunities (O)</b><br><span class="small">current and future economic conditions, political and social changes, new products, services and technology (consider risks also)</span>','<b>SO — Maxi-Maxi</b><br>Potentially the most successful strategy: use strengths to take advantage of opportunities','<b>WO — Mini-Maxi</b><br>Developmental strategy to overcome weaknesses in order to take advantage of opportunities'],
  ['<b>External threats (T)</b><br><span class="small">lack of energy, competition, areas similar to opportunities</span>','<b>ST — Maxi-Mini</b><br>Use strengths to cope with or avoid threats','<b>WT — Mini-Mini</b><br>Retrenchment, liquidation or joint venture to minimize both weaknesses and threats']], cap:'TOWS matrix for strategy formulation · M2·S77'},
 {t:'p', h:`<b>Retrenchment strategy</b> (the WT example): used to reduce the diversity or overall size of operations, often to cut expenses and become financially stable; typically withdrawing from certain markets or discontinuing products or services for a beneficial turnaround. <span class="chip ref">M2·S78</span>`},
 {t:'table', head:['Pair','Apple example on the slides'], rows:[
  ['SO','Strong brand awareness, loyalty and product design + growing popularity of touchscreen smartphones → the first iPhone (M2·S80)'],
  ['ST','Product design and brand loyalty used to push its proprietary Lightning connection; when EU regulators push Type-C (to reduce e-waste), brand loyalty keeps customers buying Apple’s Type-C charger over cheaper alternatives (M2·S81)'],
  ['WO','Smaller product portfolio and slower to capitalize on trends; wearables traction from 2010 → Apple Watch in 2015 overcame the weakness (M2·S82)'],
  ['WT','Apple TV (2007) had limited functionality and interconnectivity vs Roku or Fire Stick; streaming threat growing → launch of Apple TV+ reduces the weakness and counters the threat (M2·S83)']]},
 {t:'p', h:`<b>Dynamics of the TOWS matrix (M2·S84):</b> the matrix is redrawn for the past, the present, and future points (present + T1, present + T2), because internal and external factors change over time.`},
 {t:'mnemo', title:'Maxi / Mini', h:`Strengths and opportunities are things to <b>maximize</b>; weaknesses and threats are things to <b>minimize</b>. Read each pair in the order internal–external: <b>SO</b> Maxi-Maxi, <b>ST</b> Maxi-Mini, <b>WO</b> Mini-Maxi, <b>WT</b> Mini-Mini.`},
 {t:'confuse', title:'weakness or threat?', h:`Ask “is it inside the company and controllable?” → weakness. “Is it outside and beyond control?” → threat. E.g. “raw-material price fluctuations” are a threat; “heavy dependence on agricultural raw materials” is a weakness (the dependence is the company’s own).`},
 {t:'check', id:'c-m2t10-1', kind:'classify', topic:'m2t10', q:'Classify each fact (EV example and similar).', cats:['Strength','Weakness','Opportunity','Threat'], items:[['Needs time to recharge',1],['Government subsidy for eco-friendly vehicles',2],['Silent engine',0],['Entry of competitors',3],['Lack of recharging infrastructure',1],['Rising fuel costs',2]], why:'M2·S74.'},
 {t:'check', id:'c-m2t10-2', kind:'match', topic:'m2t10', q:'Match each TOWS strategy to its label.', pairs:[['SO','Maxi-Maxi'],['ST','Maxi-Mini'],['WO','Mini-Maxi'],['WT','Mini-Mini']], why:'M2·S77.'},
 {t:'check', id:'c-m2t10-3', kind:'mcq', topic:'m2t10', q:'Which strategy does the slide give as the WT example?', o:['Product development','Retrenchment, liquidation or joint venture','Market penetration','Using strengths to avoid threats'], a:1, why:'M2·S77–78.'}
 ]},
/* T11 */
{id:'m2t11', title:'Business portfolio analysis: the BCG matrix', slides:'M2·S85–102', density:'High',
 why:'Asked in 6 of 7 papers: 2–4 mark classification cases (Hassan, Dabur, Global-Tech), a use-with-example question, a product-life-cycle question and an MCQ.',
 from:'SWOT analyses one business.',
 to:'The last tool asks how a business competes. Next: Porter’s generic strategies.',
 blocks:[
 {t:'start', h:`The BCG matrix plots each business unit (SBU) by <b>market growth rate</b> (up the side) and <b>relative market share</b> (along the bottom). That gives four boxes — question marks, stars, cash cows, dogs — each with its own strategy.`},
 {t:'p', h:`The Business Portfolio Matrix, or <b>Growth-Share Matrix</b>, was developed by the <b>Boston Consulting Group (BCG) in the 1970s</b>. Businesses or products are classified as low or high performers depending upon their <b>market growth rate</b> and <b>relative market share</b>. It is among the best-known corporate portfolio analysis tools; each Strategic Business Unit (SBU) is plotted on a two-dimensional grid. <span class="chip ref">M2·S86–87</span>`},
 {t:'quad', y:'Market growth rate', x:'Relative market share', xl:['Low','High'], cells:[['Question marks','High growth, low share'],['Stars','High growth, high share'],['Dogs','Low growth, low share'],['Cash cows','Low growth, high share']], cap:'M2·S87'},
 {t:'html', h:`<div class="card tight" style="font-family:var(--f-mono);font-size:.9rem;line-height:1.7"><div>Relative Market Share = SBU sales this year / leading competitor’s sales this year</div><div>Market Growth Rate = Industry sales this year − Industry sales last year</div><div class="small muted" style="font-family:var(--f-body)">Formulas exactly as written on M2·S88. Relative market share measures comparative advantage by market dominance; the theory underneath is the experience curve, with market share achieved through overall cost leadership.</div></div>`},
 {t:'list', title:'Why use the BCG matrix? To assess (M2·S89)', items:['Profiles of products/businesses','The cash demands of products','The development cycles of products','Resource allocation and divestment decisions']},
 {t:'steps', items:[['Identify and divide the company into SBUs',''],['Assess each SBU’s prospects','by relative market share and growth rate of its industry'],['Classify the SBUs on the BCG matrix',''],['Develop strategic objectives for each SBU','']], cap:'Main steps in BCG · M2·S91'},
 {t:'h', h:'The four quadrants'},
 {t:'table', head:['Quadrant','Slide description','Implication (M2·S96)'], rows:[
  ['Question marks<br><span class="small">High growth, low share</span>','Most businesses start off as question marks; absorb great amounts of cash if share stays low; can become a star and eventually a cash cow, but can also become a dog; investments should be high. (S92) “Don’t know what to do with opportunities; decide whether to increase investment.” (S91)','Resources should be invested to enhance their competitive positions'],
  ['Stars<br><span class="small">High growth, high share</span>','Leaders in business; require heavy investment to maintain share; large cash consumption and generation; hold the market growth, otherwise the star becomes a cash cow. (S93) “Doing well, great opportunities.” (S91)','Long-term growth potential; should continue to receive substantial investment funding'],
  ['Cash cows<br><span class="small">Low growth, high share</span>','Foundation of the company and often the stars of yesterday; generate more cash than required; extract profits by investing as little cash as possible; in a mature, not growing or declining industry. (S94) “Doing well in a no-growth market with limited opportunities.” (S91)','Limited long-run potential but a source of current cash to fund stars and question marks'],
  ['Dogs<br><span class="small">Low growth, low share</span>','Cash traps; little potential to bring in cash; their number should be minimized; business at a declining stage. (S95) “Weak in market, difficult to make profit.” (S91)','Weak position and limited potential; most analysts recommend they be divested']]},
 {t:'h', h:'Four strategies'},
 {t:'steps', items:[['Build / Grow',''],['Hold / Maintain',''],['Harvest',''],['Divest','']], cap:'“Four strategies emerged from BCG matrix” · M2·S101'},
 {t:'table', head:['Quadrant','Strategy that fits the slide wording','Wording it rests on'], rows:[['Question mark','Build (invest) — or divest if it cannot win share','“Resources should be invested… to enhance competitive positions” (S96); “receive enough investment… or companies are advised to disinvest” (S97)'],['Star','Build / hold','“Continue to receive substantial investment funding” (S96); “attempts should be made to hold the market growth” (S93)'],['Cash cow','Hold / harvest','“Extract the profits by investing as little cash as possible” (S94); cash funds stars and question marks (S96)'],['Dog','Divest','“Most analysts recommend that they be divested” (S96)']], cap:'The slides list the four strategies without pairing them to quadrants; this pairing is built from the quadrant descriptions.'},
 {t:'h', h:'BCG and the product life cycle'},
 {t:'steps', items:[['Development',''],['Introduction (launch)','Question mark'],['Growth (product–market fit)','Star'],['Maturity','Cash cow'],['Decline (end of life)','Dog']], cap:'Product life cycle chart with BCG icons at each stage · M2·S90'},
 {t:'h', h:'Applications, benefits and limitations'},
 {t:'p', h:`<b>Application (M2·S97):</b> the matrix exposes a common mistake — a one-size-fits-all strategy such as a single growth target or return on capital for the whole corporation. Cash cows reach profit targets easily and are often allowed to reinvest heavily in mature businesses; dogs fight an impossible battle with occasional hopeless turnaround investments; so question marks and stars receive only mediocre funds and can never become cash cows. Either give these SBUs enough investment to achieve real market dominance, or disinvest.`},
 {t:'table', head:['Status','HUL','ITC','Nestlé','Dabur','P&G'], rows:[
  ['Cash cow','AXE, Vaseline Petroleum Jelly','Cigarettes','Cerelac','Chyawanprash, Vatika Amla, Hajmola','Ariel, Vicks, Tide'],
  ['Star','Lux, Sun-Silk, Fair & Lovely, Ponds, Kissan Ketchup, Surf-Excel, Annapurna Atta','Paperboards/Packaging, Agri-Business','Nescafe, Maggi Noodles','Real Fruit Juice, Active Fruit Juice, Dabur Red Toothpaste','Gillette, Pantene, Head & Shoulders, Pamper, Whisper'],
  ['Question','Rin, Pepsodent, Domex','Automotive, Furniture, Financial, Tobacco, Food','Milo, Kit-Kat, Munch, Maggi Soup, Nestle Butter, Nesvita, Nestle Maggi Ketchup','Odomos, Sanifresh, Oxylife Facial','Olay'],
  ['Dog','Wheel','ITC InfoTech','Nestea, Milkybar','Dabur Gulabari, Burst Fruit Juice','—']], cap:'Company examples exactly as on M2·S100'},
 {t:'discrep', h:`M2·S100 lists Dabur <b>Chyawanprash as a cash cow</b> and <b>Real Fruit Juice as a star</b>. The Sep 2025 paper (Q18) gives data that make Chyawanprash a <b>star</b> (50% share, market growing 20–24%) and Real Juice a <b>dog</b> (6–8% share, 2% growth). In a case question, always classify from the data given in the question.`},
 {t:'cats', cats:[{h:'Benefits (M2·S98)',items:['Simple and easy to understand','Quickly and simply screens the opportunities open to you and helps you make the most of them','Identifies how corporate cash resources can best be used to maximize future growth and profitability']},{h:'Limitations (M2·S99)',items:['Uses only two dimensions (relative market share, market growth rate)','Problems getting data for market share and growth','High market share does not mean profits all the time','Low-share businesses can be profitable too','Neglects synergy between business units','Market growth is not the only indicator of attractiveness','No clear definition of what constitutes a “market”','Neglects small competitors with fast-growing share']}]},
 {t:'list', title:'Growth strategies (M2·S102)', items:['<b>Direct expansion</b> — increasing a company’s size, revenues, operation, or workforce.','<b>Merger</b> — two companies, usually of similar size, combine resources to form a new company.','<b>Acquisition</b> — a larger company buys a smaller one and incorporates its operations.']},
 {t:'check', id:'c-m2t11-1', kind:'classify', topic:'m2t11', q:'Place each unit (data from the Mar 2026 paper).', cats:['Question mark','Star','Cash cow','Dog'], items:[['Cloud storage: market +15%, share 45% vs nearest rival 10%',1],['Legacy antivirus: market +2%, share 60%, high cash, minimal investment',2],['Internal disc drives: market −5%, share 4% vs leader 70%',3],['AI assistants: market +30%, share 5%, new entry',0]], why:'High growth + high share = star; low growth + high share = cash cow; low + low = dog; high growth + low share = question mark (M2·S87, S92–95).'},
 {t:'check', id:'c-m2t11-2', kind:'mcq', topic:'m2t11', q:'On the product life cycle (M2·S90), which BCG category sits at maturity?', o:['Question mark','Star','Cash cow','Dog'], a:2, why:'Introduction = question mark, growth = star, maturity = cash cow, decline = dog.'},
 {t:'check', id:'c-m2t11-3', kind:'fill', topic:'m2t11', q:'Relative market share = SBU sales this year / ___ sales this year.', a:[['leading competitors','leading competitor','leading competitor\'s','leading competitors\'']], why:'M2·S88.'}
 ]},
/* T12 */
{id:'m2t12', title:'Porter’s generic competitive strategies', slides:'M2·S103–108', density:'High',
 why:'In all 7 papers: an MCQ in six (pick the odd strategy) and a 4-mark “quote and identify” question in Oct 2025.',
 from:'BCG decides where to invest across businesses.',
 to:'That completes Chapter 2. Next: the module recap and PYQ practice.',
 blocks:[
 {t:'start', h:`A firm wins either by <b>low cost</b> or by <b>differentiation</b>, and it targets either the <b>whole market</b> or <b>a segment</b>. Crossing those two choices gives cost leadership, differentiation, and focus (cost focus or differentiation focus).`},
 {t:'p', h:`The fundamental basis of average profitability in the long run is <b>sustainable competitive advantage</b>. There are two basic types of competitive advantage a firm can possess: <b>low cost or differentiation</b>. Combined with the <b>market scope</b> of a firm, they lead to three generic strategies for achieving average performance in an industry: <b>cost leadership, differentiation and focus</b> (cost focus, differentiation focus). <span class="chip ref">M2·S104</span>`},
 {t:'quad', y:'Market scope', x:'Competitive advantage', xl:['Low cost','Differentiation'], cells:[['Cost leadership','Entire market'],['Differentiation','Entire market'],['Cost focus','A segment'],['Differentiation focus','A segment']], cap:'M2·S104 (wording “average profitability / average performance” exactly as on the slide)'},
 {t:'table', head:['Strategy','Slide explanation','Slide examples'], rows:[
  ['Overall cost leadership','Gain competitive advantage by reducing cost below competitors’; keep a close watch on costs in R&D, sales and services; sell at low prices and still make a profit.','Timex: relatively simple, low-cost watches for the mass market (M2·S105)'],
  ['Differentiation','Distinguish from competitors by offering something unique through the quality of products or services; can charge more because customers pay for the extra value they perceive.','Rolex (handmade, gold and stainless steel, strenuous tests); Porsche; Caterpillar (prompt service, spare parts) (M2·S106)'],
  ['Focus','Concentrate on a specific regional market, product line, or group of buyers — with either a differentiation focus or a cost-leadership focus in that market.','Longines: highly jewelled watches for wealthy female customers; Fisher-Price: calculators with large bright buttons for parents of preschoolers — both differentiation focus (M2·S107)']]},
 {t:'p', h:`<b>Stuck in the middle</b> (marked “for your reading & better understanding only”): a company that tries to engage in each generic strategy but fails to achieve any has no competitive advantage and competes at a disadvantage against the cost leader, the differentiators and the focusers — though it may still earn profits in a highly attractive industry or if competitors are also stuck in the middle. <span class="chip ref">M2·S108</span>`},
 {t:'remember', h:`Two questions decide the box: <b>How do they win?</b> (cheaper → cost; unique → differentiation). <b>Whom do they serve?</b> (everyone → leadership/differentiation; a specific region, product line or buyer group → focus).`},
 {t:'check', id:'c-m2t12-1', kind:'classify', topic:'m2t12', q:'Identify each strategy (Oct 2025 paper examples).', cats:['Cost leadership','Differentiation','Cost focus','Differentiation focus'], items:[['Reliance Jio: affordable plans to capture mass-market share',0],['Tanishq: high-quality, innovative jewellery designs',1],['Big Bazaar: price-sensitive customers in specific urban and semi-urban regions',2],['FabIndia: unique handcrafted products for niche customers valuing traditional crafts',3]], why:'Low cost vs uniqueness, crossed with entire market vs a segment (M2·S104–107).'},
 {t:'check', id:'c-m2t12-2', kind:'mcq', topic:'m2t12', q:'In which market would cost leadership be least effective?', o:['A highly price-sensitive market','An industry with significant economies of scale','A market where customers prioritize unique, high-quality products over price','A mass market for simple products'], a:2, why:'Customers paying for uniqueness is the logic of differentiation (M2·S106); cost leadership sells at low prices (M2·S105).'}
 ]}
],

  'Writing full sentences inside the SWOT boxes when the paper says “enter only statement numbers”.',
  'Giving TOWS strategies without naming the pair (e.g. “WO — Mini-Maxi”) or without linking to specific statement numbers.',

 minute:[
  'Plan = blueprint. Planning reduces uncertainty, gives direction, benchmarks performance.',
  '8 plans: mission, objective, strategy, policy, procedure, rule, program, budget.',
  'Perspectives: content, breadth, time frame (5+ yrs vs ≤1 yr), specificity, frequency (single-use vs standing) — not mutually exclusive.',
  '8 steps: aware → objectives → premises → alternatives → compare → choose → supporting plans → budgets.',
  'MBO: Drucker 1954; agreed objectives; process: top objectives → clarify roles → subordinate objectives → recycle.',
  'Strategy levels: corporate (what business?), business (how compete?), functional (how support?).',

 ],
