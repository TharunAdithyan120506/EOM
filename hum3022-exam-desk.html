cards:[
 {id:'f2-1',k:'term',t:'m2t1',f:'Plan',b:'A blueprint for goal achievement that specifies the necessary resource allocations, schedules, tasks and other actions to achieve the purpose.',r:'M2·S4'},
 {id:'f2-2',k:'qa',t:'m2t1',f:'Five reasons planning is important (M2·S5)',b:'Bridges the gap between where we are and where we want to be; reduces uncertainties; provides direction; resource allocation; minimizes impulsive and arbitrary decisions.',r:'M2·S5'},
 {id:'f2-3',k:'process',t:'m2t2',f:'Eight types of plans',b:'Purpose/mission/vision → goal/objective → strategy → policy → procedure → rules → programs → budgets.',r:'M2·S8'},
 {id:'f2-4',k:'compare',t:'m2t2',f:'Policy vs procedure vs rule',b:'Policy: general statement guiding thinking (promote from within). Procedure: chronological steps (admission process). Rule: specific action/non-action, no flexibility, no time sequence (no smoking zone).',r:'M2·S13–16'},
 {id:'f2-5',k:'term',t:'m2t2',f:'Program',b:'A complex of goals, policies, procedures, rules, task assignments, steps to be taken, resources to be employed and other elements to carry out a course of action; ordinarily supported by budgets.',r:'M2·S17'},
 {id:'f2-6',k:'term',t:'m2t2',f:'Budget and its three kinds',b:'Expected results in numerical terms (“numberized programs”). Variable/flexible: depends on output level. Program: agencies and departments identify goals. Zero-based: combination of variable and program budgets.',r:'M2·S18'},
 {id:'f2-7',k:'confusion',t:'m2t2',f:'“Recruit 35–40% of the workforce through campus placements every year” — rule or policy?',b:'<b>Policy</b>: a practice that guides decisions, like “promoting from within” (the slide says policies are often implied from managers’ actions).',r:'M2·S13–14'},
 {id:'f2-8',k:'compare',t:'m2t3',f:'Strategic vs tactical plans',b:'Strategic: whole organization, overall objectives, positions it in its environment, long periods, less specific. Tactical: specific parts, derived from strategic objectives, details of how, shorter periods, updated continuously.',r:'M2·S22'},
 {id:'f2-9',k:'compare',t:'m2t3',f:'Long-term vs short-term plans',b:'Long: beyond five years, what the org wants to become, high uncertainty. Short: up to one year, day-to-day basis, “are we doing things right?”, must fit long-range plans.',r:'M2·S23'},
 {id:'f2-10',k:'compare',t:'m2t3',f:'Specific vs directional; single-use vs standing',b:'Specific: clearly defined, “what, when, where, how much, by whom” (lesson plan). Directional: flexible general guidelines. Single-use: unique situation (one-day sale). Standing: ongoing, repeated actions (customer satisfaction policy).',r:'M2·S24–25'},
 {id:'f2-11',k:'process',t:'m2t4',f:'Eight steps in planning',b:'Being aware of opportunities → setting objectives → considering planning premises → identifying alternatives → comparing alternatives → choosing an alternative → formulating supporting plans → numberizing plans by making budgets.',r:'M2·S26'},
 {id:'f2-12',k:'process',t:'m2t5',f:'Hierarchy of objectives (7 levels)',b:'Socio-economic purpose → mission → overall objectives → more specific overall objectives (KRAs) → division → department/unit → individual (performance, personal development).',r:'M2·S10, S28'},
 {id:'f2-13',k:'compare',t:'m2t5',f:'Quantitative vs qualitative objectives',b:'Quantitative: numerical, concrete, measurable (revenue +10%, costs −15%). Qualitative: hard to measure, not numerical (customer experience, brand reputation).',r:'M2·S31'},
 {id:'f2-14',k:'qa',t:'m2t5',f:'Why are objectives multiple?',b:'A business must satisfy many stakeholders — owners, employees, consumers, creditors, vendors, society — and sets separate objectives for each.',r:'M2·S30'},
 {id:'f2-15',k:'term',t:'m2t6',f:'MBO (definition and origin)',b:'A comprehensive managerial system integrating key managerial activities systematically, directed toward effective and efficient achievement of organizational and individual objectives. Also called management by planning; popularized by Peter Drucker, <i>The Practice of Management</i> (1954).',r:'M2·S32–33'},
 {id:'f2-16',k:'process',t:'m2t6',f:'Process of MBO',b:'Setting preliminary objectives at the top → clarifying organizational roles → setting subordinates’ objectives → recycling of objectives.',r:'M2·S37'},
 {id:'f2-17',k:'qa',t:'m2t6',f:'Drucker’s eight key result areas',b:'Market standing; innovation; productivity; physical and financial resources; profitability; managerial performance and development; worker performance and attitude; public responsibility. (+ service, quality)',r:'M2·S38'},
 {id:'f2-18',k:'confusion',t:'m2t6',f:'“Lower-level goals take precedence” — benefit, weakness or problem of MBO?',b:'A <b>problem</b> (with change adversely affecting planning, low morale, over-centralized authority, paperwork).',r:'M2·S45'},
 {id:'f2-19',k:'qa',t:'m2t6',f:'Six weaknesses of MBO',b:'Failure to teach its philosophy; failure to give guidelines to goal setters; difficulty of setting goals; emphasis on short-run goals; danger of inflexibility; using numbers where they don’t apply.',r:'M2·S44'},
 {id:'f2-20',k:'process',t:'m2t6',f:'MBO system diagram — main flow',b:'Enterprise objectives & planning premises → KRAs → appropriate organization → superior’s objectives → (superior’s recommendation + subordinate’s statement + resources) → agreement → subordinate’s objectives → ongoing performance ⇄ periodic review ⇄ corrective measures → final performance → final review & appraisal.',r:'M2·S39'},
 {id:'f2-21',k:'process',t:'m2t7',f:'Strategic planning process — main boxes',b:'Inputs & claimants’ goals → enterprise profile, top management orientation, purpose & objectives → external threats & opportunities, internal strengths & weaknesses → alternate strategies → evaluation & choice → medium/short-run planning, implementation, re-engineering structure → leadership, control; consistency testing & contingency planning throughout.',r:'M2·S47'},
 {id:'f2-22',k:'qa',t:'m2t7',f:'Three levels of strategy',b:'Corporate — what business are we in? Business/competitive — how do we compete? Functional — how do we support business-level strategy?',r:'M2·S48'},
 {id:'f2-23',k:'qa',t:'m2t8',f:'Five tools to develop strategy',b:'Critical question analysis; Blue Ocean strategy; SWOT & TOWS matrix; business portfolio analysis (BCG); Porter’s generic model.',r:'M2·S50'},
 {id:'f2-24',k:'compare',t:'m2t9',f:'Red ocean vs blue ocean (5 rows)',b:'Existing vs uncontested market space; beat vs make competition irrelevant; exploit existing vs create new demand; make vs break the value-cost trade-off; differentiation OR low cost vs differentiation AND low cost.',r:'M2·S58'},
 {id:'f2-25',k:'process',t:'m2t9',f:'Four Actions Framework',b:'Eliminate factors the industry competes on; Reduce some below standard; Raise key factors above standard; Create new factors. Console example: eliminate graphics quality/games available; reduce price; raise family games/motion control; create marketplace/online games.',r:'M2·S62–64'},
 {id:'f2-26',k:'qa',t:'m2t9',f:'Two principles of Blue Ocean strategy',b:'Value innovation (superior value through differentiation and low cost, making competition irrelevant) and creation of uncontested market space.',r:'M2·S55'},
 {id:'f2-27',k:'compare',t:'m2t10',f:'Strengths/weaknesses vs opportunities/threats',b:'S and W are internal (attributes of the organization); W are controllable. O and T are external (attributes of the environment); T are uncontrollable.',r:'M2·S68–72'},
 {id:'f2-28',k:'term',t:'m2t10',f:'SO, ST, WO, WT strategies',b:'SO Maxi-Maxi (strengths exploit opportunities); ST Maxi-Mini (strengths cope with threats); WO Mini-Maxi (overcome weaknesses to use opportunities); WT Mini-Mini (retrenchment, liquidation, joint venture).',r:'M2·S77'},
 {id:'f2-29',k:'qa',t:'m2t10',f:'Apple’s WT move on the slides',b:'Apple TV had limited functionality vs Roku/Fire Stick (weakness) while streaming services multiplied (threat) → launched Apple TV+.',r:'M2·S83'},
 {id:'f2-30',k:'term',t:'m2t11',f:'BCG matrix axes and developer',b:'Developed by the Boston Consulting Group in the 1970s. Axes: market growth rate (vertical) and relative market share (horizontal).',r:'M2·S86–87'},
 {id:'f2-31',k:'compare',t:'m2t11',f:'Four BCG quadrants',b:'Question mark: high growth, low share. Star: high growth, high share. Cash cow: low growth, high share. Dog: low growth, low share.',r:'M2·S87'},
 {id:'f2-32',k:'qa',t:'m2t11',f:'BCG and the product life cycle',b:'Introduction → question mark; growth → star; maturity → cash cow; decline → dog.',r:'M2·S90'},
 {id:'f2-33',k:'qa',t:'m2t11',f:'Four main steps in BCG',b:'Identify and divide the company into SBUs → assess each SBU by relative share and industry growth → classify on the matrix → develop strategic objectives for each SBU.',r:'M2·S91'},
 {id:'f2-34',k:'qa',t:'m2t11',f:'Four limitations of BCG',b:'Any four: only two dimensions; data problems; high share ≠ profits always; low share can be profitable; neglects synergy; growth isn’t the only attractiveness indicator; “market” undefined; ignores small fast-growing competitors.',r:'M2·S99'},
 {id:'f2-35',k:'compare',t:'m2t12',f:'Porter: cost leadership vs differentiation vs focus',b:'Cost leadership: costs below competitors, low prices (Timex). Differentiation: something unique, premium price (Rolex, Porsche, Caterpillar). Focus: a region, product line or buyer group, by cost or differentiation (Longines, Fisher-Price).',r:'M2·S105–107'},
 {id:'f2-36',k:'term',t:'m2t12',f:'Stuck in the middle',b:'Trying every generic strategy but achieving none — no competitive advantage and a disadvantage against cost leaders, differentiators and focusers (slide marked “for reading only”).',r:'M2·S108'},
 {id:'f2-37',k:'pyq',t:'m2t10',f:'PYQ trigger: “Create a SWOT analysis… (labelled matrix, statement numbers only). Also create two TOWS strategies.” (4 marks)',b:'<ol><li>Draw a 2×2: Internal (S, W) / External (O, T); helpful / harmful.</li><li>Write only statement numbers in each box.</li><li>Write two strategies, each named (e.g. WO Mini-Maxi) and citing the numbers it combines.</li><li>If asked to tackle weaknesses, use WO and WT.</li></ol>',r:'M2·S68–78'},
 {id:'f2-38',k:'pyq',t:'m2t11',f:'PYQ trigger: “Place these units in the BCG matrix and give strategies” (2–4 marks)',b:'Draw the grid with labelled axes; compute relative share where data allow; place each unit; give strategy per quadrant (star build/hold, cash cow hold/harvest, QM build or divest, dog divest) citing the slide reason.',r:'M2·S87–97'},
 {id:'f2-39',k:'pyq',t:'m2t2',f:'PYQ trigger: “Identify and explain which type of plan each guideline represents” (3–4 marks)',b:'For each line: quote → plan type → slide definition in one sentence → the matching slide example (e.g. “no smoking zone” = rule).',r:'M2·S9–18'},
 {id:'f2-40',k:'pyq',t:'m2t6',f:'PYQ trigger: “Draw a block diagram of managing and appraising by objectives” (3 marks)',b:'Reproduce M2·S39: enterprise objectives & premises → KRAs → organization → superior’s objectives → recommendation/statement/resources → agreement → subordinate’s objectives → performance, periodic review, corrective measures → final performance → final review & appraisal, with feedback arrows. Label with the case’s roles (e.g. HoD and faculty).',r:'M2·S39'}
]
});

 to:'Organizing follows a fixed sequence. Next: the four steps in the organizing process.',

 {t:'start', h:`An organization is people pursuing defined objectives. Organizing divides the work, aligns the tasks with the goal, and coordinates people and resources.`},
 {t:'quote', h:`Organization refers to a collection of people, who are involved in pursuing defined objectives. The organization encompasses division of work among employees and alignment of tasks towards the ultimate goal of the company. It can also be referred as the second most important managerial function, that coordinates the work of employees, procures resources and combines the two, in pursuance of company’s goals.`, ref:'M3·S4'},
 {t:'cats', cats:[{h:'Importance of organizations (M3·S5)',items:['Bring together resources to achieve desired goals','Produce goods and services efficiently','Facilitate innovation','Use modern manufacturing & information technologies','Adapt to and influence a changing environment','Create value for owners, customers and employees','Accommodate ongoing challenges of diversity, ethics etc.','Motivation and coordination of employees']}]},
 {t:'h', h:'Nature and purpose of organizing'},
 {t:'p', h:`For a role to exist and be meaningful to people, it must incorporate: <span class="chip ref">M3·S6</span>`},
 {t:'list', ol:true, items:['Verifiable objectives.','A clear idea of the major duties and activities involved.','An understood area of discretion or authority, so that the person filling the role knows what he can do to accomplish goals.']},

 {t:'check', id:'c-m3t1-1', kind:'reveal', topic:'m3t1', q:'What three things must a role include (M3·S6)?', a:'Verifiable objectives; a clear idea of the major duties and activities involved; an understood area of discretion or authority, so the person knows what he can do to accomplish goals.'}
 ]},

 {t:'start', h:`The <b>formal</b> organization is the one management designs on purpose — the org chart. The <b>informal</b> organization grows by itself inside it — friendships, coffee groups, sports teams.`},
 {t:'table', head:['','Formal organization','Informal organization'], rows:[
  ['Definition','The intentional structure of roles in a formally organized enterprise (S8)','A network of personal and social relations not established or required by the formal organization but arising spontaneously as people associate with one another (S8)'],
  ['Nature','A structure of well-defined jobs, each bearing a measure of authority and responsibility; a conscious determination by which people accomplish goals by adhering to norms laid down by the structure (S9)','A network of personal and social relationships which spontaneously originates within the formal set-up; relationships built on likes, dislikes, feelings and emotions — social groups based on friendships (S10)'],
  ['Accountability','An arbitrary set-up in which each person is responsible for his performance (S9)','No conscious effort is made to have it; it emerges from the formal organization and is not based on any rules and regulations (S10)'],

 {t:'p', h:`M3·S11 overlays both on one chart: the formal chart runs President → Vice Presidents → Divisional Managers → Managers, while informal groups (golf club, bowling team, morning coffee regulars, weekend adventure sports) cut across it.`},

{id:'m3t4', title:'Span of control: tall vs flat, factors, wide vs narrow', slides:'M3·S13–16', density:'High',
 why:'Tested in all 7 papers: MCQs on narrow/wide situations, and descriptive questions on factors (Sep 2024, Mar 2026), pros and cons (Nov 2024) and a case (Apr 2025).',

 {t:'quote', h:`Span of control refers to the number of subordinates who report directly to an executive or supervisor. The differences in the span of control have direct implications on the shape of the organization.`, ref:'M3·S14'},
 {t:'p', h:`<b>To be effective</b>, organizations must find the optimal span of control: <b>narrow enough</b> to permit managers to maintain control over subordinates, and <b>wide enough</b> so that the possibility of micromanaging (interfering) is minimized. <span class="chip ref">M3·S14</span>`},
 {t:'table', head:['Tall structure','Flat structure'], rows:[['Many levels of authority','Fewer levels'],['Narrow spans of control','Wide spans of control']], cap:'M3·S13'},
 {t:'h', h:'Eight factors affecting the optimal span'},
 {t:'cats', cats:[{h:'The optimal span of control depends on (M3·S15)',items:['Subordinates’ training','Delegation of authority','Planning','Rate of change','Communication techniques','Kind of activity','Kind of organization','Organization level']},{h:'Proximity of subordinates (M3·S16)',items:['Job complexity','Employee ability','Similarity of subordinates’ jobs','Managerial ability','Technology']}]},
 {t:'mnemo', title:'the eight factors as a manager’s question', h:`“Are my people <b>trained</b>, have I <b>delegated</b>, is it <b>planned</b>, how fast does it <b>change</b>, how well do we <b>communicate</b> — and what <b>activity</b>, <b>organization</b> and <b>level</b> is this?”`},
 {t:'html', h:`<div class="box gap"><div class="bt">Direction of each factor · slide-based inference</div><div>M3·S15 names the factors but not which way they push. Using M3·S14 (narrow enough to keep control, wide enough to avoid micromanaging), the papers treat them like this — label it as your reasoning in an answer:</div></div>`},
 {t:'table', head:['Points towards a NARROW span (more control needed)','Points towards a WIDE span (less control needed)'], rows:[
  ['Untrained or inexperienced subordinates; incompetent or untrained manager','Well-trained subordinates; high employee autonomy'],
  ['Little delegation; subordinates unwilling to take responsibility','Clear delegation and well-defined tasks'],
  ['Poor or vague communication techniques','Good communication techniques'],
  ['High rate of change; constant changes in the system','Stable, planned work'],

 {t:'confuse', title:'span of control vs span of management', h:`M3·S14 defines <b>span of control</b> (subordinates reporting directly). Urwick’s <b>principle of span of management</b> (M3·S22) is “the number of persons an individual can efficiently and effectively manage”, with a limit set by underlying variables. Same idea, different wording — quote the one the question names.`},

{id:'m3t5', title:'Urwick’s ten principles of organizing', slides:'M3·S17–28', density:'High',

 from:'Span, reporting lines and delegation shape the structure.',
 to:'The principles guide how work is grouped into units. Next: departmentation.',
 blocks:[
 {t:'start', h:`Lyndall Urwick, a British management consultant, pulled earlier ideas such as Fayol’s into ten principles for building an organization structure (<i>The Elements of Business Administration</i>, 1943).`},
 {t:'p', h:`Lyndall Fownes Urwick MC was a British management consultant and business thinker, recognized for integrating the ideas of earlier theorists like Henri Fayol into a comprehensive theory of management administration. He wrote <i>The Elements of Business Administration</i>, published in 1943. <span class="chip ref">M3·S17</span>`},
 {t:'table', head:['#','Principle','Slide wording'], rows:[
  ['1','Unity of objectives','An organization structure is effective if it enables individuals to contribute to enterprise objectives. A common goal is devised for the business as a whole; without it, departments set their own, possibly conflicting, goals. (S19)'],
  ['2','Organizational efficiency','An organization is efficient if it is structured to aid the accomplishment of enterprise objectives with a minimum of unsought consequences or costs. (S20)'],
  ['3','Specialization','The whole work should be divided amongst the subordinates on the basis of qualifications, abilities, and skills. (S21)'],
  ['4','Span of management','The number of persons an individual can efficiently and effectively manage; there is a limit, and the exact number depends on the impact of underlying variables. (S22)'],
  ['5','Scalar chain','A chain of command or authority that flows from the upper organizational level to the lowest levels and clarifies who reports to whom. (S23)'],
  ['6','Unity of command','Every subordinate is answerable and accountable to one boss at one time. (S24)'],
  ['7','Delegation','Authority must be delegated as far down in the organization as possible; adequate authority should be delegated to all individuals so they accomplish the results expected. (S25)'],
  ['8','Parity of authority and responsibility','Responsibility for actions cannot be greater than that implied by the authority delegated, nor should it be less. Subordinates’ responsibility to superiors is absolute, and superiors can’t escape responsibility for their subordinates’ activities. (S26)'],
  ['9','Flexibility','The structure must be simple to understand and flexible, adaptable to changes in the nature of business, technology and procedures. (S27)'],
  ['10','Functional definition','Every position and every department must have a clear definition of the results expected, activities to be undertaken and authority delegated. (S28)']], cap:'M3·S18–28'},
 {t:'mnemo', title:'three bundles of Urwick', h:`<b>Aim (1–2):</b> unity of objectives, organizational efficiency.<br><b>Shape (3–6):</b> specialization, span of management, scalar chain, unity of command.<br><b>Authority & adaptability (7–10):</b> delegation, parity of authority and responsibility, flexibility, functional definition.`},
 {t:'confuse', title:'Urwick vs Fayol', h:`Both lists contain <b>scalar chain</b> and <b>unity of command</b>. Only Fayol has <b>unity of direction</b>, equity, order, discipline, initiative, remuneration, tenure, esprit de corps, subordination of interest and centralization. Only Urwick has unity of objectives, organizational efficiency, span of management, delegation, parity, flexibility and functional definition. Fayol’s “division of labour” stresses specialization (M1·S34); Urwick names it the principle of specialization.`},
 {t:'check', id:'c-m3t5-1', kind:'match', topic:'m3t5', q:'Match the example to Urwick’s principle.', pairs:[['Bank staff are cross-trained to handle branch and digital banking when needed','Flexibility'],['Assistant branch managers may approve loans within limits when the manager is away','Delegation'],['Every position has clear results expected, activities and authority','Functional definition'],['Work divided by qualifications, abilities and skills','Specialization'],['Responsibility is neither more nor less than the authority given','Parity of authority and responsibility']], why:'M3·S21, S25–28.'},
 {t:'check', id:'c-m3t5-2', kind:'mcq', topic:'m3t5', q:'Which principle is NOT one of Urwick’s ten?', o:['Scalar chain','Unity of command','Unity of direction','Parity of authority and responsibility'], a:2, why:'Unity of direction is Fayol’s principle 4 (M1·S37); it is not on M3·S18.'}
 ]},
/* T6 */
{id:'m3t6', title:'Departmentation: meaning and eight patterns', slides:'M3·S29–46', density:'High',
 why:'A “identify and draw the departmentation” question appears in all 7 papers (2–3 marks): functional, product and matrix so far.',
 from:'Urwick’s principles tell you how a structure should behave.',
 to:'That completes the supplied Chapter 3 slides. Next: the module recap and PYQ practice.',
 blocks:[
 {t:'start', h:`First split the whole work into jobs so nothing is left out; then group similar jobs into units and decide how the units relate. That grouping is <b>departmentation</b>. There are eight ways to group.`},
 {t:'table', head:['First step in designing a structure','Next step'], rows:[['Divide the whole work into a number of jobs, to ensure that no important activity is left out','Bring together homogeneous jobs into groups and decide their relation to each other — <b>this process is known as departmentation</b>. It involves many decisions concerning a logical division of work and leads to the establishment of a number of manageable units.']], cap:'M3·S30'},
 {t:'steps', items:[['By simple numbers',''],['By time',''],['By enterprise functions',''],['By territory / geography',''],['By product',''],['By process / equipment',''],['By customer',''],['Matrix','']], cap:'Patterns of departmentation · M3·S31'},
 {t:'mnemo', title:'the question each pattern answers', h:`Group people by <b>how many</b> (numbers), <b>when</b> (time), <b>what job</b> (function), <b>where</b> (territory), <b>what is sold</b> (product), <b>which stage of work</b> (process), <b>who buys</b> (customer) — or <b>function × project</b> at once (matrix).`},
 {t:'h', h:'1 · By numbers'},
 {t:'list', items:['A structural departmentation: grouping all persons who perform the same duties and functions under the supervision of a manager.','An age-old method, rapidly falling into disuse, because technology is advancing fast and demands more specialized, different skills, and groups of specialized personnel are more efficient than groups based merely on numbers.','Useful only at the lowest level of the organization structure. (M3·S32–33)']},
 {t:'h', h:'2 · By time'},
 {t:'p', h:`The oldest form of structuring; suitable for the lower level; groups activities on the basis of time. Shifts are common because normal workloads become insufficient and ineffective — e.g. hospitals, production facilities. <span class="chip ref">M3·S34</span>`},
 {t:'table', head:['Advantages','Limitations'], rows:[['Services offered 24×7 instead of an 8-hour shift','Supervising during the night shift becomes difficult'],['A process needing a continuous cycle need not be interrupted','Fatigue: most employees find it hard to change their biological clock'],['Expensive capital equipment can be used more than 8 hrs/day','Several shifts may cause coordination and communication problems'],['Students attending classes by day can work night shifts to sustain their living','Overtime pay can increase the cost of production or services']], cap:'M3·S35'},
 {t:'h', h:'3 · By function'},
 {t:'p', h:`The <b>most widely used</b> form. Groups activities by function — the jobs to be done. Consistent with specialization and division of work: alike or similar activities are placed together in one department under a single chain of command. It also <b>facilitates coordination</b>, since a supervisor is in charge of one major area — easier than having the same functions in different departments under different supervisors. <span class="chip ref">M3·S36–37</span>`},
 {t:'tree', root:{l:'President',c:[{l:'Marketing',cls:'l1',items:['Research','Marketing planning','Advertising and promotion','Sales administration','Sales']},{l:'Engineering',cls:'l1',items:['Engineering administration','Preliminary design','Electrical engineering','Mechanical engineering','Packaging','Quality']},{l:'Finance',cls:'l1',items:['Financial planning','Budgets','General accounting','Cost accounting','Statistics and data processing']},{l:'Production',cls:'l1',items:['Production planning','Industrial engineering','Production engineering','Purchasing','Tooling','General production']}]}, cap:'Functional chart on M3·S36 (the president also has an assistant to president and personnel as staff boxes)'},
 {t:'table', head:['Strengths','Weaknesses'], rows:[['Allows economies of scale within functional departments','Slow response time to environmental changes'],['Enables in-depth knowledge and skill development','May cause decisions to pile on top, hierarchy overload'],['Enables the organization to accomplish functional goals','Leads to poor horizontal coordination among departments'],['Is best with only one or a few products','Results in less innovation'],['','Involves a restricted view of organizational goals']], cap:'M3·S38'},
 {t:'h', h:'4 · By territory / geography'},
 {t:'p', h:`Groups activities on the basis of territory. If customers are geographically dispersed, jobs can be grouped by geography — e.g. Coca-Cola’s North American sector and international sector (Pacific Rim, Europe, Africa and Latin America groups). <span class="chip ref">M3·S39</span>`},
 {t:'table', head:['Advantages','Limitations'], rows:[['Places responsibility at the lower levels','Requires more persons with general-manager abilities'],['Places emphasis on local markets and local problems','Makes maintenance of economic central services difficult'],['Improves coordination in a region','Increases the problem of top-management control'],['Takes advantage of economies of local operation',''],['Better face-to-face communication with local interests',''],['Furnishes a measurable training ground for general managers','']], cap:'M3·S40'},
 {t:'h', h:'5 · By process / equipment'},
 {t:'tree', root:{l:'Plant superintendent',c:[{l:'Sawing dept manager'},{l:'Planing & milling dept manager'},{l:'Assembling dept manager'},{l:'Lacquering & sanding dept manager'},{l:'Finishing dept manager'},{l:'Inspection & shipping dept manager'}]}, cap:'M3·S41: + more efficient flow of work activities; − can only be used with certain types of products'},
 {t:'h', h:'6 · By customer'},
 {t:'p', h:`Groups activities on the basis of common customers or types of customers, assuming customers in each department have a common set of problems and needs best met by specialists. Chart: departments for foreign, domestic, wholesale and retail customers. <span class="chip ref">M3·S42</span>`},
 {t:'h', h:'7 · By product / service'},
 {t:'p', h:`Product departmentation is also a useful guide for grouping activities in service businesses. E.g. a food product company may divide operations into frozen food, dairy products and produce departments. Chart: two-wheeler, three-wheeler, four-wheeler and heavy motors departments. <span class="chip ref">M3·S43</span>`},
 {t:'h', h:'8 · Matrix'},
 {t:'p', h:`A matrix structure superimposes a <b>horizontal set of divisional reporting relationships onto a hierarchical functional structure</b>. Its essence is the <b>combination of functional and product or project patterns</b> in the same organization structure. A matrix organization has a <b>complicated structure</b> in which reporting relationships are set up as a grid instead of the traditional vertical hierarchy. <span class="chip ref">M3·S44–45</span>`},
 {t:'html', h:`<div class="tablewrap"><table><thead><tr><th></th><th>HR</th><th>Finance</th><th>IT</th><th>Marketing</th><th>Operations</th></tr></thead><tbody><tr><th scope="row">Project A</th><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td></tr><tr><th scope="row">Project B</th><td>●</td><td>●</td><td></td><td></td><td>●</td></tr><tr><th scope="row">Project C</th><td></td><td>●</td><td>●</td><td></td><td>●</td></tr></tbody></table></div><div class="cap">Matrix grid on M3·S45: each project draws only the functions it needs.</div>`},
 {t:'confuse', title:'matrix and unity of command (cross-module link)', h:`In a matrix, a person answers to a functional head and a project head at once. Fayol warned that dual subordination “undermines authority, weakens discipline, divides loyalty, creates confusion” (M1·S36). Use this link, labelled as your own reasoning, when a question asks for a drawback of matrix structure; the slide itself states only that the structure is “complicated”.`},
 {t:'p', h:`<b>Identify the departmentation (M3·S46):</b> a general manager (sales) with regional managers for North, South, West and East India → <b>geographical</b>; a president with VPs for soaps, detergents and cosmetics → <b>product</b>; a plant head with AGMs for machine shop, foundry, final assembly line, engine assembly and paint shop → <b>process</b>.`},
 {t:'remember', h:`Picking the pattern from a case: departments named after <b>jobs</b> (production, marketing, finance) → functional; after <b>things sold</b> → product; after <b>regions</b> → geographic; after <b>stages of work</b> → process; after <b>buyer types</b> → customer; <b>projects cutting across functions</b> → matrix.`},
 {t:'check', id:'c-m3t6-1', kind:'classify', topic:'m3t6', q:'Identify the departmentation.', cats:['Functional','Territory','Product','Process','Customer','Matrix'], items:[['VPs for Soaps, Detergents and Cosmetics',2],['Regional managers for North, South, West and East India',1],['AGMs for machine shop, foundry, engine assembly, paint shop',3],['Departments for foreign, domestic, wholesale and retail buyers',4],['Project teams drawing staff from Design, Production, Finance and Marketing',5],['Marketing, Engineering, Finance and Production departments',0]], why:'M3·S36–46.'},
 {t:'check', id:'c-m3t6-2', kind:'mcq', topic:'m3t6', q:'“Allows economies of scale within departments but may cause decisions to pile on top — hierarchy overload.” Which departmentation?', o:['Geographic','Functional','Customer','Time'], a:1, why:'Both phrases are on the strengths/weaknesses slide for functional departmentation (M3·S38).'},
 {t:'check', id:'c-m3t6-3', kind:'reveal', topic:'m3t6', q:'Why is departmentation by numbers falling into disuse?', a:'Technology is advancing very fast, demanding more specialized and different skills; and groups of specialized personnel are more efficient than groups based merely on numbers. It is useful only at the lowest level (M3·S33).'}
 ]}
],

cards:[
 {id:'f3-1',k:'term',t:'m3t1',f:'Organization (Chapter 3 definition)',b:'A collection of people involved in pursuing defined objectives; it encompasses division of work among employees and alignment of tasks towards the company’s ultimate goal; the second most important managerial function.',r:'M3·S4'},
 {id:'f3-2',k:'qa',t:'m3t1',f:'Three things a role must incorporate',b:'Verifiable objectives; a clear idea of the major duties and activities; an understood area of discretion or authority.',r:'M3·S6'},
 {id:'f3-3',k:'qa',t:'m3t1',f:'Four reasons organizations are important',b:'Any four of: bring together resources; produce goods and services efficiently; facilitate innovation; use modern technologies; adapt to and influence change; create value for owners, customers, employees; accommodate diversity and ethics challenges; motivate and coordinate employees.',r:'M3·S5'},
 {id:'f3-4',k:'process',t:'m3t2',f:'Four steps in the organizing process',b:'Identification of activities → organizing the activities → classification of the authority → building the relationship between authority and responsibility.',r:'M3·S7'},
 {id:'f3-5',k:'compare',t:'m3t3',f:'Formal vs informal organization (5 differences)',b:'Designed by top management vs comes up on its own; planned vs spontaneous; fixed, defined authority vs authority by personal acceptance; requires an office vs functions through people; rigid with a written constitution vs flexible without one.',r:'M3·S12'},
 {id:'f3-6',k:'confusion',t:'m3t3',f:'True or false: “Formal organization is an arbitrary set-up in which each person is responsible for his performance.”',b:'<b>True</b> — that is the slide’s own wording for formal organization.',r:'M3·S9'},
 {id:'f3-7',k:'term',t:'m3t4',f:'Span of control',b:'The number of subordinates who report directly to an executive or supervisor; differences in span shape the organization (narrow → tall, wide → flat).',r:'M3·S13–14'},
 {id:'f3-8',k:'qa',t:'m3t4',f:'What makes a span “optimal”?',b:'Narrow enough for managers to maintain control over subordinates; wide enough that micromanaging (interfering) is minimized.',r:'M3·S14'},
 {id:'f3-9',k:'process',t:'m3t4',f:'Eight factors affecting span of control',b:'Subordinates’ training; delegation of authority; planning; rate of change; communication techniques; kind of activity; kind of organization; organization level.',r:'M3·S15'},
 {id:'f3-10',k:'compare',t:'m3t4',f:'Wide span: three pros and three cons',b:'Pros: quick decision making, reduced bureaucracy, development of lower level (also easy coordination). Cons: manager under pressure, chaos in large team, chance of overlooking issues.',r:'M3·S16'},
 {id:'f3-11',k:'compare',t:'m3t4',f:'Narrow span: three pros and three cons',b:'Pros: personal contact with employees, small organized team structure, benefit of specialization. Cons: high manager salaries, communication becomes difficult, more bureaucracy.',r:'M3·S16'},
 {id:'f3-12',k:'confusion',t:'m3t4',f:'Repetitive, standardized, automated work — wide or narrow span?',b:'Wide can be afforded: “kind of activity” is a listed factor, and such work needs less control (inference from M3·S14–15; the slides don’t state the direction).',r:'M3·S14–15'},
 {id:'f3-13',k:'process',t:'m3t5',f:'Urwick’s ten principles',b:'Unity of objectives; organizational efficiency; specialization; span of management; scalar chain; unity of command; delegation; parity of authority and responsibility; flexibility; functional definition.',r:'M3·S18'},
 {id:'f3-14',k:'term',t:'m3t5',f:'Principle of parity of authority and responsibility',b:'Responsibility for actions cannot be greater than that implied by the authority delegated, nor less; subordinates’ responsibility is absolute and superiors can’t escape responsibility for subordinates’ activities.',r:'M3·S26'},
 {id:'f3-15',k:'term',t:'m3t5',f:'Principle of delegation (Urwick)',b:'Authority must be delegated as far down as possible; adequate authority should be delegated so people accomplish the results expected.',r:'M3·S25'},
 {id:'f3-16',k:'term',t:'m3t5',f:'Principle of flexibility',b:'The structure must be simple to understand and flexible — adaptable to changes in business, technology and procedures.',r:'M3·S27'},
 {id:'f3-17',k:'confusion',t:'m3t5',f:'Is “unity of direction” an Urwick principle?',b:'<b>No</b> — it is Fayol’s. Urwick and Fayol share scalar chain and unity of command.',r:'M1·S37; M3·S18'},
 {id:'f3-18',k:'term',t:'m3t5',f:'Principle of unity of objectives',b:'A structure is effective if it enables individuals to contribute to enterprise objectives; without a common aim, departments set their own, possibly conflicting, goals.',r:'M3·S19'},
 {id:'f3-19',k:'term',t:'m3t6',f:'Departmentation',b:'After dividing the whole work into jobs (so no important activity is left out), bringing together homogeneous jobs into groups and deciding their relation to each other; creates manageable units.',r:'M3·S30'},
 {id:'f3-20',k:'process',t:'m3t6',f:'Eight patterns of departmentation',b:'Simple numbers; time; enterprise functions; territory/geography; product; process/equipment; customer; matrix.',r:'M3·S31'},
 {id:'f3-21',k:'compare',t:'m3t6',f:'Functional departmentation: strengths vs weaknesses',b:'Strengths: economies of scale, in-depth skills, functional goals, best with one or few products. Weaknesses: slow response to change, decisions pile on top, poor horizontal coordination, less innovation, restricted view of goals.',r:'M3·S38'},
 {id:'f3-22',k:'compare',t:'m3t6',f:'Departmentation by time: two advantages, two limitations',b:'Advantages: 24×7 service; continuous processes; equipment used more than 8 hrs; students can work nights. Limitations: night supervision difficult; fatigue; coordination problems across shifts; overtime cost.',r:'M3·S35'},
 {id:'f3-23',k:'compare',t:'m3t6',f:'Territory departmentation: advantages vs limitations',b:'Advantages: responsibility at lower levels, focus on local markets, regional coordination, local economies, face-to-face communication, training ground for GMs. Limitations: needs more GM-calibre people, central services harder, top-management control harder.',r:'M3·S40'},
 {id:'f3-24',k:'term',t:'m3t6',f:'Matrix departmentation',b:'Superimposes horizontal divisional (project/product) reporting onto a hierarchical functional structure; a complicated grid instead of a vertical hierarchy.',r:'M3·S44–45'},
 {id:'f3-25',k:'qa',t:'m3t6',f:'Process departmentation: the plus and the minus',b:'+ More efficient flow of work activities. − Can only be used with certain types of products.',r:'M3·S41'},
 {id:'f3-26',k:'confusion',t:'m3t6',f:'VPs for Soaps, Detergents and Cosmetics — process or product departmentation?',b:'<b>Product</b>. Process departments are stages of work (machine shop, foundry, paint shop).',r:'M3·S46'},
 {id:'f3-27',k:'pyq',t:'m3t6',f:'PYQ trigger: “Identify the departmentation and draw the organization structure” (2–3 marks)',b:'<ol><li>Name the pattern and the phrase in the case that shows it.</li><li>Draw the chart: head → department boxes → named sub-units (or a function × project grid for matrix).</li><li>Add one strength or weakness from the slide if marks allow.</li></ol>',r:'M3·S36–46'},
 {id:'f3-28',k:'pyq',t:'m3t4',f:'PYQ trigger: “Identify three pros and cons each for wide and narrow spans” (3 marks)',b:'Two-column table from M3·S16: wide pros (quick decisions, less bureaucracy, lower-level development), wide cons (pressure, chaos, overlooked issues), narrow pros (personal contact, organized team, specialization), narrow cons (high salaries, poor communication, bureaucracy).',r:'M3·S16'}
]

EOM.patterns = {
fayol:{type:'Case: quote & identify',
 asks:'Find the lines in the case that show Fayol’s principles, name each principle, and explain it briefly in Fayol’s terms.',
 cmd:[['Quote','Copy the exact words from the case inside inverted commas — the marks depend on showing the evidence.'],['Identify','Name the principle exactly as Fayol’s list does (e.g. “Unity of command”, not “one boss rule”).'],['Explain','One or two sentences on what the principle means, using the slide definition, linked back to the quoted line.']],
 concepts:['Exact names of Fayol’s 14 principles (M1·S33)','The slide definition of each principle you name','The difference between look-alike principles (unity of command vs direction; scalar chain vs unity of command)'],
 plan:['Read the case once and underline every sentence describing how people are organized, paid, treated or directed.','Match each underlined line to one principle; keep the three (or four) clearest matches.','For each: quote → principle name → slide definition → how the line shows it.','Keep each principle as a separate numbered point.'],
 struct:'Three numbered points (four if asked), each worth about 1 mark: “Quoted line” → Principle → 1–2 line explanation. No introduction needed.',
 mis:['Naming the principle without quoting the line.','Writing Urwick’s principles (e.g. “principle of specialization”) instead of Fayol’s.','Calling a single reporting line “scalar chain” (it is unity of command).','Quoting a whole paragraph instead of the one line that shows the principle.'],
 tip:'Put the quotation first. An examiner scanning for evidence finds it immediately, and each point reads as a complete one-mark unit.'},

 cmd:[['Quote','Copy the case line that shows the behaviour.'],['Identify','Name both the main role (interpersonal / informational / decisional) and the sub-role.'],['Explain','Give the slide’s reason in one line (e.g. spokesman sends information to people outside the unit).']],

{id:'p1q11',p:'P1',n:'11',m:4,k:'desc',topic:'m2t11',pat:'bcgcase',cw:['Develop'],
 q:'Hassan is one of the leading detergent manufacturing companies with a wide product portfolio. As a newly recruited management trainee, develop the strategic options that are available to Hassan in accordance with the BCG Matrix for the below products.\nProduct#1: A versatile cleaning product that combines detergent with surface cleaners. Despite its innovative concept, it has not gained much traction in the market.\nProduct#2: A premium laundry detergent that has captured significant market share. Strong sales growth due to rising disposable incomes and growing urbanization.\nProduct#3: Innovative single-use detergent pods targeting younger consumers. The market is growing fast, but the brand has not yet gained significant market share.\nProduct#4: A reliable liquid detergent with a loyal customer base. Market growth is slow, but it continues to maintain a dominant position.',
 cmd:[['Develop','Work out, for each product, the quadrant and the strategic option that follows from it.'],['In accordance with the BCG Matrix','Use growth rate and relative market share, and the BCG strategies (build, hold, harvest, divest).']],
 ans:`<p>The BCG matrix classifies SBUs by <b>market growth rate</b> and <b>relative market share</b> (M2·S87) and suggests four strategies: build/grow, hold/maintain, harvest, divest (M2·S101).</p>
<ol><li><b>Product #2 — Star</b> (high growth, high share: “captured significant market share… strong sales growth”). Strategy: <b>build/hold</b> — stars “should continue to receive substantial investment funding” and must hold their growth or they turn into cash cows (M2·S93, S96).</li>
<li><b>Product #3 — Question mark</b> (high growth, low share: “market is growing fast… not yet gained significant market share”). Strategy: <b>build</b> — invest “to enhance their competitive positions”; if enough investment to reach dominance isn’t possible, disinvest (M2·S96–97).</li>
<li><b>Product #4 — Cash cow</b> (low growth, high share: “market growth is slow… dominant position”). Strategy: <b>hold/harvest</b> — extract profits “by investing as little cash as possible” and use its cash to fund stars and question marks (M2·S94, S96).</li>
<li><b>Product #1 — Dog</b> (low share: “has not gained much traction”; no sign of a fast-growing market). Strategy: <b>divest</b> — dogs are cash traps with limited potential; “most analysts recommend that they be divested” (M2·S95–96).</li></ol>
<p>Overall, Hassan should use cash from Product #4 to fund Products #2 and #3 and exit Product #1, avoiding the “one-size-fits-all” mistake the slides warn about (M2·S97).</p>`,
 dia:{t:'quad',y:'Market growth rate',x:'Relative market share',xl:['Low','High'],cells:[['Question mark','#3 Detergent pods → build'],['Star','#2 Premium laundry detergent → build/hold'],['Dog','#1 Detergent + surface cleaner → divest'],['Cash cow','#4 Liquid detergent → hold/harvest']]},
 keys:['Labelled BCG grid (growth vs relative share)','#2 as Star with build/hold and reason','#3 as Question mark with build (or divest) and reason','#4 as Cash cow with hold/harvest and reason','#1 as Dog with divest and reason','Cash from cow funds star/question mark'],
 refs:'M2·S87;M2·S93–97;M2·S101',sup:'full',supNote:'Product #1’s market growth is not stated; it is placed as a dog because its share is low and nothing indicates a fast-growing market. If its market were growing fast it would be a question mark.'},
{id:'p1q12',p:'P1',n:'12',m:3,k:'desc',topic:'m1t5',pat:'fayol',cw:['Quote','Identify','Explain'],
 q:'By quoting the lines from the case-study, Identify and Explain the three HENRI FAYOL’S Principles incorporated: Infosys Technologies, a leading Indian multinational corporation in the IT services sector has effectively implemented specific roles to employees based on their expertise, which ensures efficiency and specialization in its project management and software development processes. This clear division enables employees to focus on their areas of strength, thereby enhancing productivity and project outcomes. The company also places strong emphasis on maintaining a clear and unified strategic plan across all its global operations. This consistency in direction allows Infosys to align its various departments and international branches towards common corporate goals, thereby achieving cohesive growth and stability. The company ensures that its compensation structure is competitive, reflecting the employees’ skills, experience, and contributions. This approach fosters a sense of motivatation in employees and also contributes to higher retention rates and job satisfaction. Through these practices, it leads to sustained success and a strong reputation in the global IT industry.',
 ans:`<ol><li><b>“implemented specific roles to employees based on their expertise, which ensures efficiency and specialization”</b> → <b>Division of labour</b>. Work is divided and allotted according to expertise; specialization leads to efficiency, speed and accuracy (M1·S34).</li>
<li><b>“a clear and unified strategic plan across all its global operations… align its various departments… towards common corporate goals”</b> → <b>Unity of direction</b>. One head, one plan for activities with similar objectives; efforts directed towards a common goal (M1·S37).</li>
<li><b>“compensation structure is competitive, reflecting the employees’ skills, experience, and contributions”</b> → <b>Fair remuneration</b>. Remuneration should be fair, reasonable, satisfactory and rewarding of effort, satisfying both employer and employees (M1·S44).</li></ol>
<p class="small">The line on “higher retention rates” also touches stability of tenure (M1·S45), but it is an outcome of the pay policy rather than a separate practice.</p>`,
 keys:['Quote + Division of labour + expertise/specialization → efficiency','Quote + Unity of direction + one plan, common goal','Quote + Fair remuneration + fair, rewarding of effort','Each principle named exactly as Fayol’s list'],
 refs:'M1·S34;M1·S37;M1·S44',sup:'full'},
{id:'p1q13',p:'P1',n:'13',m:3,k:'desc',topic:'m1t6',pat:'mintz',cw:['Quote','Identify','Explain','Mention'],
 q:'By quoting the lines from the case-study, Identify and Explain the three Managerial Roles as defined by Henry Mintzberg: Sneha, CEO of Quantum Solutions, had led her tech startup from a small team to a mid-sized enterprise with over 500 employees in five years. She relied on daily departmental briefings to stay informed, which helped drive the company’s rapid growth. She was frequently invited as the Guest of Honor to various events in Silicon Valley, solidifying Quantum’s reputation in AI innovation. Sneha took tough financial decisions, working with her CFO to balance investments in an autonomous driving project while ensuring the stability of existing product lines. Mention the Main Role and Sub Role for each scenario.',
 ans:`<div class="tablewrap"><table><thead><tr><th>Quoted line</th><th>Main role</th><th>Sub-role and reason</th></tr></thead><tbody>
<tr><td>“relied on daily departmental briefings to stay informed”</td><td>Informational</td><td><b>Monitor</b> — continuously scans the environment and interrogates subordinates for information (M1·S61)</td></tr>
<tr><td>“frequently invited as the Guest of Honor to various events”</td><td>Interpersonal</td><td><b>Figurehead</b> — ceremonial duties by virtue of being head of the unit (M1·S57)</td></tr>
<tr><td>“took tough financial decisions… balance investments in an autonomous driving project while ensuring the stability of existing product lines”</td><td>Decisional</td><td><b>Resource allocator</b> — decides who will receive what in the unit and authorizes important decisions (M1·S67)</td></tr></tbody></table></div>`,
 keys:['Monitor (informational) with quote','Figurehead (interpersonal) with quote','Resource allocator (decisional) with quote','Main role stated for each'],
 refs:'M1·S54;M1·S57;M1·S61;M1·S67',sup:'full'},
{id:'p1q14',p:'P1',n:'14',m:3,k:'desc',topic:'m1t7',pat:'csr',cw:['What','Explain'],
 q:'What is the significance of social responsibility to a corporate? Do you think business organisations should be socially responsible? Explain with an example.',
 asks:'Explain why CSR matters to a company, take a position on whether businesses should be socially responsible, and support it with an example.',
 cmd:[['What is the significance','State what CSR is and why it matters to the company itself.'],['Do you think','Take a clear position and justify it with slide arguments.'],['Explain with an example','Name a real company practice.']],
 ans:`<h5>Meaning</h5><p>CSR is a firm’s intention, beyond its legal and economic obligations, to do the right things and act in ways that are good for society (M1·S72); the corporate initiative to assess and take responsibility for its effects on the environment and social welfare (M1·S74).</p>
<h5>Significance to a corporate</h5><ul><li>Society expects organizations and managers to be responsible and ethical (M1·S70).</li><li>Builds goodwill and trust in the minds of customers and shareholders — which takes decades (M1·S76) — and strengthens brand equity (M1·S75).</li><li>Increased employee satisfaction → competence → superior service and customer satisfaction (M1·S76).</li><li>An ethically responsible culture reduces unfair practices through professionalism and transparency (M1·S76).</li></ul>
<h5>Should businesses be socially responsible?</h5><p>Yes, on the <b>socioeconomic</b> view: management’s responsibility goes beyond profits to protecting and improving society’s welfare (M1·S71). The <b>classical</b> view (only maximize profits) and the short-term costs CSR can involve (M1·S74) are the counter-arguments, but the long-term benefits above outweigh them.</p>
<h5>Example</h5><p><b>Hindustan Unilever’s Project Shakti</b> (2001) provided rural India with basic hygiene and sanitation products through direct selling; it increased sales and brought safe drinking water and sanitation products to communities that needed them most (M2·S59).</p>`,
 keys:['CSR definition (beyond legal and economic obligations)','At least two significance points (expectation, goodwill/trust, employees, ethical culture)','Clear stand using socioeconomic vs classical view','A named company example linked to social benefit'],
 refs:'M1·S70–76;M2·S59',sup:'full',supNote:'The example comes from the Blue Ocean applications slide (M2·S59); the CSR slides themselves give no company example.'},
{id:'p1q15',p:'P1',n:'15',m:3,k:'desc',topic:'m2t9',type:'Comparison',cw:['Demonstrate','Highlight'],

 plan:['Draw a 4-row table from M2·S58.','Define blue ocean creation: value innovation = differentiation + low cost; uncontested space.','Show the Four Actions (ERRC).','Give an example from the slides.'],
 ans:`<div class="tablewrap"><table><thead><tr><th>Red ocean strategy</th><th>Blue ocean strategy</th></tr></thead><tbody><tr><td>Compete in existing market space</td><td>Create uncontested market space</td></tr><tr><td>Beat the competition</td><td>Make the competition irrelevant</td></tr><tr><td>Exploit existing demand</td><td>Create and capture new demand</td></tr><tr><td>Make the value-cost trade-off; align activities with differentiation <i>or</i> low cost</td><td>Break the value-cost trade-off; pursue differentiation <i>and</i> low cost</td></tr></tbody></table></div>
<h5>Creating a blue ocean</h5><p>Through <b>value innovation</b> — delivering superior value through differentiation and low cost at once, redefining industry boundaries so competition becomes irrelevant (M2·S55). The <b>Four Actions Framework</b> does this: <b>eliminate</b> factors the industry competes on, <b>reduce</b> some below standard, <b>raise</b> key factors above standard, and <b>create</b> new ones (M2·S62).</p>
<h5>Example</h5><p><b>PayTm</b> created a new market in India by making payment via mobile phone convenient and accessible, when digital and mobile payments were fairly non-existent or ill-adopted (M2·S60). In the slides’ gaming-console example, the framework eliminates graphics quality and games available, reduces price, raises family games and motion control, and creates a marketplace and online games (M2·S64).</p>`,
 struct:'A four-row table (about 2 marks) plus a short paragraph on value innovation/ERRC with one example (about 1 mark).',
 keys:['Four correct red vs blue rows','Value innovation (differentiation + low cost)','Four Actions / uncontested market space','A slide example (PayTm, Flipkart, HUL, Airtel or consoles)'],
 mis:['Giving vague differences (“blue is better”) instead of the slide’s paired rows.','An example that is only a new product in an existing market.'],
 tip:'The five rows on M2·S58 are paired opposites; write them as a table and you have the four differences in under a minute.',
 refs:'M2·S55;M2·S58;M2·S60;M2·S62–64',sup:'full'},
{id:'p1q16',p:'P1',n:'16',m:3,k:'desc',topic:'m3t4',type:'Case: quote & identify',cw:['Explain'],
 q:'A manager oversees a team of 5 employees and spends a significant amount of time on direct supervision, giving feedback, and handling individual concerns. Another manager, in the same organization, supervises 15 employees but delegates most tasks and decisions. Explain three factors that could influence the span of control which is being mentioned in this passage.',
 asks:'Name three of the factors that determine span of control and show how each explains why one manager has 5 people and the other 15.',
 cmd:[['Explain three factors','Name each factor (from the list of eight) and link it to the passage.']],
 concepts:['Span of control definition (M3·S14)','Eight factors (M3·S15)','Narrow vs wide span features (M3·S16)'],
 plan:['Define span of control.','Identify: manager A = narrow span (5), manager B = wide span (15).','Pick three factors from M3·S15 visible in the passage and explain each.'],
 ans:`<p><b>Span of control</b> is the number of subordinates who report directly to an executive or supervisor (M3·S14). The first manager has a <b>narrow span</b> (5), the second a <b>wide span</b> (15).</p>
<ol><li><b>Delegation of authority</b> — “delegates most tasks and decisions”: when authority is delegated, subordinates handle work themselves, so one manager can oversee more people (15). The first manager keeps work with himself through direct supervision, which limits him to 5.</li>
<li><b>Communication techniques</b> — “spends a significant amount of time on… giving feedback”: when communication happens through constant one-to-one feedback, each subordinate takes more of the manager’s time, narrowing the span.</li>
<li><b>Subordinates’ training</b> — “direct supervision… handling individual concerns”: subordinates who need close guidance keep the span narrow; the benefit is personal contact with employees, a narrow-span advantage (M3·S16).</li></ol>
<p>The optimal span must be narrow enough to maintain control yet wide enough to avoid micromanaging (M3·S14).</p>`,
 struct:'One line defining span, then three numbered factors, each with a quoted phrase and a one-line effect.',
 keys:['Definition of span of control','Delegation of authority linked to “delegates most tasks”','A second factor (communication techniques / feedback) linked to the passage','A third factor (subordinates’ training / kind of activity) linked to the passage','Narrow vs wide identified'],
 mis:['Listing all eight factors without linking any to the passage.','Stating the pros/cons of spans instead of the factors.'],
 tip:'Quote a phrase from the passage for each factor — the question says “being mentioned in this passage”.',
 refs:'M3·S14–16',sup:'partial',supNote:'The eight factor names are on M3·S15; the slides do not say which way each factor pushes the span. The direction in this answer is reasoning from M3·S14 (narrow enough to keep control, wide enough to avoid micromanaging).'},
{id:'p1q17',p:'P1',n:'17',m:2,k:'desc',topic:'m1t8',type:'Explanation',cw:['Describe'],
 q:'Describe two ways in which managers fulfil their responsibility to create an organizational environment that fosters ethical decision-making?',
 asks:'Describe two of the three ways the slides give for institutionalizing ethics.',
 cmd:[['Describe two ways','Name each way and add a line on what it involves.']],
 concepts:['Institutionalizing ethics — three ways (M1·S87)'],
 plan:['One line on managers’ responsibility (institutionalizing ethics).','Way 1 with explanation.','Way 2 with explanation.'],
 ans:`<p>Managers, especially top managers, create such an environment by <b>institutionalizing ethics</b> — applying and integrating ethical concepts with daily actions (M1·S87):</p><ol><li><b>Establishing an appropriate company policy or a code of ethics</b>, so that expected ethical conduct is written down and guides every decision.</li><li><b>Using a formally appointed ethics committee</b>, which oversees ethical issues and decisions in the organization.</li></ol><p class="small">A third way the slide lists: teaching ethics in management development programs.</p>`,
 struct:'Two numbered ways, one mark each, with a one-line opening sentence.',
 keys:['Institutionalizing ethics named','Code of ethics / company policy','Ethics committee (or teaching ethics in MDPs)'],
 mis:['Writing the three moral theories instead of the three ways.'],
 tip:'The slide gives exactly three ways — memorize them as Code, Committee, Classroom.',
 refs:'M1·S87',sup:'full'},
{id:'p1q18',p:'P1',n:'18',m:2,k:'desc',topic:'m2t5',type:'Explanation',cw:['Elaborate','Provide'],
 q:'Elaborate on the concept of quantitative objectives from an organizational perceptives? Provide an example of quantitative objective for a company to improve its performance.',
 asks:'Explain what quantitative objectives are (and why they matter), then write one numeric objective a company could adopt.',
 cmd:[['Elaborate','Define and expand, including why they are useful.'],['Provide an example','Write one objective with a number and a deadline.']],
 concepts:['Objectives definition (M2·S11)','Quantitative vs qualitative (M2·S31)','Verifiable objectives (M2·S11, S40)'],
 plan:['Define objectives.','Define quantitative objectives with their features.','Contrast briefly with qualitative.','Give a verifiable example.'],
 ans:`<p><b>Objectives</b> are the important ends toward which organizational and individual activities are directed (M2·S11). <b>Quantitative objectives</b> are straightforward to measure and represented numerically; they are concrete, observable and quantifiable — unlike qualitative objectives, which are hard to measure (M2·S31). Being <b>verifiable</b>, they allow measurement of the effectiveness and efficiency of managerial actions (M2·S11).</p><p><b>Example:</b> “To increase production output by 5% by December 31, without additional costs and while maintaining the current quality level” (M2·S40) — or “increase annual revenue by 10%” (M2·S31).</p>`,
 struct:'Definition and features (1 mark) + one numeric, time-bound example (1 mark).',
 keys:['Definition of objectives or quantitative objectives','Measurable / numerical / concrete features','Verifiable example with a number (and ideally a deadline)'],
 mis:['Giving a qualitative example such as “improve customer satisfaction”.'],
 tip:'Borrow the slide’s verifiable examples — they include a number, a deadline and a condition.',
 refs:'M2·S11;M2·S31;M2·S40',sup:'full'},
{id:'p1q19',p:'P1',n:'19',m:2,k:'desc',topic:'m3t6',pat:'dept',cw:['Draw'],
 q:'Mega Bazaar supermarket operates with the following departments: Production, Marketing, Finance and Personnel along with the subsections namely, Furniture Bazaar, Home Bazaar and Footwear Bazaar. Draw a departmentation structure for Mega Bazaar that would enable the management to pinpoint product-profit responsibility.',
 ans:`<p><b>Product departmentation</b> (M3·S43): the organization is grouped by what it sells — Furniture Bazaar, Home Bazaar and Footwear Bazaar — and each product unit carries its own production, marketing, finance and personnel activities. Because each bazaar is a self-contained unit, its results can be traced to that product line.</p>`,
 dia:{t:'tree',root:{l:'Mega Bazaar — top management',c:[{l:'Furniture Bazaar',cls:'l1',items:['Production','Marketing','Finance','Personnel']},{l:'Home Bazaar',cls:'l1',items:['Production','Marketing','Finance','Personnel']},{l:'Footwear Bazaar',cls:'l1',items:['Production','Marketing','Finance','Personnel']}]}},
 keys:['Product departmentation identified','Chart with the three bazaars as main units','Functions shown under each bazaar'],
 refs:'M3·S43',sup:'partial',supNote:'The slides define product departmentation and show its chart (M3·S43) but do not state “product-profit responsibility” as an advantage; that phrase comes from the question.'}
);

{id:'p2q8',p:'P2',n:'8',m:0.5,k:'mcq',topic:'m2t3',pat:'mpersp',type:'Concept MCQ',cw:['Point out'],

 o:['Both plans have a short-term focus and are primarily concerned with day-to-day operations.','Both plans are static and do not require adjustments over time.','Both strategic and tactical plans are created only by top-level management without involving other levels of the organization.','Both strategic and tactical plans aim to achieve the organization’s overall objectives by guiding decision-making processes.'],

{id:'p2q9',p:'P2',n:'9',m:0.5,k:'mcq',topic:'m3t3',pat:'morg',type:'True/false MCQ',cw:['Identify'],

{id:'p2q11',p:'P2',n:'11',m:4,k:'desc',topic:'m2t10',pat:'swot',cw:['Prepare','Create'],
 q:'Consider the following facts for the company MRF Tyres, prepare a SWOT analysis (create a labelled matrix & enter only statement numbers). Also using TOWS matrix for strategy formulation, create two strategies for MRF Tyres to tackle their weakness.\n1. Company offers a wide variety of tyres for different vehicles, including passenger cars, motorcycles, commercial vehicles, and agricultural equipment.\n2. Compared to some competitors, MRF has been slower to adopt environmentally friendly practices and develop sustainable tyre solutions.\n3. Fluctuations in the prices of natural rubber and other raw materials can impact production costs and profit margins for tyre manufacturers like MRF.\n4. Global economic downturns or local economic slowdowns can adversely affect vehicle sales and, consequently, tyre demand, posing a threat to MRF’s growth prospects.\n5. Increasing consumer awareness and regulatory pressures for eco-friendly products present opportunities for MRF to innovate and develop green tyre solutions.\n6. MRF has an extensive distribution network across India and exports to over 65 countries.\n7. MRF is one of the most recognized and trusted brands in the Indian tyre market, known for its quality and durability.\n8. MRF’s premium pricing strategy may limit its market share in price-sensitive segments, especially in rural areas where cheaper alternatives are available.\n9. Rise of smart and connected vehicles offers MRF the opportunity to develop advanced tyre technologies, such as sensors for real-time monitoring.\n10. Significant growth potential in emerging markets where vehicle ownership is increasing, providing opportunities for MRF to expand its footprint.\n11. Significant portion of MRF’s revenue comes from the Indian market, making it vulnerable to domestic economic fluctuations and market saturation.\n12. Tyre industry is highly competitive, with numerous domestic and international players vying for market share, which can pressure pricing and margins.',
 ans:`<div class="tablewrap"><table><thead><tr><th></th><th>Helpful</th><th>Harmful</th></tr></thead><tbody><tr><th scope="row">Internal</th><td><b>Strengths:</b> 1, 6, 7</td><td><b>Weaknesses:</b> 2, 8, 11</td></tr><tr><th scope="row">External</th><td><b>Opportunities:</b> 5, 9, 10</td><td><b>Threats:</b> 3, 4, 12</td></tr></tbody></table></div>
<h5>Two TOWS strategies to tackle weaknesses</h5>
<ol><li><b>WO (Mini-Maxi), statements 2 + 5:</b> overcome the slow adoption of eco-friendly practices by developing green tyre solutions for the growing consumer and regulatory demand — a developmental strategy that overcomes a weakness to use an opportunity (M2·S77).</li>
<li><b>WO (Mini-Maxi), statements 11 + 10:</b> reduce dependence on the Indian market by expanding into emerging markets where vehicle ownership is rising.</li></ol>
<p class="small">Alternative WT (Mini-Mini), statements 8 + 12: the slide’s WT options are retrenchment, liquidation or a joint venture to minimize both weaknesses and threats (M2·S77) — e.g. a joint venture for a lower-priced range to hold share against competitors in price-sensitive segments.</p>`,
 keys:['Matrix labelled internal/external and helpful/harmful','S = 1, 6, 7','W = 2, 8, 11','O = 5, 9, 10','T = 3, 4, 12','Two strategies named (WO/WT) with statement numbers'],
 refs:'M2·S68–72;M2·S77',sup:'full'},
{id:'p2q12',p:'P2',n:'12',m:3,k:'desc',topic:'m1t5',pat:'fayol',cw:['Quote','Identify','Explain'],
 q:'By quoting the lines from the case-study, Identify and Explain the three HENRI FAYOL’S Principles incorporated: Infosys Technologies, a prominent player in the IT services sector, exemplifies effective management. The company maintains a strong adherence to its policies and procedures. This commitment to discipline not only ensures that employees understand their responsibilities but also establishes a foundation of mutual respect between management and staff, enhancing overall productivity. Moreover, Infosys encourages employees at all levels to take initiative in their work, empowering them to propose innovative solutions and actively participate in decision-making processes. This culture cultivates creativity and accountability, enabling teams to address challenges proactively and contribute to the company\'s success. Additionally, Infosys has a well-defined organizational hierarchy, where the chain of superiors ranging from the ultimate authority to the lowest is clearly defined. This facilitates clear communication and effective decision-making. By ensuring that information flows smoothly from top management to employees, this allows for efficient coordination and specialization in project management and software development.',
 ans:`<ol><li><b>“maintains a strong adherence to its policies and procedures… mutual respect between management and staff”</b> → <b>Discipline</b>: sincerity, obedience, respect of authority and observance of the rules and regulations of the enterprise — required of management as well as subordinates (M1·S42).</li>
<li><b>“encourages employees at all levels to take initiative… propose innovative solutions”</b> → <b>Initiative</b>: eagerness to initiate actions without being asked; management gives employees the opportunity to suggest ideas and new methods, building trust and zeal (M1·S43).</li>
<li><b>“the chain of superiors ranging from the ultimate authority to the lowest is clearly defined”</b> → <b>Scalar chain</b>: Fayol’s own definition; every order, instruction and message passes through it (M1·S46).</li></ol>`,
 keys:['Discipline with quote and definition','Initiative with quote and definition','Scalar chain with quote and definition','Principles named as Fayol names them'],
 refs:'M1·S42–43;M1·S46',sup:'full'},
{id:'p2q13',p:'P2',n:'13',m:3,k:'desc',topic:'m1t6',pat:'mintz',cw:['Quote','Identify','Explain','Mention'],
 q:'By quoting the lines from the case study, Identify and Explain the three Managerial Roles as defined by HENRY MINTZBERG: Sneha, CEO of Quantum Solutions, had led her tech startup from a small team to a mid-sized enterprise with over 500 employees in five years. Sneha actively builds and nurtures relationships with key stakeholders in the tech industry. By attending networking events and industry conferences, she establishes connections with potential partners, clients, and thought leaders. Sneha effectively communicates the vision and achievements of Quantum Solutions to external audiences. She regularly represents the company in media interviews and public forums, articulating its mission and showcasing its cutting-edge projects. Sneha embraces risk-taking and innovation as she drives the company’s growth. She collaborates closely with her executive team to identify new market opportunities and develop cutting-edge solutions. Recently, she made the bold decision to invest in an autonomous driving project, recognizing its potential to revolutionize the transportation sector. Mention the Main Role and Sub Role for each scenario.',
 ans:`<div class="tablewrap"><table><thead><tr><th>Quoted line</th><th>Main role</th><th>Sub-role and reason</th></tr></thead><tbody>
<tr><td>“attending networking events and industry conferences, she establishes connections with potential partners, clients, and thought leaders”</td><td>Interpersonal</td><td><b>Liaison</b> — contacts outside the vertical chain of command, building an external information system (M1·S59)</td></tr>
<tr><td>“communicates the vision and achievements… to external audiences… represents the company in media interviews and public forums”</td><td>Informational</td><td><b>Spokesman</b> — sends information to people outside the unit (M1·S63)</td></tr>
<tr><td>“embraces risk-taking and innovation… bold decision to invest in an autonomous driving project”</td><td>Decisional</td><td><b>Entrepreneurial</b> — voluntary initiator of change; seeks to improve the unit and starts development projects (M1·S65)</td></tr></tbody></table></div>`,
 keys:['Liaison (interpersonal) with quote','Spokesman (informational) with quote','Entrepreneurial (decisional) with quote','Main role given for each'],
 refs:'M1·S59;M1·S63;M1·S65',sup:'full'},
{id:'p2q14',p:'P2',n:'14',m:3,k:'desc',topic:'m1t7',pat:'csr',type:'Comparison',cw:['Discuss'],
 q:'Discuss three arguments each ‘FOR’ & ‘AGAINST’ Corporate Social Responsibility.',
 asks:'Give three reasons businesses should take on social responsibility and three reasons against it.',
 cmd:[['Discuss','Present both sides with a short explanation of each point.'],['Three each','Balance matters: three for and three against.']],
 ans:`<div class="tablewrap"><table><thead><tr><th>For CSR</th><th>Against CSR</th></tr></thead><tbody>
<tr><td>Society expects organizations and managers to be responsible and ethical (M1·S70); the socioeconomic view holds that management must protect and improve society’s welfare (M1·S71).</td><td>The classical (purely economic) view: management’s only social responsibility is to maximize profits (M1·S71).</td></tr>
<tr><td>It builds goodwill and trust with customers and shareholders and adds to brand equity (M1·S75–76).</td><td>CSR can involve short-term costs that give no immediate financial benefit (M1·S74).</td></tr>
<tr><td>Employee satisfaction → competence → superior service and customer satisfaction; an ethical culture reduces unfair practices (M1·S76).</td><td>CSR goes beyond what is required by regulators and beyond legal and economic obligations (M1·S72, S74) — a business that obeys the law has, on the classical view, already met its duty.</td></tr></tbody></table></div>`,
 keys:['Three FOR points with explanation','Three AGAINST points with explanation','Classical vs socioeconomic view used'],
 mis:['Writing only arguments for CSR.','Listing drivers of CSR without turning them into arguments.'],
 tip:'Frame the two columns as the socioeconomic view vs the classical view — the slides’ own two positions.',
 refs:'M1·S70–76',sup:'partial',supNote:'The slides have no ready-made for/against list. The “for” side is well supported (S70–S76); the “against” side rests on the classical view (S71) and on CSR costing money and going beyond legal duty (S72, S74). The third “against” point is an argument built from the definition, not a slide statement.'},
{id:'p2q15',p:'P2',n:'15',m:3,k:'desc',topic:'m2t11',type:'Explanation with examples',cw:['Explain'],
 q:'Explain the use of BCG matrix with a suitable example.',
 asks:'Explain what the BCG matrix is used for and how it works, illustrated with a real portfolio.',
 cmd:[['Explain the use','Purpose, axes, quadrants and strategies.'],['With a suitable example','Name real products in each quadrant.']],
 concepts:['BCG origin and axes (M2·S86–87)','Why BCG — four uses (M2·S89)','Quadrants and strategies (M2·S92–96, S101)','Company examples (M2·S100)'],
 plan:['Define the matrix and its axes.','State its uses.','Draw the grid with strategies.','Give a company example per quadrant.'],
 ans:`<p>The Growth-Share (BCG) matrix, developed by the Boston Consulting Group in the 1970s, classifies each SBU by <b>market growth rate</b> and <b>relative market share</b> (M2·S86–87).</p>
<h5>Uses</h5><ul><li>To assess profiles of products/businesses, their cash demands and development cycles, and to guide resource allocation and divestment decisions (M2·S89).</li><li>To identify how corporate cash can best be used to maximize future growth and profitability, and to avoid a one-size-fits-all strategy (M2·S97–98).</li></ul>
<h5>Quadrants and strategies</h5><p>Question marks (high growth, low share) → invest to build or divest; stars (high growth, high share) → continue substantial investment; cash cows (low growth, high share) → fund other units, invest little; dogs (low growth, low share) → divest (M2·S96, S101).</p>
<h5>Example (Hindustan Unilever, M2·S100)</h5><p>Cash cows: AXE, Vaseline Petroleum Jelly · Stars: Lux, Sun-Silk, Ponds, Surf-Excel, Annapurna Atta · Question marks: Rin, Pepsodent, Domex · Dog: Wheel.</p>`,
 dia:{t:'quad',y:'Market growth rate',x:'Relative market share',xl:['Low','High'],cells:[['Question marks','Rin, Pepsodent, Domex'],['Stars','Lux, Sun-Silk, Ponds, Surf-Excel'],['Dogs','Wheel'],['Cash cows','AXE, Vaseline Petroleum Jelly']]},
 struct:'Definition and uses (1 mark), labelled grid with strategies (1 mark), company example per quadrant (1 mark).',
