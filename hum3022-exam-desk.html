{id:'p6q13',p:'P6',n:'13',m:3,k:'desc',topic:'m1t5',pat:'fayol',cw:['Quote','Identify'],
 q:'Quote lines from the PhysicsWallah case study to identify three Henry Fayol’s Principles with an explanation for each. Give a brief explanation of each of them.\nPhysicsWallah, co-founded by Alakh Pandey (founder and CEO) and Prateek Maheshwari (co-founder), is an ed-tech company providing affordable, high-quality online education and learning resources for students preparing for competitive exams. Mr Pandey ensures that all faculty, content creators, and administrative staff align their personal goals with the organization’s mission of providing affordable, high-quality education to students across India. Mr Pandey encourages teamwork and collaboration through cross-functional projects, mentoring programs, and interactive learning initiatives, which strengthens morale and collective commitment. The company balances decision-making by centralizing strategic planning at the leadership level while empowering department heads and instructors to make operational decisions, enabling agility and responsiveness in a fast-evolving ed-tech landscape.',
 ans:`<ol><li><b>“align their personal goals with the organization’s mission”</b> → <b>Subordination of individual interest to general interest</b>: the interest of the undertaking prevails; individual and group interests should be reconciled (M1·S47).</li>
<li><b>“encourages teamwork and collaboration… which strengthens morale and collective commitment”</b> → <b>Esprit de corps</b>: team spirit, harmony and mutual understanding that inspire workers (M1·S48–49).</li>
<li><b>“centralizing strategic planning at the leadership level while empowering department heads and instructors to make operational decisions”</b> → <b>Centralization and decentralization</b>: a balance between authority kept at the top and authority shared downwards (M1·S50–51).</li></ol>`,
 keys:['Subordination of individual interest with quote','Esprit de corps with quote','Centralization & decentralization with quote','Explanation of each'],
 refs:'M1·S47–51',sup:'full'},
{id:'p6q14',p:'P6',n:'14',m:3,k:'desc',topic:'m1t10',pat:'intl',cw:['Analyze','Compare'],
 q:'Analyze and compare three international business management styles by examining six key aspects of management.',
 ans:`<div class="tablewrap"><table><thead><tr><th>Aspect</th><th>Korean</th><th>Japanese</th><th>American</th></tr></thead><tbody>
<tr><td>Decision-making</td><td>Top-down, hierarchical</td><td>Consensus-driven, participative</td><td>Top-down, fast, individual</td></tr>
<tr><td>Employment practices</td><td>Loyalty and seniority</td><td>Lifetime employment, loyalty</td><td>Performance-based, high mobility</td></tr>
<tr><td>Communication</td><td>Indirect, high-context</td><td>Indirect, high-context</td><td>Direct, low-context</td></tr>
<tr><td>Leadership style</td><td>Authoritative, paternalistic</td><td>Facilitative, consensus-oriented</td><td>Authoritative, results-oriented</td></tr>
<tr><td>Conflict resolution</td><td>Avoidance, maintaining face</td><td>Avoidance, maintaining harmony</td><td>Confrontational, quick resolution</td></tr>
<tr><td>Performance evaluation</td><td>Seniority and loyalty</td><td>Group performance and seniority</td><td>Individual performance, results</td></tr></tbody></table></div>
<p><b>Analysis:</b> Korean and Japanese styles share indirect communication and conflict avoidance; they differ in who decides (hierarchy vs consensus). The American style stands apart on individualism — fast individual decisions, direct communication, and rewards for individual results (M1·S102–103).</p>`,
 keys:['Three styles: Korean, Japanese, American','Six aspects in a table','Correct slide wording in each cell','A short analysis of similarities and differences'],
 refs:'M1·S102–103',sup:'full'},
{id:'p6q15',p:'P6',n:'15',m:3,k:'desc',topic:'m2t2',pat:'plans',cw:['Quote','Identify','Explain'],
 q:'From Blinkit (formerly known as Grofers) practices, Quote and Identify the three types of PLANS incorporated by them. Explain the significance of these identified plans.\nBlinkit follows a step-by-step protocol for processing orders and ensuring on-time deliveries. Blinkit Employees must adhere to safety and customer service guidelines during all deliveries. Blinkit runs loyalty and marketing programs to expand its customer base and enter new cities.',
 ans:`<ol><li><b>“a step-by-step protocol for processing orders”</b> → <b>Procedure</b>: a stepwise guide for routine activities, described in chronological order and followed by all employees (M2·S15). <i>Significance:</i> activities are carried out in an organized manner every time.</li>
<li><b>“Employees must adhere to safety and customer service guidelines during all deliveries”</b> → <b>Rules</b>: specific statements of required action, no flexibility, compulsory, with consequences for breaking them (M2·S16). <i>Significance:</i> uniform safe conduct on every delivery.</li>
<li><b>“runs loyalty and marketing programs to expand its customer base and enter new cities”</b> → <b>Programs</b>: a complex of goals, policies, procedures, rules, task assignments and resources to carry out a course of action, usually supported by budgets (M2·S17). <i>Significance:</i> bundles everything needed for expansion into one coordinated plan.</li></ol>`,
 keys:['Procedure with quote','Rules with quote','Programs with quote','Significance of each'],
 refs:'M2·S15–17',sup:'full'},
{id:'p6q16',p:'P6',n:'16',m:3,k:'desc',topic:'m3t2',pat:'orgproc',cw:['Analyze','Explain'],
 q:'Using a corporate example, analyze how the four-step organizing process is implemented, and explain the interplay between formal and informal organizational structures in that context.',
 ans:`<p><b>Example: Nexa Manufacturing</b> (the auto-parts maker from the Mar 2025 paper).</p>
<ol><li><b>Identification of activities</b> — the production floor’s work: assembly, quality control, logistics.</li><li><b>Organizing the activities</b> — homogeneous jobs grouped into specialized teams for assembly, quality control and logistics (M3·S30).</li><li><b>Classification of authority</b> — key strategic decisions stay with the CEO and top management; operational authority goes to middle managers and team leaders.</li><li><b>Relating authority and responsibility</b> — each team leader is responsible for the team’s results, with authority matching that responsibility (M3·S26).</li></ol>
<h5>Formal and informal interplay</h5><p>The teams and reporting lines above are the <b>formal organization</b> — an intentional structure of roles (M3·S8). An <b>informal organization</b> of friendships and social groups (on the slide: golf club, bowling team, morning coffee regulars) spontaneously originates within this formal set-up and emerges from it (M3·S10–11). Formal authority is fixed and defined, while informal authority rests on personal acceptance and works through people (M3·S12) — so the informal network runs alongside and across the formal teams.</p>`,
 keys:['Four steps in order applied to one company','Authority and responsibility step explained','Formal = intentional structure of roles','Informal arises spontaneously within the formal set-up','A formal vs informal contrast (fixed authority vs personal acceptance)'],
 refs:'M3·S7–12;M3·S26;M3·S30',sup:'partial',supNote:'M3·S7 gives only the step titles. The company example is taken from the Mar 2025 paper (Q12), because the Chapter 3 slides give no corporate example of the organizing process.'},
{id:'p6q17',p:'P6',n:'17',m:2,k:'desc',topic:'m1t7',pat:'csr',cw:['Analyze'],
 q:'Analyze how the four key drivers of Corporate Social Responsibility (CSR) influence a company’s strategic and ethical decision-making, using suitable corporate examples for each of the drivers.',
 ans:`<ol><li><b>Brand equity</b> — the value of a brand from consumers’ perception of quality and desirability (M1·S75); protecting it shapes strategic choices. <i>Example:</i> Apple’s strong brand awareness and loyalty underpin its strategies (M2·S80–81).</li>
<li><b>Ethical marketing practices and social awareness</b> — an ethical culture emphasizes professionalism and transparency (M1·S76). <i>Example:</i> HUL’s Project Shakti brought hygiene and sanitation products and safe drinking water to rural communities (M2·S59).</li>
<li><b>The environment consciousness</b> — CSR takes responsibility for the company’s effects on the environment (M1·S74). <i>Example:</i> Unilever commits to 100% recyclable packaging by 2025.</li>
<li><b>Responsibility towards the government</b> — the company must satisfy officials that it abides by the law (M1·S63). <i>Example:</i> Apple faces EU regulators pushing Type-C to reduce e-waste (M2·S81).</li></ol>`,
 keys:['Four drivers from M1·S75','How each influences decisions','A named example per driver'],
 refs:'M1·S63;M1·S74–76;M2·S59;M2·S80–81',sup:'partial',supNote:'The CSR slides name the drivers without examples. The Apple and HUL examples come from Chapter 2 slides; the Unilever example comes from the Mar 2025 paper (Q3).'},
{id:'p6q18',p:'P6',n:'18',m:2,k:'desc',topic:'m2t9',type:'Explanation',cw:['Elaborate'],
 q:'Using the “Four Actions Framework” elaborate the blue ocean strategy process used by corporates towards the creation of New Market Spaces.',
 asks:'Explain the four actions (eliminate, reduce, raise, create) and how they lead to a new market space.',
 cmd:[['Elaborate','Explain each action and connect it to value innovation.']],
 concepts:['Four Actions Framework (M2·S62)','Value innovation (M2·S55)','Console example (M2·S63–66)'],
 plan:['One line: blue ocean creates uncontested space via value innovation.','Explain E, R, R, C.','Illustrate with the console example.'],
 ans:`<p>Blue Ocean strategy creates uncontested market space through <b>value innovation</b> — differentiation and low cost at once (M2·S55). The <b>Four Actions Framework</b> sorts every factor of competition into four groups (M2·S62):</p>
<ul><li><b>Eliminate</b> the factors on which the company (and industry) has been competing.</li><li><b>Reduce</b> several factors below the company standards.</li><li><b>Raise</b> key factors above the standards so the competition becomes irrelevant.</li><li><b>Create</b> new ideas, factors and steps needed to reach the blue ocean.</li></ul>
<p><i>Slide example (gaming consoles):</i> eliminate graphics quality and games available; reduce price and price of games; raise family games and motion control; create a marketplace and online games (M2·S64).</p>`,
 dia:{t:'quad',cells:[['Eliminate','graphics quality, games available'],['Reduce','price of games, price'],['Raise','family games, motion control'],['Create','marketplace, online games']]},
 struct:'A one-line opening, the four actions (one line each), and the slide example.',
 keys:['Value innovation / uncontested market space','Eliminate','Reduce','Raise','Create','An example'],
 mis:['Listing ERRC without saying what each does.'],
 tip:'Eliminate and reduce lower cost; raise and create add value — say this in one line to show why the framework produces value innovation.',

{id:'p6q19',p:'P6',n:'19',m:2,k:'desc',topic:'m3t6',pat:'dept',cw:['Identify','Draw'],
 q:'IDENTIFY the type of departmentation structure incorporated by Tata Motors. Draw a neat department structure based on the above case.\nAt Tata Motors, the company simultaneously manages multiple vehicle projects — electric cars, commercial trucks, and SUVs. Employees from functional departments such as Design, Production, Finance, and Marketing are assigned to specific project teams. For instance, the commercial truck project and the SUV project need employees from all the functional departments, while the electric car project need employees from three functional departments but doesn’t need the any employee from marketing team as the car is still in prototype stage.',

{id:'p7q11',p:'P7',n:'11',m:4,k:'desc',topic:'m2t2',pat:'plans',cw:['Identify','Explain'],
 q:'\'Organic Manipal\', a new organic food chain based in Manipal, has established the following guidelines for its operations:\n1.To become the market leader in the organic snack segment within 3 years.\n2.To always prioritize locally sourced ingredients over imported ones.\n3.A detailed 5-step sequence for conducting quality checks on incoming produce.\n4.A strict prohibition of smoking within the warehouse premises.\nIdentify and explain which specific type of plan each of the above represents.',
 ans:`<ol><li><b>“To become the market leader in the organic snack segment within 3 years”</b> → <b>Goal / objective</b>: an important end toward which activities are directed (M2·S11); it is verifiable, with a target and a time limit.</li>
<li><b>“To always prioritize locally sourced ingredients over imported ones”</b> → <b>Policy</b>: a general statement that guides or channels thinking in decision making, like “buying from the lowest of three qualified bidders” (M2·S13–14).</li>
<li><b>“A detailed 5-step sequence for conducting quality checks”</b> → <b>Procedure</b>: a stepwise guide for routine activities in chronological order (M2·S15).</li>
<li><b>“A strict prohibition of smoking within the warehouse premises”</b> → <b>Rule</b>: a specific statement of action or non-action with no flexibility — the slide’s own example is a no smoking zone (M2·S16).</li></ol>`,
 keys:['Objective/goal for statement 1','Policy for statement 2','Procedure for statement 3','Rule for statement 4','Slide definition with each'],
 refs:'M2·S11;M2·S13–16',sup:'full'},
{id:'p7q12',p:'P7',n:'12',m:3,k:'desc',topic:'m1t11',pat:'theoryz',cw:['Explain','Discuss'],
 q:'Explain William Ouchi’s Theory Z. Discuss how it remains relevant for building organizational commitment in today’s competitive business environment.',
 ans:`<p><b>Theory Z</b> (William Ouchi, 1980s) integrates Japanese and American practices — Japanese collective decision making with American individual responsibility. It builds loyalty through a job for life and concern for well-being on and off the job, promoting stable employment, high productivity, and high morale and satisfaction (M1·S107).</p>
<p><b>Features (M1·S108):</b> long-term employment; consensual, participative decision-making; individual responsibility; slow evaluation and promotion; implicit informal control with explicit measures; moderately specialized careers; holistic concern including family.</p>
<h5>Relevance for commitment today</h5><ul><li><b>Loyalty and low turnover:</b> long-term employment and holistic concern directly build the employee loyalty the theory aims at (M1·S107–108).</li><li><b>Participation:</b> consensual decisions give employees a voice, which supports morale and satisfaction (M1·S107).</li><li><b>Trust in a changing environment:</b> managers now face global competition, customer expectations and the need to respond quickly to change; trust sits at the centre of communication, collaboration and willingness to change, and should be built into a culture that outlasts individual leaders (M1·S90–91).</li></ul>`,
 keys:['Theory Z defined (Ouchi, integrates J and A)','Loyalty, job for life, well-being','Outcomes: stable employment, productivity, morale','Several Z features','A relevance argument linked to commitment/trust'],
 refs:'M1·S90–91;M1·S107–108',sup:'partial',supNote:'The slides explain Theory Z fully but say nothing about its relevance today. The relevance points are built from Theory Z’s stated aims (S107) and the trust-in-change slides (S90–91).'},
{id:'p7q13',p:'P7',n:'13',m:3,k:'desc',topic:'m1t5',pat:'fayol',cw:['Analyze','Identify','Justify'],
 q:'SkyLine Electronics, a mid-sized firm, decided to launch a new line of eco-friendly home appliances. The CEO, Mr. Advait, called a meeting and clearly defined the year\'s target: "To capture 15% of the green-appliance market by December."\nTo achieve this, he appointed Ms. Sneha as the Project Lead. He gave her the authority to hire a specialized team and approve expenses up to ₹50 Lakhs. Sneha created a structure where each engineer reported to only one Senior Lead to avoid confusion. She also ensured that every tool and document had a designated place in the new lab so no time was wasted searching for resources.\nHowever, during the first month, two team members had a public disagreement over design. Sneha stepped in, reminded them that the "project\'s success comes before personal ego," and settled the matter. By the end of the quarter, the team was so motivated by her fair treatment and clear direction that they worked extra hours voluntarily to meet the deadline.\nAnalyze the case above and identify any four Principles of Management (Fayol\'s Principles) applied by the management. Justify your answer with specific lines from the text.',
 cmd:[['Analyze','Read the case for management practices.'],['Identify any four','Name four of Fayol’s principles — this paper asks for four, not three.'],['Justify with specific lines','Quote the line for each.']],
 struct:'Four numbered points (about ¾ mark each): quote → principle → one-line explanation.',
 ans:`<ol><li><b>“gave her the authority to hire a specialized team and approve expenses up to ₹50 Lakhs”</b> (as Project Lead) → <b>Authority and responsibility</b>: authority and responsibility co-exist; a person made responsible must be given matching authority (M1·S35).</li>
<li><b>“each engineer reported to only one Senior Lead to avoid confusion”</b> → <b>Unity of command</b>: one boss at a time; dual subordination creates confusion (M1·S36).</li>
<li><b>“every tool and document had a designated place in the new lab so no time was wasted”</b> → <b>Order (material order)</b>: a safe, specific place for every article (M1·S40).</li>
<li><b>“project’s success comes before personal ego”</b> → <b>Subordination of individual interest to general interest</b>: the interest of the undertaking prevails; differences are reconciled (M1·S47).</li></ol>
<p class="small">Also defensible: “fair treatment” → equity (M1·S39); “clearly defined the year’s target… clear direction” → unity of direction (M1·S37); “worked extra hours voluntarily” → initiative or esprit de corps (M1·S43, S48).</p>`,
 keys:['Authority & responsibility with quote','Unity of command with quote','Order (material order) with quote','Subordination of individual interest with quote','(Alternatives: equity, unity of direction, initiative/esprit de corps)'],
 refs:'M1·S35–40;M1·S43;M1·S47–48',sup:'full'},
{id:'p7q14',p:'P7',n:'14',m:3,k:'desc',topic:'m1t6',pat:'mintz',cw:['Analyze','Identify','Explain'],
 q:'RoboDog Tech, a software firm in Noida, recently transitioned from a traditional phased approach to a flexible iterative model. The CEO appointed Mr. Arjun as the Change Manager.\nStage 1: During the first week, a heated argument broke out between the Quality Assurance (QA) team and the Developers. The QA team claimed they were being bypassed, while Developers complained that QA was slowing down the "sprints." Mr. Arjun immediately called both leads into his office to mediate and find a resolution before the project was derailed.\nStage 2: After settling the dispute, Mr. Arjun noticed that the budget for cloud servers was higher than expected. He sat down to re-allocate funds from the marketing budget to the technical infrastructure to ensure development didn\'t stop.\nStage 3: During a board meeting, a group of investors questioned the "messy" transition. Mr. Arjun stood up and delivered a detailed presentation, defending the new methodology and providing data on how it would improve long-term efficiency for the firm.\nStage 4: To finalize the transition, Mr. Arjun met with an external Cloud Service Provider. The provider wanted a 20% price hike, but through a series of meetings, Mr. Arjun convinced them to maintain the current rates in exchange for a longer three-year contract, saving the company significant costs.\nQuestion: Analyze the "RoboDog Tech" case study provided above. Identify and explain the Managerial Roles (Main Category and specific Sub-role) played by Mr. Arjun at each of the four stages, according to Mintzberg’s Classification of Roles. Support your identification by citing the relevant lines from the case.',
 cmd:[['Identify and explain… at each of the four stages','Four roles, one per stage — main category and sub-role.'],['Support… by citing the relevant lines','Quote a line per stage.']],
 struct:'A four-row table (stage | quote | main role | sub-role + reason), about ¾ mark per row.',
 ans:`<div class="tablewrap"><table><thead><tr><th>Stage</th><th>Quoted line</th><th>Main role</th><th>Sub-role and reason</th></tr></thead><tbody>
<tr><td>1</td><td>“a heated argument broke out… called both leads into his office to mediate and find a resolution before the project was derailed”</td><td>Decisional</td><td><b>Disturbance handler</b> — responding involuntarily to pressure too severe to ignore (M1·S66)</td></tr>
<tr><td>2</td><td>“re-allocate funds from the marketing budget to the technical infrastructure”</td><td>Decisional</td><td><b>Resource allocator</b> — deciding who will receive what in the unit (M1·S67)</td></tr>
<tr><td>3</td><td>“During a board meeting… delivered a detailed presentation, defending the new methodology”</td><td>Informational</td><td><b>Spokesman</b> — informing and satisfying influential people such as directors and shareholders (M1·S63)</td></tr>
<tr><td>4</td><td>“through a series of meetings, Mr. Arjun convinced them to maintain the current rates in exchange for a longer three-year contract”</td><td>Decisional</td><td><b>Negotiator</b> — negotiations are duties of the manager’s job (M1·S68)</td></tr></tbody></table></div>`,
 keys:['Stage 1: disturbance handler (decisional)','Stage 2: resource allocator (decisional)','Stage 3: spokesman (informational)','Stage 4: negotiator (decisional)','Quotes cited for each stage'],
 refs:'M1·S63;M1·S66–68',sup:'full'},
{id:'p7q15',p:'P7',n:'15',m:3,k:'desc',topic:'m2t11',pat:'bcgcase',cw:['Draw','Identify'],
 q:'Global-Tech Solutions is evaluating its diverse business units to allocate the annual budget. As a management consultant, you are provided with the following data:\nUnit 1 (Cloud Storage): Operates in a market growing at 15% annually. It holds a 45% market share, while its nearest competitor holds only 10%.\nUnit 2 (Legacy Antivirus): Operates in a mature market with 2% annual growth. It holds a 60% market share and generates high cash reserves with minimal investment.\nUnit 3 (Internal Disc Drives): Operates in a declining market with -5% growth. Its market share is 4%, while the leader holds 70%.\nUnit 4 (AI Personal Assistants): Operates in a hyper-growth market (30% annually). However, the unit currently holds only a 5% market share as it is a new entry.\nQuestions: i) Draw the BCG Matrix and correctly place all four Units (1, 2, 3, and 4) into their respective quadrants.\nii) For each Unit, identify the most appropriate BCG Strategy.',
 ans:`<p>Relative market share = SBU sales / leading competitor’s sales (M2·S88). Unit 1: 45 ÷ 10 = <b>4.5</b> (market leader). Unit 3: 4 ÷ 70 ≈ <b>0.06</b>.</p>
<ol><li><b>Unit 1 · Cloud storage — Star</b> (15% growth, relative share 4.5). Strategy: <b>build/hold</b> — continue substantial investment funding and hold market growth (M2·S93, S96).</li>
<li><b>Unit 2 · Legacy antivirus — Cash cow</b> (2% growth in a mature market, 60% share, high cash with minimal investment). Strategy: <b>hold/harvest</b> — extract profits investing as little as possible; fund stars and question marks (M2·S94, S96).</li>
<li><b>Unit 3 · Internal disc drives — Dog</b> (−5% declining market, relative share ≈ 0.06). Strategy: <b>divest</b> — cash trap in a declining stage (M2·S95–96).</li>
<li><b>Unit 4 · AI personal assistants — Question mark</b> (30% growth, 5% share as a new entry). Strategy: <b>build</b> — invest heavily to enhance its competitive position, since most businesses start as question marks (M2·S92, S96).</li></ol>`,
 dia:{t:'quad',y:'Market growth rate',x:'Relative market share',xl:['Low','High'],cells:[['Question mark','Unit 4 AI assistants (30%, 5% share) → build'],['Star','Unit 1 Cloud storage (15%, RMS 4.5) → build/hold'],['Dog','Unit 3 Disc drives (−5%, RMS 0.06) → divest'],['Cash cow','Unit 2 Antivirus (2%, 60% share) → hold/harvest']]},
 keys:['Labelled BCG grid','Unit 1 Star + build/hold','Unit 2 Cash cow + hold/harvest','Unit 3 Dog + divest','Unit 4 Question mark + build','Relative market share computed where data allow'],
 refs:'M2·S88;M2·S92–96;M2·S101',sup:'full'},
{id:'p7q16',p:'P7',n:'16',m:3,k:'desc',topic:'m3t6',pat:'dept',cw:['Design','Draw','Mention'],
 q:'RB Automotive, a major player in vehicle technology, is developing three distinct software projects: Project Alpha (Autonomous Driving), Project Beta (Infotainment Systems), and Project Gamma (Battery Management). Mr. Diljit is the Director of Technology. He manages four departments that provide the expertise for these projects: Software Engineering, Hardware Design, Quality Testing, and Cybersecurity.\nThe resource requirements for the projects are as follows:\nProject Alpha: Being the most complex, it requires expertise from all four functional departments.\nProject Beta: This project focuses on the user interface. It requires Software Engineering, Hardware Design, and Quality Testing, but does not require the specialized Cybersecurity team.\nProject Gamma: This is a specialized backend project. It requires only Software Engineering and Quality Testing.\nQuestions: (i) Design and draw a departmentalization structure for RB. Ensure the diagram allows management to pinpoint profit/cost responsibility for each project.\n(ii) Mention one main disadvantage that accompany this style of departmentalization.',
 ans:`<p><b>(i) Matrix departmentation</b>: Mr. Diljit’s four functional departments form the vertical hierarchy, and the three projects are superimposed as horizontal lines; each project row shows exactly the functions it draws on (M3·S44–45). Because each project is a separate row, its costs can be traced to it.</p>
<p><b>(ii) Disadvantage:</b> a matrix organization has a <b>complicated structure</b>, with reporting relationships set up as a grid instead of the traditional vertical hierarchy (M3·S45). An engineer on Project Alpha answers to both the project and a functional head — the dual subordination Fayol warned “undermines authority, weakens discipline, divides loyalty, creates confusion” (M1·S36).</p>`,
 dia:`<div class="tablewrap"><table><thead><tr><th>Director of Technology</th><th>Software Engineering</th><th>Hardware Design</th><th>Quality Testing</th><th>Cybersecurity</th></tr></thead><tbody><tr><th scope="row">Project Alpha (Autonomous driving)</th><td>●</td><td>●</td><td>●</td><td>●</td></tr><tr><th scope="row">Project Beta (Infotainment)</th><td>●</td><td>●</td><td>●</td><td></td></tr><tr><th scope="row">Project Gamma (Battery management)</th><td>●</td><td></td><td>●</td><td></td></tr></tbody></table></div><div class="cap">Matrix grid after M3·S45</div>`,
 keys:['Matrix identified','Grid: four departments × three projects with correct cells','Project rows allow cost responsibility','One disadvantage (complicated structure / dual reporting)'],
 refs:'M3·S44–45;M1·S36',sup:'partial',supNote:'The slide states only that a matrix is “complicated” (M3·S45). The link to Fayol’s dual-subordination problems is a cross-chapter inference.'},
{id:'p7q17',p:'P7',n:'17',m:2,k:'desc',topic:'m3t4',type:'Case: quote & identify',cw:['Justify','Discuss'],
 q:'Consider the following two departments at \'Tech-Nova Solutions\':\nDepartment A (Data Entry): The work is highly standardized, repetitive, and employees use automated software to log their entries.\nDepartment B (R&D Lab): The work is complex and non-routine. Engineers are working on a first-of-its-kind prototype that requires frequent consultation with their supervisor.\nQuestions: i) Based on the nature of work, which department can afford a Wide Span of Control? Justify your answer.\nii) Discuss any three other factors (besides nature of work) that determine the ideal span of control for a manager.',
 asks:'Pick the department that can have a wide span and justify it; then name and explain three more span factors.',
 cmd:[['Justify','Give the reason from the nature of the work.'],['Discuss any three other factors','Name three of the remaining factors from the slide and say how each matters.']],
 concepts:['Span of control and its optimal level (M3·S14)','Eight factors (M3·S15)'],
 plan:['Answer (i): Department A, with reasons.','List three other factors from M3·S15 with one line each.'],
 ans:`<p><b>(i) Department A (data entry)</b> can afford a wide span. “Kind of activity” is a factor in the span of control (M3·S15): standardized, repetitive, automated work needs little supervision, so one supervisor can oversee many people without losing control. Department B’s complex, non-routine work with frequent consultation needs a narrow span — narrow enough to maintain control (M3·S14).</p>
<p><b>(ii) Three other factors (M3·S15):</b></p><ol><li><b>Subordinates’ training</b> — well-trained subordinates need less guidance.</li><li><b>Delegation of authority</b> — where authority is delegated, subordinates decide for themselves.</li><li><b>Communication techniques</b> — effective communication reduces the time each subordinate takes.</li></ol><p class="small">Others on the slide: planning, rate of change, kind of organization, organization level.</p>`,
 struct:'(i) one line of choice + one line of reason; (ii) three named factors with one line each.',
 keys:['Department A chosen','Reason: standardized/repetitive/automated work = kind of activity','Three other factors named from M3·S15','Each factor explained briefly'],
 mis:['Choosing Department B.','Repeating “nature of work” as one of the three other factors.'],
 tip:'Quote the slide’s factor names exactly — they are what the checklist will look for.',
 refs:'M3·S14–15',sup:'partial',supNote:'The factor names are on M3·S15; the slides do not state which way each factor pushes the span, so the direction is reasoned from M3·S14.'},
{id:'p7q18',p:'P7',n:'18',m:2,k:'desc',topic:'m2t6',type:'Case: quote & identify',cw:['Identify','State'],
 q:'At Orange Solutions, supervisors no longer impose targets on their teams. Instead, every quarter, each engineer sits with their manager to mutually agree upon specific project milestones and deadlines. Progress is then tracked against these jointly-set goals.\ni) Identify the management system being followed here.\nii) State one advantage and one disadvantage of this approach.',
 asks:'Name the system (MBO) and give one benefit and one weakness from the slides.',
 cmd:[['Identify','Name the system with the telling phrase.'],['State one advantage and one disadvantage','One from the benefits list, one from the weaknesses or problems list.']],
 concepts:['MBO: objectives agreed by management and employees (M2·S33)','Benefits (M2·S43), weaknesses (M2·S44), problems (M2·S45)'],
 plan:['Identify MBO, quoting “mutually agree”.','One benefit.','One weakness or problem.'],
 ans:`<p><b>(i) Management by Objectives (MBO)</b> — objectives “agreed to by both management and employees” (M2·S33) and then used to monitor performance (M2·S35): “mutually agree upon specific project milestones… progress is then tracked”.</p>
<p><b>(ii) Advantage:</b> it encourages participative management and gives a good feedback system, so people are motivated (M2·S43). <b>Disadvantage:</b> emphasis on short-run goals — quarterly milestones may crowd out long-term aims; setting goals is also difficult (M2·S44).</p>`,
 struct:'(i) one line with the quoted clue; (ii) one advantage and one disadvantage, one line each.',
 keys:['MBO identified','Quote: mutually agreed goals / tracked progress','One benefit from M2·S43','One weakness/problem from M2·S44–45'],
 mis:['Calling it “participative management” only, without naming MBO.'],
 tip:'Quote “mutually agree” — it is the defining feature of MBO on M2·S33.',
 refs:'M2·S33;M2·S35;M2·S43–44',sup:'full'},
{id:'p7q19',p:'P7',n:'19',m:2,k:'desc',topic:'m1t7',pat:'csr',cw:['Provide','Explain'],
 q:'Provide one corporate example for each while explaining any two key drivers of corporate social responsibility (CSR).',
 ans:`<ol><li><b>Ethical marketing practices and social awareness</b> (M1·S75) — an ethically responsible culture emphasizes professionalism and transparency and reduces unfair practices (M1·S76). <i>Example:</i> Hindustan Unilever’s Project Shakti brought basic hygiene and sanitation products, and safe drinking water, to rural communities that needed them most (M2·S59).</li>
<li><b>Energy conservation and global warming</b> (M1·S75) — CSR takes responsibility for the company’s effects on the environment (M1·S74). <i>Example:</i> Adani Green Energy expanded solar and wind projects to align with environmental consciousness and ecological sustainability demands.</li></ol>`,
 keys:['Two drivers named from M1·S75','Each explained','A named corporate example for each'],
 refs:'M1·S74–76;M2·S59',sup:'partial',supNote:'The CSR slides give no company examples. HUL’s Project Shakti is on M2·S59; the Adani Green example comes from the Sep 2025 paper (Q3 option 4).'}
);

 // short answers (2 marks)
 {id:'bs-1',k:'short',m:2,mod:'m1',topic:'m1t1',q:'Differentiate between a business and an industry with one example each.',ans:`<p>An <b>industry</b> is a group of companies or organizations that produce similar goods or services; it represents a specific sector of the economy (e.g. the automotive industry). A <b>business</b> is an individual company engaged in commercial activities, operating within an industry and aiming to generate profits (e.g. Tesla) (M1·S11).</p>`,keys:['Industry = group of companies / sector','Business = individual company aiming at profit','One example each'],refs:'M1·S11'},
 {id:'bs-2',k:'short',m:2,mod:'m1',topic:'m1t5',q:'What is a gang plank? Why did Fayol allow it?',ans:`<p>The scalar chain is the chain of superiors from the ultimate authority to the lowest, through which every order and message passes. For convenience and urgency the path can be cut short: a <b>gang plank</b> is a temporary arrangement between two different points to facilitate quick and easy communication. It shows management principles are flexible, not rigid (M1·S46).</p>`,keys:['Scalar chain defined','Gang plank = temporary shortcut for quick communication','Principles are flexible'],refs:'M1·S46'},
 {id:'bs-3',k:'short',m:2,mod:'m1',topic:'m1t8',q:'State the three moral theories of normative ethics.',ans:`<p><b>Utilitarian</b> — actions judged by consequences: the greatest good for the greatest number. <b>Rights</b> — all people have basic rights such as freedom of conscience, free speech and due process. <b>Justice</b> — decision makers guided by fairness, equity and impartiality (M1·S81–83).</p>`,keys:['Utilitarian with its test','Rights with examples of rights','Justice: fairness, equity, impartiality'],refs:'M1·S81–83'},
 {id:'bs-4',k:'short',m:2,mod:'m1',topic:'m1t9',q:'Why is trust called the basis for change management?',ans:`<p>Change management is a systematic approach to transforming an organization’s goals, processes and technologies and helping people adapt (M1·S89). Trust is at the centre of communication, collaboration and the willingness to change; it should be built into a culture of trust that transcends individual leadership, because leaders come and go while the organization continues (M1·S90–91).</p>`,keys:['Change management defined','Trust central to communication, collaboration, willingness to change','Culture of trust beyond individual leaders'],refs:'M1·S89–91'},
 {id:'bs-5',k:'short',m:2,mod:'m2',topic:'m2t2',q:'Distinguish between a procedure and a rule with the slides’ examples.',ans:`<p>A <b>procedure</b> is a stepwise guide for routine activities, described in chronological order — e.g. college admission (form → documents → sorting) (M2·S15). A <b>rule</b> is a specific statement defining an action or non-action with no flexibility and no time sequence; it may or may not be part of a procedure — e.g. a no smoking zone (M2·S16).</p>`,keys:['Procedure = chronological steps','Rule = no flexibility, no time sequence','Examples: admission; no smoking zone'],refs:'M2·S15–16'},
 {id:'bs-6',k:'short',m:2,mod:'m2',topic:'m2t6',q:'What is a key result area? List four of Drucker’s.',ans:`<p>A key result area is an area in which performance is essential for the success of the enterprise. Drucker’s include market standing, innovation, productivity, physical and financial resources, profitability, managerial performance and development, worker performance and attitude, and public responsibility (M2·S38).</p>`,keys:['Definition of KRA','Four correct KRAs'],refs:'M2·S38'},
 {id:'bs-7',k:'short',m:2,mod:'m2',topic:'m2t7',q:'Name the three levels of strategy and the question each answers.',ans:`<p><b>Corporate level</b> — what business are we in? <b>Business (competitive) level</b> — how do we compete? <b>Functional level</b> — how do we support the business-level strategy? (M2·S48)</p>`,keys:['Corporate + question','Business + question','Functional + question'],refs:'M2·S48'},
 {id:'bs-8',k:'short',m:2,mod:'m2',topic:'m2t12',q:'What does it mean to be “stuck in the middle”?',ans:`<p>A company that tries to engage in each generic strategy but fails to achieve any of them has no competitive advantage and competes at a disadvantage against cost leaders, differentiators and focusers — though it may still earn profits in a highly attractive industry or if its competitors are also stuck in the middle (M2·S108, marked “for reading only”).</p>`,keys:['Tries all strategies, achieves none','No competitive advantage / disadvantage vs others','Exception: attractive industry or rivals also stuck'],refs:'M2·S108'},
 {id:'bs-9',k:'short',m:2,mod:'m3',topic:'m3t4',q:'Define span of control and state what makes it optimal.',ans:`<p>Span of control is the number of subordinates who report directly to an executive or supervisor; differences in span shape the organization (M3·S14). It is optimal when it is narrow enough to let managers maintain control over subordinates and wide enough to minimize micromanaging (M3·S14).</p>`,keys:['Definition','Narrow enough for control','Wide enough to avoid micromanaging'],refs:'M3·S14'},
 {id:'bs-10',k:'short',m:2,mod:'m3',topic:'m3t6',q:'Why is departmentation by numbers falling into disuse?',ans:`<p>It groups all persons performing the same duties under one manager — an age-old method. It is declining because technology is advancing fast, demanding more specialized and different skills, and groups of specialized personnel are more efficient than groups based merely on numbers. It is useful only at the lowest level (M3·S32–33).</p>`,keys:['What it is','Technology demands specialized skills','Specialized groups more efficient','Useful only at lowest level'],refs:'M3·S32–33'},
 {id:'bs-11',k:'short',m:2,mod:'m3',topic:'m3t5',q:'State Urwick’s principle of parity of authority and responsibility.',ans:`<p>The responsibility for actions cannot be greater than that implied by the authority delegated, nor should it be less. The responsibility of subordinates to their superiors for performance is absolute, and superiors cannot escape responsibility for the organizational activities of their subordinates (M3·S26).</p>`,keys:['Responsibility neither more nor less than authority','Subordinates’ responsibility absolute','Superiors can’t escape responsibility'],refs:'M3·S26'},
 {id:'bs-12',k:'short',m:2,mod:'m1',topic:'m1t4',q:'Why is an organization called an open and dynamic system?',ans:`<p>It is <b>open</b> because it interacts with its environment: it draws inputs (energy, information, materials, finance) from the environment, transforms them, and returns outputs as goods and services. It is <b>dynamic</b> because the equilibrium in it is always changing; management must regulate and adjust the system for better performance (M1·S30).</p>`,keys:['Open: interacts with environment (inputs/outputs)','Dynamic: equilibrium always changing','Management regulates and adjusts'],refs:'M1·S30'},
 // comparison questions (3 marks)
 {id:'bc-1',k:'compare',m:3,mod:'m1',topic:'m1t5',q:'Compare unity of command and unity of direction on five bases.',ans:`<div class="tablewrap"><table><thead><tr><th>Basis</th><th>Unity of command</th><th>Unity of direction</th></tr></thead><tbody><tr><td>Meaning</td><td>A subordinate receives orders from only one boss</td><td>One head, one plan for activities with similar objectives</td></tr><tr><td>Nature</td><td>Functioning of personnel</td><td>Functioning of departments or the organization</td></tr><tr><td>Necessity</td><td>Fixing responsibility of each subordinate</td><td>Sound organization</td></tr><tr><td>Advantage</td><td>Avoids conflicts, confusion and chaos</td><td>Avoids duplication of efforts and wastage</td></tr><tr><td>Result</td><td>Better superior–subordinate relationship</td><td>Smooth running of the enterprise</td></tr></tbody></table></div>`,keys:['Meaning','Nature','Necessity','Advantage','Result'],refs:'M1·S38'},
 {id:'bc-2',k:'compare',m:3,mod:'m1',topic:'m1t11',q:'Compare Japanese, American and Theory Z organizations on any six features.',ans:`<div class="tablewrap"><table><thead><tr><th>Feature</th><th>Japanese</th><th>American</th><th>Theory Z</th></tr></thead><tbody><tr><td>Employment</td><td>Lifetime</td><td>Short-term</td><td>Long-term</td></tr><tr><td>Decision-making</td><td>Collective</td><td>Individual</td><td>Consensual, participative</td></tr><tr><td>Responsibility</td><td>Collective</td><td>Individual</td><td>Individual</td></tr><tr><td>Evaluation & promotion</td><td>Slow</td><td>Rapid</td><td>Slow</td></tr><tr><td>Control</td><td>Implicit</td><td>Explicit</td><td>Implicit informal with explicit measures</td></tr><tr><td>Career path</td><td>Non-specialized</td><td>Specialized</td><td>Moderately specialized</td></tr></tbody></table></div>`,keys:['Employment','Decision-making','Responsibility','Evaluation & promotion','Control','Career path / concern'],refs:'M1·S105–108'},
 {id:'bc-3',k:'compare',m:3,mod:'m2',topic:'m2t3',q:'Differentiate strategic and tactical plans (any five points).',ans:`<div class="tablewrap"><table><thead><tr><th>Strategic</th><th>Tactical</th></tr></thead><tbody><tr><td>Apply broadly to the entire organization</td><td>Apply to specific parts</td></tr><tr><td>Establish overall objectives</td><td>Derived from strategic objectives</td></tr><tr><td>Position the organization in its environment</td><td>Specify details of how objectives are achieved</td></tr><tr><td>Cover extended periods; less specific</td><td>Cover shorter periods</td></tr><tr><td>Basis for tactical plans; made by upper-level managers</td><td>Updated continuously; focus of lower-level managers</td></tr></tbody></table></div>`,keys:['Scope: whole vs parts','Objectives: establish vs derived','Positioning vs details','Time: extended vs shorter','Who makes / updating'],refs:'M2·S21–22'},
 {id:'bc-4',k:'compare',m:3,mod:'m2',topic:'m2t6',q:'Distinguish the benefits, weaknesses and problems of MBO (two each).',ans:`<p><b>Benefits:</b> encourages participative management; provides a good feedback system (also: job enrichment, motivated people) (M2·S43).</p><p><b>Weaknesses:</b> difficulty of setting goals; emphasis on short-run goals (also: danger of inflexibility, failure to teach its philosophy) (M2·S44).</p><p><b>Problems:</b> lower-level goals take precedence; paperwork (also: change adversely affects planning, low morale, over-centralized authority) (M2·S45).</p>`,keys:['Two benefits','Two weaknesses','Two problems'],refs:'M2·S43–45'},
 {id:'bc-5',k:'compare',m:3,mod:'m2',topic:'m2t11',q:'Compare stars and cash cows in the BCG matrix.',ans:`<div class="tablewrap"><table><thead><tr><th>Stars</th><th>Cash cows</th></tr></thead><tbody><tr><td>High growth, high market share</td><td>Low growth, high market share</td></tr><tr><td>Leaders; need heavy investment to keep share</td><td>Foundation of the company; often the stars of yesterday</td></tr><tr><td>Large cash consumption and generation</td><td>Generate more cash than required; invest as little as possible</td></tr><tr><td>Long-term growth potential; continue substantial investment</td><td>Limited long-run potential; fund stars and question marks</td></tr><tr><td>Hold growth or become a cash cow</td><td>Mature, not growing or declining industry</td></tr></tbody></table></div>`,keys:['Growth/share position','Investment need','Cash generation','Long-run potential / strategy','Life-cycle link'],refs:'M2·S93–96'},
 {id:'bc-6',k:'compare',m:3,mod:'m3',topic:'m3t3',q:'Give five differences between formal and informal organization.',ans:`<div class="tablewrap"><table><thead><tr><th>Formal</th><th>Informal</th></tr></thead><tbody><tr><td>Designed and created by top management</td><td>Comes up on its own</td></tr><tr><td>Planned</td><td>Spontaneous</td></tr><tr><td>Authority and responsibility fixed and defined</td><td>Authority based on personal acceptance</td></tr><tr><td>Requires an office to function</td><td>Functions through people</td></tr><tr><td>Rigid, definite, written constitution</td><td>Flexible, no fixed written constitution</td></tr></tbody></table></div>`,keys:['Creation','Planning','Authority','Office vs people','Rigidity / constitution'],refs:'M3·S12'},
 {id:'bc-7',k:'compare',m:3,mod:'m3',topic:'m3t6',q:'Compare departmentation by time and by territory: two advantages and two limitations each.',ans:`<p><b>Time</b> — advantages: 24×7 services; continuous processes uninterrupted (also: expensive equipment used longer). Limitations: night-shift supervision difficult; fatigue from changing biological clock (also: shift coordination, overtime cost) (M3·S35).</p><p><b>Territory</b> — advantages: emphasis on local markets and problems; better face-to-face communication with local interests (also: regional coordination, training ground for GMs). Limitations: needs more persons with general-manager ability; increases the problem of top-management control (M3·S40).</p>`,keys:['Time: two advantages','Time: two limitations','Territory: two advantages','Territory: two limitations'],refs:'M3·S35;M3·S40'},
 {id:'bc-8',k:'compare',m:3,mod:'m1',topic:'m1t6',q:'Distinguish entrepreneurial vs disturbance-handler roles, and disseminator vs spokesman roles.',ans:`<p><b>Entrepreneurial</b>: the manager as voluntary initiator of change, improving the unit and starting development projects. <b>Disturbance handler</b>: involuntarily responding to pressures beyond control — a strike, a bankrupt customer, delayed materials (M1·S65–66).</p><p><b>Disseminator</b>: passes privileged information to subordinates inside the unit. <b>Spokesman</b>: sends information to people outside the unit and satisfies influential people — directors, shareholders, consumer groups, government (M1·S62–63).</p>`,keys:['Entrepreneurial = voluntary change','Disturbance handler = involuntary pressure (example)','Disseminator = inside','Spokesman = outside (influential people)'],refs:'M1·S62–66'},
 // long answers (4 marks)
 {id:'bl-1',k:'long',m:4,mod:'m1',topic:'m1t4',q:'Explain the systems approach to management with a neat diagram.',ans:`<p>The organization is an <b>open system</b>, dependent on its external environment for inputs; inputs are transformed through the managerial functions; communication is essential to all phases; some outputs become inputs again (M1·S28).</p><ul><li><b>Inputs:</b> human, capital, managerial, technological; goal inputs of claimants (employees, consumers, suppliers, stockholders, governments, community).</li><li><b>Transformation:</b> planning, organizing, staffing, leading, controlling, facilitated by communication linking the organization with the environment.</li><li><b>Outputs:</b> products, services, profits, satisfaction, goal integration.</li><li><b>Feedback:</b> “reenergizing the system”; external variables — opportunities, constraints.</li></ul><p>The organization has interrelated sub-systems studied together, a boundary separating internal from external, and is itself part of a super system; it is dynamic, and management regulates it for better performance (M1·S29–30).</p>`,keys:['Open system and dependence on environment','Inputs listed','Five functions as transformation','Outputs listed','Communication and feedback','Sub-systems / super system / dynamic'],refs:'M1·S28–30'},
 {id:'bl-2',k:'long',m:4,mod:'m2',topic:'m2t2',q:'Explain the eight types of plans with an example of each from the slides where available.',ans:`<ol><li><b>Purpose/mission</b> — basic function of the enterprise (DuPont: “Better things through chemistry”).</li><li><b>Objectives</b> — important ends of activity (ROI of 12% this fiscal year).</li><li><b>Strategy</b> — long-term objectives, course of action, resources; top level.</li><li><b>Policy</b> — general guide to thinking (promote from within).</li><li><b>Procedure</b> — chronological steps (college admission).</li><li><b>Rule</b> — specific, no flexibility (no smoking zone).</li><li><b>Program</b> — complex of goals, policies, procedures, rules, tasks and resources, supported by budgets.</li><li><b>Budget</b> — expected results in numbers (labour hours, units, money); variable, program, zero-based.</li></ol><p class="small">M2·S9–18, S40</p>`,keys:['All eight named','Definition for each','Examples where the slides give them','Budget types or program definition'],refs:'M2·S9–18'},
 {id:'bl-3',k:'long',m:4,mod:'m2',topic:'m2t10',q:'Explain SWOT analysis and the TOWS matrix, with the Apple examples.',ans:`<p><b>SWOT</b> (credited to Albert Humphrey, Stanford, 1960s–70s) organizes situation-analysis data: strengths and weaknesses are internal attributes of the organization (weaknesses controllable); opportunities and threats are external attributes of the environment (threats uncontrollable) (M2·S68–72).</p><p><b>TOWS</b> interlinks internal S/W with external O/T to categorize strategies (M2·S75, S77):</p><ul><li><b>SO (Maxi-Maxi)</b> — brand + design with rising touchscreen popularity → first iPhone.</li><li><b>ST (Maxi-Mini)</b> — brand loyalty keeps customers buying Apple’s Type-C charger despite EU regulation.</li><li><b>WO (Mini-Maxi)</b> — smaller portfolio overcome to enter wearables with Apple Watch (2015).</li><li><b>WT (Mini-Mini)</b> — weak Apple TV vs growing streaming threat → Apple TV+ (M2·S80–83).</li></ul><p>The matrix is dynamic: it should be redrawn for past, present and future (M2·S84).</p>`,keys:['SWOT definition and internal/external split','Controllable vs uncontrollable','Four TOWS strategies with labels','An Apple example for each','Dynamic nature'],refs:'M2·S68–84'},
 {id:'bl-4',k:'long',m:4,mod:'m2',topic:'m2t6',q:'Explain Management by Objectives: definition, process, and system diagram.',ans:`<p><b>Definition:</b> a comprehensive managerial system integrating key managerial activities systematically, directed toward effective and efficient achievement of organizational and individual objectives (M2·S32); popularized by Drucker (1954); objectives agreed by management and employees (M2·S33).</p><p><b>Process:</b> preliminary objectives at the top → clarify organizational roles → set subordinates’ objectives → recycle objectives (M2·S37).</p><p><b>System diagram (M2·S39):</b> enterprise objectives and planning premises → KRAs → appropriate organization → superior’s objectives → superior’s recommendation + subordinate’s statement + resources → agreement → subordinate’s objectives → ongoing performance, periodic review, corrective measures → final performance → final review and appraisal, with feedback.</p><p><b>Emphasis:</b> performance appraisal, short-term objectives and motivation, long-term planning (M2·S36).</p>`,keys:['Definition','Drucker and agreed objectives','Four-step process','System diagram flow with agreement','Emphases or benefits'],refs:'M2·S32–39'},
 {id:'bl-5',k:'long',m:4,mod:'m2',topic:'m2t11',q:'Explain the BCG matrix: axes, quadrants, strategies, benefits and limitations.',ans:`<p>Developed by BCG in the 1970s; SBUs plotted by <b>market growth rate</b> and <b>relative market share</b> (SBU sales ÷ leading competitor’s sales) (M2·S86–88).</p><ul><li><b>Question marks</b> (high growth, low share): invest to build, or divest.</li><li><b>Stars</b> (high, high): continue substantial investment.</li><li><b>Cash cows</b> (low growth, high share): invest little, fund others.</li><li><b>Dogs</b> (low, low): divest.</li></ul><p><b>Strategies:</b> build/grow, hold/maintain, harvest, divest (M2·S101). <b>Benefits:</b> simple; screens opportunities; guides use of cash (M2·S98). <b>Limitations:</b> only two dimensions; data problems; high share ≠ profit; neglects synergy (M2·S99).</p>`,keys:['Axes and formula','Four quadrants','Strategy per quadrant','Two benefits','Two limitations'],refs:'M2·S86–101'},
 {id:'bl-6',k:'long',m:4,mod:'m3',topic:'m3t6',q:'Explain functional departmentation with a chart, and its strengths and weaknesses.',ans:`<p>The most widely used form: activities grouped by function — the jobs to be done — with alike activities in one department under a single chain of command, consistent with specialization and division of work; it facilitates coordination because a supervisor is in charge of one major area (M3·S36–37).</p><p><b>Chart:</b> President → Marketing, Engineering, Finance, Production, each with sub-units (e.g. Finance: financial planning, budgets, cost accounting).</p><p><b>Strengths:</b> economies of scale; in-depth knowledge and skills; functional goals; best with few products. <b>Weaknesses:</b> slow response to change; decisions pile on top; poor horizontal coordination; less innovation; restricted view of goals (M3·S38).</p>`,keys:['Definition and why widely used','Coordination benefit','Chart with sub-units','Strengths','Weaknesses'],refs:'M3·S36–38'},
 {id:'bl-7',k:'long',m:4,mod:'m1',topic:'m1t7',q:'Explain social responsibility of managers: the two views, the definition of CSR, and its drivers.',ans:`<p>Society expects responsible, ethical behaviour, yet scandals and negligence show managers don’t always act so (M1·S70). <b>Classical view:</b> the only social responsibility is to maximize profits; <b>socioeconomic view:</b> protect and improve society’s welfare (M1·S71).</p><p><b>CSR:</b> a firm’s intention, beyond legal and economic obligations, to do the right things and act in ways good for society, treating the business as a moral agent (M1·S72); also “corporate citizenship”, possibly with short-term costs but positive social and environmental change (M1·S74).</p><p><b>Drivers:</b> employees and shareholders; brand equity; ethical marketing and social awareness; environment consciousness; energy conservation and global warming; responsibility towards government (M1·S75) — paying off through employee satisfaction, goodwill and an ethical culture (M1·S76).</p>`,keys:['Society’s expectation','Classical vs socioeconomic','CSR definition','Six drivers','Why CSR pays'],refs:'M1·S70–76'}
];

D.papers.forEach(p=>PAPER[p.id]=p);
D.pyqs.forEach(q=>{PYQ[q.id]=q; q.mod = q.mod || (TOP[q.topic]?TOP[q.topic].mod:null);});
const PAT = D.patterns || {};
function pf(q, f){ if(q[f]!==undefined) return q[f]; const p=PAT[q.pat]; return p?p[f]:undefined; }
const CARDTOP = {};
MODS.forEach(m=>m.cards.forEach(c=>{c.mod=m.id; CARDTOP[c.id]=c.t;}));

const ORDER = [];
ORDER.push({id:'home', title:'Dashboard', kind:'home'});
MODS.forEach(m=>{
  ORDER.push({id:m.id, title:m.short+': overview', kind:'open', mod:m.id});
  m.topics.forEach(t=>ORDER.push({id:t.id, title:t.title, kind:'topic', mod:m.id}));
  ORDER.push({id:m.id+'-recap', title:m.short+': recap', kind:'recap', mod:m.id});
  ORDER.push({id:m.id+'-pyq', title:m.short+': PYQ practice', kind:'pyq', mod:m.id});
  ORDER.push({id:m.id+'-cards', title:m.short+': flashcards', kind:'cards', mod:m.id});
});
ORDER.push({id:'analysis', title:'PYQ exam analysis', kind:'analysis'});
ORDER.push({id:'assess', title:'Final assessment', kind:'assess'});
ORDER.push({id:'sources', title:'Sources & limitations', kind:'sources'});
const STEP = {}; ORDER.forEach((o,i)=>{o.i=i; STEP[o.id]=o;});
const COUNTED = ORDER.filter(o=>!['home','sources','assess'].includes(o.kind));
function modSteps(mid){return ORDER.filter(o=>o.mod===mid);}
function pct(list){ if(!list.length) return 0; return Math.round(100*list.filter(o=>S.done[o.id]).length/list.length); }

/* ---------------- theme ---------------- */
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='light'||S.theme==='dark') r.setAttribute('data-theme',S.theme); else r.removeAttribute('data-theme');
  const b=$('#themeBtn'); if(b){ const t=S.theme||'system'; b.innerHTML=(t==='light'?I.sun:t==='dark'?I.moon:I.auto); b.setAttribute('aria-label','Theme: '+t+'. Switch theme'); b.title='Theme: '+t; }
}

/* ---------------- small renderers ---------------- */
const SUP = {
  full:['full','From slides'], partial:['partial','Partly from slides'], low:['low','Not sufficiently covered'],
  elim:['elim','Slide-based elimination'], amb:['amb','Ambiguous in slides'], pyqtext:['partial','Uses PYQ wording']
};
function supPill(s){const v=SUP[s]||SUP.full;return `<span class="pill ${v[0]}">${v[1]}</span>`;}
function modTag(mid){const m=MOD[mid];return m?`<span class="modtag ${m.id}">M${m.no}</span>`:'';}
function refChip(r){return r?`<span class="chip ref" title="Source reference">${esc(r)}</span>`:'';}
function paperLabel(pid){const p=PAPER[pid];return p?`${p.kind} · ${p.date}`:pid;}

function box(kind, title, body){return `<div class="box ${kind}"><div class="bt">${title}</div>${body}</div>`;}
function listH(items, ol){return `<${ol?'ol':'ul'}>${items.map(i=>`<li>${i}</li>`).join('')}</${ol?'ol':'ul'}>`;}
function tableH(head, rows, cap){
  return `<div class="tablewrap"><table>${head?`<thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead>`:''}<tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0&&head?`<th scope="row">${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${cap?`<div class="cap">${cap}</div>`:''}`;
}
function treeNode(n){
  const cls = n.cls?(' '+n.cls):'';
  const inner = n.items?`<b>${n.l}</b>${n.items.map(i=>`<i>${i}</i>`).join('')}`:n.l;
  return `<li><div class="nd${n.items?' col':''}${cls}">${inner}</div>${n.c&&n.c.length?`<ul>${n.c.map(treeNode).join('')}</ul>`:''}</li>`;
}
function treeH(root, cap){return `<div class="diagram"><div class="tree"><ul>${treeNode(Object.assign({cls:'root'},root))}</ul></div>${cap?`<div class="dcap">${cap}</div>`:''}</div>`;}
function quadH(b){
  // cells order: top-left, top-right, bottom-left, bottom-right
  const cl=['q-a','q-b','q-c','q-d'];
  return `<div class="diagram"><div class="quad" role="img" aria-label="${esc(b.aria||'2 by 2 matrix')}">
    <div class="ylab">${b.y||''}</div>
    ${b.cells.slice(0,2).map((c,i)=>`<div class="cell ${c[2]||cl[i]}"><b>${c[0]}</b><span>${c[1]||''}</span></div>`).join('')}
    ${b.cells.slice(2,4).map((c,i)=>`<div class="cell ${c[2]||cl[i+2]}" style="grid-column:${i+2}"><b>${c[0]}</b><span>${c[1]||''}</span></div>`).join('')}
    <div></div><div class="ax">${b.xl?b.xl[0]:''}</div><div class="ax">${b.xl?b.xl[1]:''}</div>
    <div></div><div class="xlab">${b.x||''}</div>
  </div>${b.cap?`<div class="dcap">${b.cap}</div>`:''}</div>`;
}
function flowH(items, vertical){
  if(vertical) return `<div class="vflow">${items.map((s,i)=>`<div class="st"><div class="num">${i+1}</div><div class="tx"><b>${s[0]}</b>${s[1]?`<span>${s[1]}</span>`:''}</div></div>`).join('')}</div>`;
  return `<div class="flow">${items.map((s,i)=>`<div class="st"><span class="n">STEP ${i+1}</span><b>${s[0]}</b>${s[1]?`<span>${s[1]}</span>`:''}</div>`).join('')}</div>`;
}
function catsH(cats){return `<div class="cats">${cats.map((c,i)=>`<div class="cat ${c.cls||''}"><h4>${c.h}</h4><ul>${c.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`;}

/* ---------------- blocks ---------------- */
function rb(b){
  switch(b.t){
    case 'p': return `<p>${b.h}</p>`;
    case 'h': return `<h3 id="${b.id||''}">${b.h}</h3>`;
    case 'start': return `<div class="start"><div class="eyebrow">Start here · the simplest version</div><p>${b.h}</p></div>`;
    case 'list': return (b.title?`<p><strong>${b.title}</strong></p>`:'')+listH(b.items,b.ol);
    case 'table': return tableH(b.head,b.rows,b.cap);
    case 'steps': return flowH(b.items,b.v)+(b.cap?`<div class="cap">${b.cap}</div>`:'');
    case 'tree': return treeH(b.root,b.cap);
    case 'quad': return quadH(b);
    case 'cats': return catsH(b.cats)+(b.cap?`<div class="cap">${b.cap}</div>`:'');
    case 'pyr': return `<div class="diagram"><div class="pyr">${b.rows.map((r,i)=>`<div style="width:${Math.round(34+66*(i/(Math.max(1,b.rows.length-1))))}%">${r}</div>`).join('')}</div>${b.cap?`<div class="dcap">${b.cap}</div>`:''}</div>`;
    case 'html': return b.h;
    case 'mnemo': return box('mnemo','Mnemonic'+(b.title?' · '+b.title:''),`<div>${b.h}</div>`);
    case 'remember': return box('remember','Remember it like this',`<div>${b.h}</div>`);
    case 'confuse': return box('confuse','Don’t confuse'+(b.title?' · '+b.title:''),`<div>${b.h}</div>`);
    case 'gap': return box('gap','Not sufficiently covered in the provided slides',`<div>${b.h}</div>`);
    case 'discrep': return box('discrep','Source discrepancy',`<div>${b.h}</div>`);
    case 'three': return box('three','If you remember only three things',listH(b.items,true));
    case 'trigger': return `<div class="box trigger"><span class="bt">Recall trigger</span><span>${b.h}</span></div>`;
    case 'note': return `<div class="notice">${b.h}</div>`;
    case 'quote': return `<blockquote class="quote">${b.h}${b.ref?`<span class="src">${refChip(b.ref)}</span>`:''}</blockquote>`;
    case 'ref': return `<div class="row">${(Array.isArray(b.h)?b.h:[b.h]).map(refChip).join('')}</div>`;
    case 'check': return renderCheck(b, 'lesson');
    default: return '';
  }
}
function blocks(arr){return (arr||[]).map(rb).join('\n');}

/* ---------------- checks ---------------- */
const CHK = {};
function renderCheck(c, src){
  CHK[c.id]=Object.assign({src},c);
  const kindName = {mcq:'Quick check · multiple choice',fill:'Quick check · fill in the blank',match:'Quick check · match the pairs',order:'Quick check · arrange the steps',classify:'Quick check · sort into groups',reveal:'Quick check · recall, then reveal',scenario:'Quick check · mini scenario'}[c.kind]||'Quick check';
  const prev = S.att[c.id];
  const res = prev?`<span class="res">${prev.ok?'✓ got it last time':'↻ missed last time'}</span>`:'';
  let body='';
  if(c.kind==='mcq'||c.kind==='scenario'){
    body = `${c.sc?`<div class="notice">${c.sc}</div>`:''}<div class="q">${c.q}</div><div class="opts" role="group">${c.o.map((o,i)=>`<button type="button" class="opt" data-a="mcq" data-id="${c.id}" data-i="${i}"><span class="lt">${L[i]}</span><span>${o}</span></button>`).join('')}</div><div class="fbslot" aria-live="polite"></div>`;
  } else if(c.kind==='fill'){
    let k=0; const q=c.q.replace(/___/g,()=>{const i=k++;return `<input class="fill-in" type="text" aria-label="Blank ${i+1}" data-b="${i}" autocomplete="off" spellcheck="false">`;});
    body = `<div class="q" style="line-height:2.2">${q}</div><div class="row"><button type="button" class="btn small primary" data-a="fill" data-id="${c.id}">Check</button><button type="button" class="btn small ghost" data-a="fillshow" data-id="${c.id}">Show answers</button></div><div class="fbslot" aria-live="polite"></div>`;
  } else if(c.kind==='match'||c.kind==='classify'){
    const opts = c.kind==='match'? shuffle(c.pairs.map(p=>p[1]), hash(c.id)) : c.cats;
    const rows = c.kind==='match'? c.pairs.map(p=>p[0]) : c.items.map(x=>x[0]);
    body = `<div class="q">${c.q}</div><div>${rows.map((r,i)=>`<div class="mrow" data-r="${i}"><div>${r}</div><select aria-label="Answer for: ${esc(strip(r))}"><option value="">Choose…</option>${opts.map(o=>`<option value="${esc(strip(o))}">${strip(o)}</option>`).join('')}</select></div>`).join('')}</div><div class="row"><button type="button" class="btn small primary" data-a="match" data-id="${c.id}">Check</button></div><div class="fbslot" aria-live="polite"></div>`;
  } else if(c.kind==='order'){
    let order = shuffle(c.items.map((x,i)=>i), hash(c.id)+7);
    if(order.every((v,i)=>v===i)) order = order.slice().reverse();
    body = `<div class="q">${c.q}</div><ol class="olist">${order.map(i=>`<li data-k="${i}"><span class="ot">${c.items[i]}</span><button type="button" class="mv" data-a="mvup" aria-label="Move up">${I.up}</button><button type="button" class="mv" data-a="mvdn" aria-label="Move down">${I.down}</button></li>`).join('')}</ol><div class="row"><button type="button" class="btn small primary" data-a="order" data-id="${c.id}">Check order</button></div><div class="fbslot" aria-live="polite"></div>`;
  } else { // reveal
    body = `<div class="q">${c.q}</div><div class="row"><button type="button" class="btn small primary" data-a="reveal" data-id="${c.id}">Show answer</button></div><div class="ans" hidden><div class="reveal-a">${c.a}</div><div class="row small" style="margin-top:10px"><span class="muted">Did you recall it?</span><button type="button" class="btn small" data-a="selfok" data-id="${c.id}" data-v="1">Yes</button><button type="button" class="btn small" data-a="selfok" data-id="${c.id}" data-v="0">Not yet</button></div></div>`;
  }
  return `<section class="check" id="chk-${c.id}" data-check="${c.id}"><div class="ch">${kindName}${res}</div><div class="cb">${body}</div></section>`;
}
function record(id, ok, topic, src){
  const p=S.att[id]||{n:0};
  S.att[id]={ok:!!ok,n:(p.n||0)+1,topic:topic||p.topic||null,src:src||p.src||'lesson',ts:Date.now()};
  save();
}
function fbHTML(ok, head, body){return `<div class="fb ${ok===null?'info':ok?'ok':'no'}"><span class="fh">${head}</span>${body?`<div>${body}</div>`:''}</div>`;}

/* ---------------- PYQ cards ---------------- */
function pyqMeta(q){
  const p=PAPER[q.p]; const t=TOP[q.topic];
  return `<dl class="kv">
    <dt>Paper</dt><dd>${p?`${p.kind} mid-term · ${p.date} · ${p.sem}`:q.p}</dd>
    <dt>Question</dt><dd>Q${q.n} · ${q.m} mark${q.m===1?'':'s'}</dd>
    <dt>Module</dt><dd>${modTag(q.mod)} ${MOD[q.mod]?MOD[q.mod].title:''}</dd>
    <dt>Topic</dt><dd>${t?`<a href="#${t.id}">${t.title}</a>`:''}</dd>
    <dt>Type</dt><dd>${esc(pf(q,'type')||'')}</dd>
    ${q.co?`<dt>Paper tag</dt><dd>${esc(q.co)}</dd>`:''}
  </dl>`;
}
function pyqSummary(q, hideSup){
  const t=TOP[q.topic];
  return `<div class="ptop"><span class="pmark">${q.m} M</span><span class="chip">${esc(paperLabel(q.p))}</span><span class="chip">Q${q.n}</span>${modTag(q.mod)}${t?`<span class="chip">${esc(t.title)}</span>`:''}${hideSup?'':supPill(q.sup)}</div>`;
}
function mcqOpts(q, ctx){
  return `<div class="opts">${q.o.map((o,i)=>`<button type="button" class="opt" data-a="pmcq" data-id="${q.id}" data-i="${i}" data-ctx="${ctx||''}"><span class="lt">${i+1}</span><span>${o}</span></button>`).join('')}</div><div class="fbslot" aria-live="polite"></div>`;
}
function mcqAnswerHTML(q){
  let head;
  if(q.a===null||q.a===undefined){ head = q.alt!=null? `Slides cannot settle this one — options ${q.alt.map(i=>i+1).join(' or ')} are both defensible` : 'Not sufficiently covered in the provided slides'; }
  else head = `Slide-based answer: option ${q.a+1}`;
  return `<div class="fb info"><span class="fh">${head} ${supPill(q.sup)}</span><div>${q.why||''}</div><div class="row" style="margin-top:6px">${(q.refs||'').split(';').filter(Boolean).map(r=>refChip(r.trim())).join('')}<span class="small muted">No official answer key was supplied.</span></div></div>`;
}
function pyqCard(q, opts){
  opts=opts||{};
  const open = opts.open?' open':'';
  if(q.k==='mcq'){
    return `<details class="pyq" id="pyq-${q.id}"${open}><summary>${pyqSummary(q,opts.hideSup)}<div class="qtxt">${q.q}</div></summary><div class="pbody">${pyqMeta(q)}${mcqOpts(q,opts.ctx)}</div></details>`;
  }
  const cmd = pf(q,'cmd')||[]; const concepts = pf(q,'concepts')||[]; const plan = pf(q,'plan')||[];
  const keys = pf(q,'keys')||[]; const mis = pf(q,'mis')||[];
  const self = S.self[q.id];
  return `<details class="pyq" id="pyq-${q.id}"${open}><summary>${pyqSummary(q,opts.hideSup)}<div class="qtxt clamp">${q.q}</div></summary><div class="pbody">
    <div class="fullq">${q.q}</div>
    ${pyqMeta(q)}
    <div class="psec"><h4>What the examiner is asking</h4><p>${pf(q,'asks')||''}</p></div>
    ${cmd.length?`<div class="psec"><h4>Command words</h4><div class="cmdlist">${cmd.map(c=>`<div><b>${esc(c[0])}</b><span>${c[1]}</span></div>`).join('')}</div></div>`:''}
    ${concepts.length?`<div class="psec"><h4>Concepts that must appear</h4>${listH(concepts)}</div>`:''}
    ${plan.length?`<div class="psec"><h4>Step-by-step answer plan</h4>${listH(plan,true)}</div>`:''}
    <button type="button" class="btn primary gatebtn" data-a="gate" data-id="${q.id}">Show model answer</button>
    <div class="gated" hidden>
      ${q.sup&&q.sup!=='full'?`<div class="notice">${supPill(q.sup)} <span>${q.supNote||'Parts of this answer are limited by what the slides contain.'}</span></div>`:''}
      <div class="psec"><h4>Model answer (from the slides only)</h4><div class="booklet"><span class="mk">[${q.m}]</span>${q.ans||''}</div></div>
      ${q.dia?`<div class="psec"><h4>Diagram / table to draw</h4>${typeof q.dia==='string'?q.dia:blocks([].concat(q.dia))}</div>`:''}
      <div class="psec"><h4>Suggested structure for ${q.m} marks</h4><p>${pf(q,'struct')||''}</p></div>
      ${keys.length?`<div class="psec"><h4>Inferred answer checklist <span class="muted" style="text-transform:none;letter-spacing:0;font-family:var(--f-body)">(not an official marking scheme) · tick what your answer included</span></h4><ul class="checklist" data-self="${q.id}" data-m="${q.m}" data-topic="${q.topic}">${keys.map((k,i)=>`<li><label><input type="checkbox" data-a="selfk" data-i="${i}" ${self&&self.k&&self.k[i]?'checked':''}><span>${k}</span></label></li>`).join('')}</ul><div class="selfscore muted" data-score="${q.id}">${self?`Self-check: ${self.got}/${self.of} points covered`:'Tick the points your answer covered to log a self-check.'}</div></div>`:''}
      ${mis.length?`<div class="psec"><h4>Common mistakes and omissions</h4>${listH(mis)}</div>`:''}
      <div class="psec"><h4>Exam-writing tip</h4><p>${pf(q,'tip')||''}</p></div>
      <div class="psec"><h4>Slide references used</h4><div class="row">${(q.refs||'').split(';').filter(Boolean).map(r=>refChip(r.trim())).join('')}</div></div>
    </div>
  </div></details>`;
}

/* ---------------- sidebar ---------------- */
function renderSide(cur){
  const st = STEP[cur]||STEP.home; const curMod = st.mod;
  const link=(o,label)=>`<a href="#${o.id}" class="${o.id===cur?'cur':''}" ${o.id===cur?'aria-current="page"':''}><span class="dot ${S.done[o.id]?'done':''}" aria-hidden="true"></span><span>${label||o.title}</span></a>`;
  let h = `<nav class="nav" aria-label="Course navigation"><div class="nav-sec">${link(STEP.home,'Dashboard')}</div><div class="nav-h">Modules</div>`;
  MODS.forEach(m=>{
    const steps=modSteps(m.id); const p=pct(steps);
    h += `<details class="nav-mod" ${curMod===m.id?'open':''}><summary>${modTag(m.id)}<span>${m.short}</span><span class="chev">${I.chev}</span></summary>
      <div class="minibar" aria-hidden="true"><i style="width:${p}%;background:var(--${m.id})"></i></div>
      <div class="sub">${link(STEP[m.id],'Overview & roadmap')}${m.topics.map((t,i)=>link(STEP[t.id],`${i+1}. ${t.title}`)).join('')}${link(STEP[m.id+'-recap'],'Module recap')}${link(STEP[m.id+'-pyq'],'PYQ practice')}${link(STEP[m.id+'-cards'],'Flashcards')}</div></details>`;
  });
  h += `<div class="nav-sec" style="margin-top:16px"><div class="nav-h">Exam prep</div>${link(STEP.analysis,'PYQ exam analysis')}${link(STEP.assess,'Final assessment')}${link(STEP.sources,'Sources & limitations')}</div>`;
  h += `<div class="nav-sec"><button type="button" class="navlink" data-a="resetopen">${I.reset.replace('<svg','<svg width="16" height="16"')}<span>Reset progress…</span></button></div></nav>`;
  $('#side').innerHTML = h;
}
function renderHeaderProgress(){
  const p = pct(COUNTED);
  const el=$('#hprog'); if(el) el.innerHTML = `<span class="bar" role="progressbar" aria-label="Course progress" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></span><span class="pct">${p}%</span>`;
}

/* ---------------- page nav ---------------- */
function pnav(id){
  const st=STEP[id]; const prev=ORDER[st.i-1]; const next=ORDER[st.i+1];
  const counted = COUNTED.includes(st);
  const done = S.done[id];
  return `<nav class="pnav" aria-label="Previous and next">
    ${prev?`<a class="btn" href="#${prev.id}"><span class="lbl"><small>← Previous</small>${esc(prev.title)}</span></a>`:'<span></span>'}

let FC = {};
function deckState(m){
  if(!FC[m.id]) FC[m.id]={filter:'all',i:0,flip:false,seq:null,shuf:0};
  const st=FC[m.id];
  if(!st.seq){
    const cards=m.cards.filter(c=>st.filter==='all'||c.k===st.filter);
    const rank=c=>S.cards[c.id]==='again'?0:(S.cards[c.id]?2:1);
    let base = st.shuf? shuffle(cards, st.shuf) : cards.slice();
    base.sort((a,b)=>rank(a)-rank(b));
    st.seq = base.map(c=>c.id); st.i=Math.min(st.i, Math.max(0,st.seq.length-1));
  }
  return st;
}

/* ---------------- analysis ---------------- */
function barsSVG(data, opt){
  // data: [{label, value, cls, tip}]  horizontal bars
  opt=opt||{}; const W=640, lw=opt.lw||210, rh=26, gap=6, top=6;
  const max=opt.max||Math.max(1,...data.map(d=>d.value));
  const H=top+data.length*(rh+gap)+18;
  const scale=v=>(W-lw-44)*v/max;
  const ticks=[]; const step=opt.step||Math.max(1,Math.ceil(max/5)); for(let v=0;v<=max;v+=step) ticks.push(v);
  let g=`<g class="grid">${ticks.map(v=>`<line x1="${lw+scale(v)}" x2="${lw+scale(v)}" y1="${top-2}" y2="${H-16}"/>`).join('')}</g>`;
  g+=ticks.map(v=>`<text x="${lw+scale(v)}" y="${H-3}" text-anchor="middle">${v}</text>`).join('');
  data.forEach((d,i)=>{const y=top+i*(rh+gap); const w=Math.max(2,scale(d.value));
    g+=`<g class="h" data-tip="${esc(d.tip||(d.label+': '+d.value))}"><rect class="hit" x="0" y="${y-2}" width="${W}" height="${rh+4}"/><text class="lab" x="${lw-8}" y="${y+rh/2+4}" text-anchor="end">${esc(d.label)}</text><path class="bar ${d.cls||''}" d="M${lw},${y+3} h${w-4} a4,4 0 0 1 4,4 v${rh-14} a4,4 0 0 1 -4,4 h${-(w-4)} z"/><text class="val" x="${lw+w+6}" y="${y+rh/2+4}">${d.value}${opt.unit||''}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title||'bar chart')}">${g}</svg>`;
}
function stackSVG(rows, series, opt){
  // rows: [{label, vals:[..]}] vertical stacked columns
  opt=opt||{}; const W=640, H=260, pl=34, pb=40, pt=10; const n=rows.length; const cw=(W-pl-10)/n; const bw=Math.min(54,cw*0.62);
  const max=opt.max||Math.max(...rows.map(r=>r.vals.reduce((a,b)=>a+b,0)));
  const sy=v=>(H-pb-pt)*v/max;
  let g='<g class="grid">'; const step=opt.step||5; for(let v=0;v<=max;v+=step){const y=H-pb-sy(v); g+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}"/>`;} g+='</g>';
  for(let v=0;v<=max;v+=step){const y=H-pb-sy(v); g+=`<text x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`;}
  rows.forEach((r,i)=>{const x=pl+i*cw+(cw-bw)/2; let acc=0; let segs='';
    r.vals.forEach((v,k)=>{ if(!v) return; const h=sy(v); const y=H-pb-sy(acc)-h; segs+=`<rect class="bar ${series[k].cls}" x="${x}" y="${y+1}" width="${bw}" height="${Math.max(0,h-2)}" rx="3"/>`; acc+=v; });
    g+=`<g class="h" data-tip="${esc(r.label+' — '+series.map((s,k)=>s.name+': '+r.vals[k]).join(', '))}"><rect class="hit" x="${pl+i*cw}" y="${pt}" width="${cw}" height="${H-pb-pt}"/>${segs}<text x="${x+bw/2}" y="${H-pb+15}" text-anchor="middle" class="lab">${esc(r.short||r.label)}</text><text x="${x+bw/2}" y="${H-pb+30}" text-anchor="middle">${esc(r.sub||'')}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title||'stacked columns')}">${g}</svg>`;
}

function viewAnalysis(){

  const tbl2 = tableH(['Topic','Module','Papers','Questions','Marks'], tf.map(x=>[`<a href="#${x.t.id}">${x.t.title}</a>`,'M'+MOD[x.t.mod].no,x.papers+'/'+papers.length,String(x.n),String(x.marks)]));
  // command words
  const cw={}; qs.forEach(q=>(q.cw||[]).forEach(w=>{cw[w]=(cw[w]||0)+1;}));
  const cwData=Object.entries(cw).sort((a,b)=>b[1]-a[1]).slice(0,16).map(([k,v])=>({label:k,value:v}));

  const descHTML = descs.map((x,i)=>{

function fmtT(ms){const s=Math.ceil(ms/1000);const m=Math.floor(s/60);return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
let mockTimer=null;
function startTimer(){ clearInterval(mockTimer); mockTimer=setInterval(()=>{const M=AS.mock; if(!M||M.submitted){clearInterval(mockTimer);return;} const left=M.end-Date.now(); const el=$('#mockt'); if(el) el.textContent=fmtT(Math.max(0,left)); const ph=$('#mockphase'); if(ph) ph.textContent=Date.now()<M.start+20*60000?'Part A window (first 20 min)':'Part B'; if(left<=0){ submitMock(true); } },1000); }
function buildMock(paperId){
  let qs;
  if(paperId){ qs=D.pyqs.filter(q=>q.p===paperId).sort((a,b)=>parseFloat(a.n)-parseFloat(b.n)); return {qs, label:`${PAPER[paperId].kind} mid-term · ${PAPER[paperId].date}`}; }
  const seed=Date.now()%100000+1;
  const mpool=[...B.mcq.map(x=>Object.assign({k:'mcq'},x)), ...D.pyqs.filter(q=>q.k==='mcq'&&q.a!=null&&q.sup!=='low')];
  const want={m1:4,m2:4,m3:2}; const mc=[];
  Object.keys(want).forEach(mid=>{ shuffle(mpool.filter(x=>(x.mod||TOP[x.topic].mod)===mid),seed+mid.length).slice(0,want[mid]).forEach(x=>mc.push(x)); });
  const dpool=[...B.desc, ...D.pyqs.filter(q=>q.k==='desc'&&q.sup!=='low')];
  const slots=[4,3,3,3,3,3,2,2,2]; const used=new Set(); const ds=[];
  const pref=[ 'm2','m1','m1','m2','m3','m1','m2','m3','m1' ];
  slots.forEach((mk,i)=>{ let c=shuffle(dpool.filter(x=>x.m===mk&&!used.has(x.id)&&(x.mod||TOP[x.topic].mod)===pref[i]),seed+i*31); if(!c.length) c=shuffle(dpool.filter(x=>x.m===mk&&!used.has(x.id)),seed+i); if(c.length){used.add(c[0].id);ds.push(c[0]);} });
  // avoid duplicate topics where possible is not enforced; fine
  return {qs:[...mc,...ds], label:'Mixed mock exam'};
}
function startMock(paperId){
  const b=buildMock(paperId); const now=Date.now();
  AS.mock={qs:b.qs,label:b.label,start:now,end:now+90*60000,ans:{},txt:{},submitted:false};
  AS.tab='mock'; render(); startTimer(); window.scrollTo(0,0);
}
function submitMock(auto){
  const M=AS.mock; if(!M||M.submitted) return;
  $$('[data-mans]').forEach(t=>{M.txt[t.dataset.mans]=t.value;});
  M.submitted=true; clearInterval(mockTimer);
