  render(); toast(auto?'Time is up — answers revealed.':'Submitted — answers revealed.');
  setTimeout(()=>{ M.qs.filter(x=>x.k!=='mcq').forEach(x=>{const ta=$(`#ta-mk-${x.id}`); if(ta) ta.value=M.txt[x.id]||''; const btn=$(`[data-a="gate2"][data-id="${x.id}"]`); if(btn) openGate(btn);}); },0);
}
function weakView(){
  const topics=Object.values(TOP);
  const rows=topics.map(t=>{
    const at=Object.entries(S.att).filter(([id,a])=>a.topic===t.id);
    const n=at.length, ok=at.filter(([id,a])=>a.ok).length;
    const se=Object.values(S.self).filter(s=>s.topic===t.id); const sg=se.reduce((a,s)=>a+s.got,0), so=se.reduce((a,s)=>a+s.of,0);
    const again=MOD[t.mod].cards.filter(c=>c.t===t.id&&S.cards[c.id]==='again').length;
    const parts=[]; if(n) parts.push(ok/n); if(so) parts.push(sg/so);
    const score = parts.length? parts.reduce((a,b)=>a+b,0)/parts.length : null;
    const adj = score==null?null:Math.max(0, score - Math.min(0.2, again*0.04));
    return {t,n,ok,sg,so,again,score:adj};
  });
  const tried=rows.filter(r=>r.score!=null).sort((a,b)=>a.score-b.score);
  const untried=rows.filter(r=>r.score==null);
  if(!tried.length) return `<div class="card stack"><h2>Weak-area report</h2><p class="muted">No attempts recorded yet. Answer quick checks in the lessons, MCQs in PYQ practice, self-check descriptive answers, or sit a mock — results land here, ranked from weakest topic up.</p></div>`;
  const bar=v=>`<div class="pbar" style="height:10px"><i style="width:${Math.round(v*100)}%;background:${v<0.5?'var(--bad)':v<0.75?'var(--warn)':'var(--ok)'}"></i></div>`;
  return `<div class="card stack"><h2>Weak-area report</h2><p class="small muted">Score = average of objective accuracy and descriptive self-check coverage for each topic, lowered slightly for flashcards marked “review again”. Red under 50%, amber under 75%.</p>
    <div>${tried.map(r=>`<div class="wk"><div><a href="#${r.t.id}">${r.t.title}</a><div class="small muted">${modTag(r.t.mod)} ${r.n?`${r.ok}/${r.n} objective correct`:''}${r.so?` · self-check ${r.sg}/${r.so}`:''}${r.again?` · ${r.again} cards to review`:''}</div></div>${bar(r.score)}<div class="row"><span class="mono small">${Math.round(r.score*100)}%</span><a class="btn small" href="#${r.t.mod}-pyq" data-a="gopyq" data-t="${r.t.id}">PYQs</a></div></div>`).join('')}</div></div>
    ${untried.length?`<div class="card stack"><h3>Not practised yet</h3><div class="row">${untried.map(r=>`<a class="chip" href="#${r.t.id}">${esc(r.t.title)}</a>`).join('')}</div></div>`:''}`;
}

  else if(st.kind==='topic') html=viewTopic(TOP[st.id]);
  else if(st.kind==='recap') html=viewRecap(MOD[st.mod]);
  else if(st.kind==='pyq') html=viewPyq(MOD[st.mod]);
  else if(st.kind==='cards') html=viewCards(MOD[st.mod]);
  else if(st.kind==='analysis') html=viewAnalysis();
  else if(st.kind==='assess') html=viewAssess();
  else if(st.kind==='sources') html=viewSources();
  $('#main').innerHTML=html;
  renderSide(CUR); renderHeaderProgress();
  document.title = (st.kind==='home'?'':st.title+' · ')+'HUM 3022 Exam Desk';
  if(st.kind!=='home'){ S.last=CUR; save(); }
  // restore answered state of lesson checks
  if(focusMain){ const h1=$('#main h1'); if(h1){h1.setAttribute('tabindex','-1'); h1.focus({preventScroll:true});} }
}
function go(id, after){
  if(location.hash==='#'+id){ render(true); window.scrollTo(0,0); if(after) after(); }
  else { PENDING=after||null; location.hash=id; }
}
let PENDING=null;
window.addEventListener('hashchange',()=>{ render(true); window.scrollTo(0,0); if(PENDING){const f=PENDING;PENDING=null;setTimeout(f,0);} closeMenu(); });

function openPyq(id){
  const el=document.getElementById('pyq-'+id); if(!el) return;
  el.open=true; el.scrollIntoView({block:'start',behavior:'smooth'}); const s=el.querySelector('summary'); if(s) s.focus({preventScroll:true});
}

/* ---------------- toast ---------------- */
let toastT=null;
function toast(msg){let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},2600);}

/* ---------------- menu ---------------- */
function closeMenu(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false'); }

/* ---------------- search ---------------- */
let IDX=null;
function buildIndex(){
  IDX=[];
  MODS.forEach(m=>{
    IDX.push({g:'Pages',t:m.title,s:'Module '+m.no+' overview',r:m.id,x:norm(m.title+' '+m.overview)});
    m.topics.forEach(t=>{
      const txt=norm((t.blocks||[]).map(b=>b.h||(b.items?b.items.join(' '):'')+(b.rows?JSON.stringify(b.rows):'')+(b.q||'')+(b.cats?JSON.stringify(b.cats):'')).join(' '));
      IDX.push({g:'Topics',t:t.title,s:'M'+m.no+' · '+t.slides,r:t.id,x:norm(t.title)+' '+txt});
      (t.blocks||[]).filter(b=>b.t==='h').forEach(b=>IDX.push({g:'Topics',t:strip(b.h),s:t.title,r:t.id,x:norm(b.h),sec:true}));
    });
    m.recap.defs.forEach(d=>IDX.push({g:'Key terms',t:strip(d[0]),s:strip(d[1]).slice(0,90),r:m.id+'-recap',x:norm(d[0]+' '+d[1])}));
    m.cards.forEach(c=>IDX.push({g:'Flashcards',t:strip(c.f).slice(0,90),s:strip(c.b).slice(0,90),r:m.id+'-cards',x:norm(c.f+' '+c.b),card:c.id}));
  });
  D.pyqs.forEach(q=>IDX.push({g:'PYQs',t:strip(q.q).slice(0,110),s:paperLabel(q.p)+' · Q'+q.n+' · '+q.m+' M',r:q.mod+'-pyq',x:norm(q.q+' '+(q.o?q.o.join(' '):'')),pyq:q.id}));
  [['analysis','PYQ exam analysis'],['assess','Final assessment · mock exam · weak areas'],['sources','Sources and limitations']].forEach(([r,t])=>IDX.push({g:'Pages',t,s:'',r,x:norm(t)}));
}
function searchOpen(){
  if(!IDX) buildIndex();
  const o=document.createElement('div'); o.className='overlay'; o.id='searchOv';
  o.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="Search"><div class="dh">${I.search.replace('<svg','<svg width="18" height="18"')}<input id="sq" type="search" placeholder="Search topics, key terms, PYQs…" aria-label="Search" autocomplete="off"><button type="button" class="iconbtn" data-a="searchclose" aria-label="Close search">${I.x}</button></div><div class="dres" id="sres" role="listbox"><div class="sgroup">Try: unity of command · TOWS · span of control · Theory Z · matrix</div></div></div>`;
  document.body.appendChild(o); const inp=$('#sq'); inp.focus();
  let sel=0;
  const run=()=>{
    const q=norm(inp.value); const res=$('#sres');
    if(q.length<2){res.innerHTML='<div class="sgroup">Type at least two letters</div>';return;}
    const words=q.split(' ');
    const hits=IDX.map(e=>{let sc=0; const tt=norm(e.t); words.forEach(w=>{ if(tt.includes(w)) sc+=3; else if(e.x.includes(w)) sc+=1; else sc-=5; }); if(tt.includes(q)) sc+=4; return {e,sc};}).filter(h=>h.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,40);
    if(!hits.length){res.innerHTML='<div class="sgroup">No matches in the slides or PYQs</div>';return;}
    const groups={}; hits.forEach(h=>{(groups[h.e.g]=groups[h.e.g]||[]).push(h.e);});
    const mark=s=>{let out=esc(s); words.forEach(w=>{ if(w.length<2) return; out=out.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');}); return out;};
    let k=0; res.innerHTML=['Topics','Key terms','PYQs','Flashcards','Pages'].filter(g=>groups[g]).map(g=>`<div class="sgroup">${g}</div>`+groups[g].slice(0,g==='PYQs'?12:8).map(e=>`<button type="button" class="sres" role="option" data-a="sgo" data-r="${e.r}" ${e.pyq?`data-q="${e.pyq}"`:''} ${e.card?`data-c="${e.card}"`:''} data-k="${k++}"><b>${mark(e.t)}</b><span>${esc(e.s)}</span></button>`).join('')).join('');
    sel=0; hl();
  };
  const hl=()=>{$$('.sres',o).forEach((b,i)=>b.classList.toggle('sel',i===sel)); const b=$$('.sres',o)[sel]; if(b) b.scrollIntoView({block:'nearest'});};
  inp.addEventListener('input',run);
  inp.addEventListener('keydown',e=>{const n=$$('.sres',o).length; if(e.key==='ArrowDown'){sel=Math.min(n-1,sel+1);hl();e.preventDefault();} else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);hl();e.preventDefault();} else if(e.key==='Enter'){const b=$$('.sres',o)[sel]; if(b) b.click();}});
  o.addEventListener('click',e=>{ if(e.target===o) searchClose(); });
}
function searchClose(){const o=$('#searchOv'); if(o) o.remove(); const b=$('#searchBtn'); if(b) b.focus();}

/* ---------------- reset dialog ---------------- */
function resetOpen(){
  const o=document.createElement('div'); o.className='overlay'; o.id='resetOv';
  o.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rsh"><div class="dbody"><h2 id="rsh">Reset progress?</h2><p class="muted">This clears completed steps, quick-check results, flashcard ratings, self-checks and mock scores saved in this browser. It cannot be undone.</p><div class="row"><button type="button" class="btn danger" data-a="resetgo">Reset everything</button><button type="button" class="btn" data-a="resetno">Cancel</button></div></div></div>`;
  document.body.appendChild(o); $('[data-a="resetno"]',o).focus();
  o.addEventListener('click',e=>{ if(e.target===o) o.remove(); });
}

/* ---------------- gates ---------------- */
function openGate(btn){ const g=btn.nextElementSibling; if(g&&g.classList.contains('gated')){ g.hidden=!g.hidden; btn.textContent=g.hidden?(btn.dataset.a==='gate2'?'Reveal model answer':'Show model answer'):'Hide model answer'; } }

/* ---------------- event handling ---------------- */
const ACT = {
  menu(){ const s=$('#side'); const open=!s.classList.contains('open'); s.classList.toggle('open',open); $('#scrim').classList.toggle('open',open); $('#menuBtn').setAttribute('aria-expanded',String(open)); if(open){const a=$('#side a.cur')||$('#side a'); if(a) a.focus();} },
  scrim(){ closeMenu(); },
  theme(){ const order=[null,'light','dark']; const i=order.indexOf(S.theme||null); S.theme=order[(i+1)%3]; save(); applyTheme(); toast('Theme: '+(S.theme||'follow system')); },
  search(){ searchOpen(); },
  searchclose(){ searchClose(); },
  sgo(el){ const r=el.dataset.r, q=el.dataset.q, c=el.dataset.c; searchClose();
    if(c){ const mid=r.replace('-cards',''); const st=FC[mid]; if(st){st.filter='all';st.seq=null;} const s2=deckState(MOD[mid]); s2.i=Math.max(0,s2.seq.indexOf(c)); s2.flip=false; }
    if(q){ const qq=PYQ[q]; if(PYQF[qq.mod]) PYQF[qq.mod]={k:'all',p:'all'}; }
    go(r, q?()=>openPyq(q):null); },
  resetopen(){ closeMenu(); resetOpen(); },
  resetno(el){ const o=$('#resetOv'); if(o) o.remove(); },
  resetgo(){ const th=S.theme; S=fresh(); S.theme=th; save(); FC={}; PYQF={}; AS.mock=null; clearInterval(mockTimer); const o=$('#resetOv'); if(o) o.remove(); render(); toast('Progress reset'); },
  next(el){ const id=el.dataset.id; if(COUNTED.includes(STEP[id])) { S.done[id]=true; save(); } go(el.dataset.to); },
  toggledone(el){ const id=el.dataset.id; S.done[id]=!S.done[id]; save(); render(); toast(S.done[id]?'Marked complete':'Marked not complete'); },
  gate(el){ openGate(el); },
  gate2(el){ openGate(el); },
  gopyq(el,e){ e.preventDefault(); const q=el.dataset.q, t=el.dataset.t; const mid = q?PYQ[q].mod:TOP[t].mod; PYQF[mid]={k:'all',p:'all'};
    go(mid+'-pyq', ()=>{ if(q) openPyq(q); else { const g=document.getElementById('grp-'+t); if(g) g.scrollIntoView({block:'start',behavior:'smooth'}); } }); },
  pf(el){ PYQF[el.dataset.m]=Object.assign(PYQF[el.dataset.m]||{k:'all',p:'all'},{[el.dataset.f]:el.dataset.v}); render(); },
  /* lesson checks */
  mcq(el){ const c=CHK[el.dataset.id]; const i=+el.dataset.i; const wrap=el.closest('.check'); if(wrap.dataset.answered) return; wrap.dataset.answered='1';
    $$('.opt',wrap).forEach((b,k)=>{b.disabled=true; b.classList.add(k===c.a?'right':(k===i?'wrong':'dim'));});
    const ok=i===c.a; record(c.id, ok, c.topic, c.src);
    $('.fbslot',wrap).innerHTML = fbHTML(ok, ok?'Correct.':`Not quite — the answer is ${L[c.a]}.`, `${(!ok&&c.ow&&c.ow[i])?c.ow[i]+' ':''}${c.why||''}`); },
  fill(el){ const c=CHK[el.dataset.id]; const wrap=el.closest('.check'); const ins=$$('input.fill-in',wrap); let all=true;
    ins.forEach((inp,k)=>{ const v=norm(inp.value); const acc=(c.a[k]||[]).map(norm); const ok=acc.some(a=>v===a||(a.length>4&&v.length>3&&(v.includes(a)||a.includes(v)))); inp.classList.toggle('ok',ok); inp.classList.toggle('no',!ok); if(!ok) all=false; });
    record(c.id, all, c.topic, c.src);
    $('.fbslot',wrap).innerHTML=fbHTML(all, all?'All blanks correct.':'Some blanks need another look.', `Expected: ${c.a.map((a,k)=>`<b>${k+1}.</b> ${a[0]}`).join(' · ')}. ${c.why||''}`); },
  fillshow(el){ const c=CHK[el.dataset.id]; const wrap=el.closest('.check'); $$('input.fill-in',wrap).forEach((inp,k)=>{inp.value=c.a[k][0];}); $('.fbslot',wrap).innerHTML=fbHTML(null,'Answers filled in',c.why||''); },
  match(el){ const c=CHK[el.dataset.id]; const wrap=el.closest('.check'); let all=true; const rows=$$('.mrow',wrap);
    rows.forEach((r,k)=>{ const v=$('select',r).value; const want = c.kind==='match'?strip(c.pairs[k][1]):strip(c.cats[c.items[k][1]]); const ok=v===want; r.classList.toggle('ok',ok); r.classList.toggle('no',!ok); const old=$('.fix',r); if(old) old.remove(); if(!ok){ all=false; r.insertAdjacentHTML('beforeend',`<div class="fix">Answer: ${esc(want)}</div>`);} });
    record(c.id, all, c.topic, c.src);
    $('.fbslot',wrap).innerHTML=fbHTML(all, all?'All matched correctly.':'Corrections are shown under each row.', c.why||''); },
  mvup(el){ const li=el.closest('li'); const p=li.previousElementSibling; if(p) li.parentNode.insertBefore(li,p); el.focus(); },
  mvdn(el){ const li=el.closest('li'); const n=li.nextElementSibling; if(n) li.parentNode.insertBefore(n,li); el.focus(); },
  order(el){ const c=CHK[el.dataset.id]; const wrap=el.closest('.check'); const lis=$$('.olist li',wrap); let all=true;
    lis.forEach((li,k)=>{ const ok=+li.dataset.k===k; li.classList.toggle('ok',ok); li.classList.toggle('no',!ok); if(!ok) all=false; });
    record(c.id, all, c.topic, c.src);
    $('.fbslot',wrap).innerHTML=fbHTML(all, all?'Correct order.':'Not in the right order yet.', `Correct sequence: ${c.items.map((x,k)=>`<b>${k+1}.</b> ${x}`).join(' → ')}. ${c.why||''}`); },
  reveal(el){ const wrap=el.closest('.check'); $('.ans',wrap).hidden=false; el.hidden=true; },
  selfok(el){ const c=CHK[el.dataset.id]; const ok=el.dataset.v==='1'; record(c.id, ok, c.topic, c.src); const wrap=el.closest('.check'); $('.ch .res',wrap)?$('.ch .res',wrap).textContent=ok?'✓ recalled':'↻ review later':$('.ch',wrap).insertAdjacentHTML('beforeend',`<span class="res">${ok?'✓ recalled':'↻ review later'}</span>`); toast(ok?'Logged as recalled':'Logged for review'); },
  /* PYQ MCQ */
  pmcq(el){ const q=PYQ[el.dataset.id]; const i=+el.dataset.i; const wrap=el.closest('.pbody')||el.closest('.qcard'); if(wrap.dataset.answered) return; wrap.dataset.answered='1';
    $$('.opt',wrap).forEach((b,k)=>{b.disabled=true; if(q.a!=null) b.classList.add(k===q.a?'right':(k===i?'wrong':'dim')); else if(q.alt&&q.alt.includes(k)) b.classList.add('right'); else if(k===i) b.classList.add('wrong'); else b.classList.add('dim');});
    if(q.a!=null) record(q.id, i===q.a, q.topic, 'pyq');
    const verdict = q.a==null? fbHTML(null,'Your pick: option '+(i+1),'') : fbHTML(i===q.a, i===q.a?'Matches the slide-based answer.':'Differs from the slide-based answer.', '');
    $('.fbslot',wrap).innerHTML = verdict + mcqAnswerHTML(q); },
  /* self-check keywords */
  selfk(el){ const ul=el.closest('[data-self]'); const id=ul.dataset.self; const boxes=$$('input[type=checkbox]',ul); const k=boxes.map(b=>b.checked); const got=k.filter(Boolean).length;
    S.self[id]={got,of:boxes.length,k,topic:ul.dataset.topic,m:+ul.dataset.m}; save(); const sc=$(`[data-score="${id}"]`); if(sc) sc.textContent=`Self-check: ${got}/${boxes.length} points covered (≈ ${Math.round(2*(+ul.dataset.m)*got/boxes.length)/2} of ${ul.dataset.m} marks, unofficial)`; },
  tick(el){ S.ticks[el.dataset.k]=el.checked; save(); },
  /* flashcards */
  fcflip(el){ const m=MOD[el.dataset.m]; const st=deckState(m); st.flip=!st.flip; const fc=$('#fc'); if(fc){ fc.classList.toggle('flip',st.flip); $$('.fc-face',fc).forEach(f=>f.setAttribute('aria-hidden', f.classList.contains('back')?String(!st.flip):String(st.flip))); } },
  fcnext(el){ const st=deckState(MOD[el.dataset.m]); st.i=(st.i+1)%st.seq.length; st.flip=false; render(); $('.fc-in')&&$('.fc-in').focus(); },
  fcprev(el){ const st=deckState(MOD[el.dataset.m]); st.i=(st.i-1+st.seq.length)%st.seq.length; st.flip=false; render(); $('.fc-in')&&$('.fc-in').focus(); },
  fcshuf(el){ const st=deckState(MOD[el.dataset.m]); st.shuf=Math.floor(Math.random()*1e6)+1; st.seq=null; st.i=0; st.flip=false; deckState(MOD[el.dataset.m]); render(); toast('Shuffled — cards marked “review again” stay in front'); },
  fcknow(el){ rate(el.dataset.m,'know'); },
  fcagain(el){ rate(el.dataset.m,'again'); },
  fcf(el){ const st=deckState(MOD[el.dataset.m]); st.filter=el.dataset.v; st.seq=null; st.i=0; st.flip=false; render(); },
  fcreset(el){ const m=MOD[el.dataset.m]; m.cards.forEach(c=>delete S.cards[c.id]); save(); const st=deckState(m); st.seq=null; st.i=0; render(); toast('Ratings cleared for this deck'); },
  /* assessment */
  atab(el){ AS.tab=el.dataset.v; render(); },
  apk(el){ AS.pk=el.dataset.v; AS.seed=Math.floor(Math.random()*1e6)+1; render(); },
  newset(){ AS.seed=Math.floor(Math.random()*1e6)+1; render(); },
  openpaper(el){ AS.paper=el.dataset.p; render(); window.scrollTo(0,0); },
  closepaper(){ AS.paper=null; render(); },
  mockpaper(el){ startMock(el.dataset.p); },
  mockstart(){ startMock(null); },
  mockpick(el){ const M=AS.mock; if(!M||M.submitted) return; M.ans[el.dataset.id]=+el.dataset.i; const card=el.closest('.qcard'); $$('.opt',card).forEach(b=>{const on=b===el; b.classList.toggle('right',on); b.setAttribute('aria-pressed',String(on));}); },
  mocksubmit(){ submitMock(false); },
  mocksave(){ const M=AS.mock; if(!M) return; const mcqs=M.qs.filter(x=>x.k==='mcq'), descs=M.qs.filter(x=>x.k!=='mcq');
    const mcq=mcqs.reduce((a,x)=>a+(M.ans[x.id]===x.a?0.5:0),0); const desc=descs.reduce((a,x)=>{const s=S.self[x.id];return a+(s&&s.of?Math.round(2*x.m*s.got/s.of)/2:0);},0);
    S.mocks=S.mocks||[]; S.mocks.push({ts:Date.now(),label:M.label,mcq,desc,score:mcq+desc,of:30}); save(); const b=$('[data-live="desc"]'); if(b) b.textContent=desc+'/25'; toast(`Saved: ${mcq+desc}/30`); },
  mockclear(){ AS.mock=null; render(); }
};
function rate(mid, v){ const m=MOD[mid]; const st=deckState(m); const id=st.seq[st.i]; S.cards[id]=v; save(); st.i=(st.i+1)%st.seq.length; st.flip=false; render(); toast(v==='know'?'Marked as known':'Will come back first next time'); $('.fc-in')&&$('.fc-in').focus(); }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a; if(a==='selfk'||a==='tick'||a==='pfsel'||a==='asel') return; // handled on change
  if(ACT[a]){ if(el.tagName==='A'&&a!=='gopyq'){} ACT[a](el,e); }
});
document.addEventListener('change',e=>{
  const el=e.target; const a=el.dataset&&el.dataset.a;
  if(a==='selfk') ACT.selfk(el); else if(a==='tick') ACT.tick(el);
  else if(a==='pfsel'){ PYQF[el.dataset.m]=Object.assign(PYQF[el.dataset.m]||{k:'all',p:'all'},{p:el.value}); render(); }
  else if(a==='asel'){ AS[el.dataset.f]=el.value; AS.seed=Math.floor(Math.random()*1e6)+1; render(); }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset&&t.dataset.mans&&AS.mock) AS.mock.txt[t.dataset.mans]=t.value; });
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(); const typing = tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Escape'){ if($('#searchOv')){searchClose();return;} if($('#resetOv')){$('#resetOv').remove();return;} closeMenu(); }
  if(typing) return;
  if(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){ e.preventDefault(); if(!$('#searchOv')) searchOpen(); return; }
  const st=STEP[CUR];
  if(st&&st.kind==='cards'&&!$('#searchOv')){
    const m=st.mod; const k=e.key.toLowerCase();
    if(e.key===' '||e.key==='Enter'){ if(e.target.closest&&e.target.closest('button,a')&&!e.target.classList.contains('fc-in')) return; e.preventDefault(); ACT.fcflip({dataset:{m}}); }
    else if(e.key==='ArrowRight'){ ACT.fcnext({dataset:{m}}); }
    else if(e.key==='ArrowLeft'){ ACT.fcprev({dataset:{m}}); }
    else if(k==='k'){ rate(m,'know'); } else if(k==='r'){ rate(m,'again'); }
  }
});
/* tooltips for charts */
document.addEventListener('mousemove',e=>{
  const g=e.target.closest&&e.target.closest('[data-tip]'); let t=$('#tip');
  if(!g){ if(t) t.hidden=true; return; }
  if(!t){t=document.createElement('div');t.id='tip';t.className='tip';document.body.appendChild(t);}
  t.hidden=false; t.textContent=g.dataset.tip; const x=Math.min(window.innerWidth-280,e.clientX+14); t.style.left=x+'px'; t.style.top=(e.clientY+14)+'px';
});

/* ---------------- boot ---------------- */
applyTheme();
$('#searchBtn').addEventListener('click',()=>searchOpen());
render(false);
if(location.hash&&location.hash!=='#home'){ window.scrollTo(0,0); }
window.__EOM = {S:()=>S, ORDER, go};
})();

</script>
